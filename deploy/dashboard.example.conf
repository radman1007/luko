# ---------------------------------------------------------------------------
# داشبوردِ مدیریت — نمونه. نسخه‌ی واقعی (deploy/dashboard.conf) فقط روی سرور است و در
# git نیست، چون نشانیِ پنهانِ داشبورد در آن است. «__DASHBOARD_PATH__» را با همان مقدارِ
# DASHBOARD_PATH در .env عوض کنید (مثلاً manage-<۳۲ نویسه‌ی تصادفی>).
#
# لایه‌ی اصلیِ امنیت ورودِ دومرحله‌ای و دسترسی‌های سمتِ سرور است؛ نشانیِ پنهان فقط
# سر و صدای اسکنرها را دور می‌کند.
# ---------------------------------------------------------------------------

# ورود: سقفِ تلاش از هر IP (کنارِ سقفِ خودِ جنگو برای هر شماره)
location ^~ /__DASHBOARD_PATH__/api/auth/ {
    limit_req zone=luko_dash burst=10 nodelay;
    proxy_pass http://$luko_web;
    include /etc/nginx/snippets/proxy.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# بقیه‌ی API داشبورد (بارگذاریِ صوتِ پادکست تا ۱۰۰ مگابایت)
location ^~ /__DASHBOARD_PATH__/api/ {
    client_max_body_size 100m;
    proxy_pass http://$luko_web;
    include /etc/nginx/snippets/proxy.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# خودِ اپِ داشبورد (dashboard.html همان پوسته برای همه‌ی مسیرهایش)
location ^~ /__DASHBOARD_PATH__/ {
    try_files /dashboard.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # با تزریقِ همین سیاست در آزمونِ مرورگر سنجیده شد: هیچ نقضی، بی 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
}
