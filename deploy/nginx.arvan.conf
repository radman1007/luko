    location /media/ {
        alias /var/www/media/;
        types {
            audio/mpeg mp3;
            audio/mp4  m4a;
            audio/aac  aac;
            audio/ogg  ogg oga opus;
            audio/wav  wav;
            video/mp4  mp4;
            video/webm webm;
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
            image/gif  gif;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
