# ---------------------------------------------------------------------------
# لوکو پشتِ CDN آروان.
#
# TLS روی لبه‌ی آروان تمام می‌شود و ترافیک با http به این سرور می‌رسد، پس اینجا
# فقط پورت ۸۰ می‌شنویم و ریدایرکتِ https نمی‌زنیم (وگرنه حلقه درست می‌شود).
# جنگو از هدرِ X-Forwarded-Proto که آروان می‌فرستد می‌فهمد اصلِ درخواست https بوده.
#
#   my.luko.ir     → اپِ دانش‌آموز
#   panel.luko.ir  → همان اپ، ولی صفحه‌ی اولش پنلِ والدین است
# ---------------------------------------------------------------------------

# IPهای لبه‌ی آروان که X-Forwarded-For واقعی را می‌فرستند
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    # DNSِ داخلیِ داکر: نامِ سرویس در هر درخواست دوباره resolve می‌شود
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $luko_web web:8000;
    listen 80 default_server;
    server_name my.luko.ir panel.luko.ir;

    root /var/www/luko;
    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------- API و ادمین ----------
    location /api/ {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /healthz {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
        access_log off;
    }

    location /admin/ {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /static/ { alias /var/www/static/; expires 30d; access_log off; }
    location /media/  { alias /var/www/media/;  expires 7d;  access_log off; }

    # ---------- استاتیک ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/(characters|favicon|apple-touch-icon) {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /games/assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /games/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---------- SPA ----------
    # روی panel.luko.ir، ریشه مستقیم به پنلِ والدین می‌رود؛ بقیه‌ی مسیرها
    # دستِ روترِ سمتِ کلاینت است.
    location = / {
        if ($host = panel.luko.ir) { return 302 /parent-panel; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $luko_web web:8000;
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name my.luko.ir panel.luko.ir;

    root /var/www/luko;
    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------- API و ادمین ----------
    location /api/ {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /healthz {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
        access_log off;
    }

    location /admin/ {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /static/ { alias /var/www/static/; expires 30d; access_log off; }
    location /media/  { alias /var/www/media/;  expires 7d;  access_log off; }

    # ---------- استاتیک ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/(characters|favicon|apple-touch-icon) {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /games/assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /games/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---------- SPA ----------
    # روی panel.luko.ir، ریشه مستقیم به پنلِ والدین می‌رود؛ بقیه‌ی مسیرها
    # دستِ روترِ سمتِ کلاینت است.
    location = / {
        if ($host = panel.luko.ir) { return 302 /parent-panel; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
