# ---------------------------------------------------------------------------
# لوکو پشتِ CDN آروان.
#
# TLS روی لبه‌ی آروان تمام می‌شود و ترافیک با http به این سرور می‌رسد، پس اینجا
# فقط پورت ۸۰ می‌شنویم و ریدایرکتِ https نمی‌زنیم (وگرنه حلقه درست می‌شود).
# جنگو از هدرِ X-Forwarded-Proto که آروان می‌فرستد می‌فهمد اصلِ درخواست https بوده.
#
#   my.luko.ir     → اپِ دانش‌آموز
#   panel.luko.ir  → همان اپ، ولی صفحه‌ی اولش پنلِ والدین است
# ---------------------------------------------------------------------------

# سقفِ برداشتِ فایلِ بازی از هر IP. لینک امضا دارد، ولی این هم جلوی
# پویشِ پیاپی را می‌گیرد.
# نسخه‌ی nginx در صفحه‌های خطا و هدرها نیاید
server_tokens off;

limit_req_zone $binary_remote_addr zone=luko_games:10m rate=30r/m;
# سقفِ تلاش روی ورودِ ادمین — جلوی حدسِ پیاپیِ رمز را می‌گیرد
limit_req_zone $binary_remote_addr zone=luko_admin:10m rate=20r/m;

# ---------- سئو ----------
# همه‌ی مسیرهای اپ یک index.html دارند، پس عنوان، توضیح و canonicalِ هر صفحه
# این‌جا تعیین می‌شود و در `location = /index.html` جایگزین می‌شود. سمتِ سرور
# است چون ربات‌ها و پیش‌نمایشِ لینکِ پیام‌رسان‌ها جاوااسکریپت اجرا نمی‌کنند.
#
# `$request_uri` نه `$uri`: داخلِ آن location مقدارِ `$uri` همیشه /index.html است.
# فقط دو صفحه‌ی ورود عمومی‌اند؛ هر دو دامنه یک اپ‌اند، پس canonical نسخه‌ی
# تکراری را به دامنه‌ی اصلیِ همان پنل برمی‌گرداند. باقیِ مسیرها پشتِ ورودند.
map $request_uri $luko_seo_page {
    ~^/parent-login(?:\?|$)  parent;
    ~^/login(?:\?|$)         kid;
    ~^/(?:\?|$)              kid;
    default                  private;
}

map $luko_seo_page $luko_seo_head {
    parent  '<link rel="canonical" href="https://panel.luko.ir/parent-login" /><meta property="og:url" content="https://panel.luko.ir/parent-login" />';
    kid     '<link rel="canonical" href="https://my.luko.ir/login" /><meta property="og:url" content="https://my.luko.ir/login" />';
    default '';
}

# متن‌ها از خودِ صفحه‌ها برداشته شده‌اند؛ پیش‌فرض همان عنوان و توضیحِ index.html است.
map $luko_seo_page $luko_seo_title {
    parent  'پنل والدین لوکو | LUKO';
    default 'لوکو | LUKO';
}

map $luko_seo_page $luko_seo_description {
    parent  'پنل والدین لوکو: گزارشِ هفتگی از تمرین و پیشرفتِ فرزندتان، و حال و روحیه‌اش — بدونِ خواندنِ نوشته‌های خصوصی.';
    default 'لوکو — پلتفرم آموزشی و سرگرمی کودکان';
}

# صفحه‌های پشتِ ورود ایندکس نشوند. مقدارِ خالی یعنی nginx اصلاً هدر را نمی‌فرستد.
map $luko_seo_page $luko_seo_robots {
    private 'noindex';
    default '';
}

# IPهای لبه‌ی آروان که X-Forwarded-For واقعی را می‌فرستند
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    # DNSِ داخلیِ داکر: نامِ سرویس در هر درخواست دوباره resolve می‌شود
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $luko_web web:8000;
    listen 80 default_server;
    server_name my.luko.ir panel.luko.ir;

    root /var/www/luko;
    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------- API و ادمین ----------
    location /api/ {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /healthz {
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
        access_log off;
    }

    # پنلِ ادمین. نشانی عمداً «admin/» نیست: هر اسکنری اول همان را می‌زند.
    # باید با DJANGO_ADMIN_URL در .env یکی بماند، وگرنه ۴۰۴ می‌گیرد.
    location /v1a2n3r4/ {
        limit_req zone=luko_admin burst=10 nodelay;
        proxy_pass http://$luko_web;
        include /etc/nginx/snippets/proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # اپ SAMEORIGIN می‌دهد چون بازی‌ها داخلِ iframeِ هم‌ریشه اجرا می‌شوند،
        # ولی پنل هیچ‌وقت فریم نمی‌شود. هدرِ اپ اول برداشته می‌شود تا دو
        # X-Frame-Options متناقض فرستاده نشود.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
    }

    location /static/ { alias /var/www/static/; expires 30d; access_log off; }
    location /media/  { alias /var/www/media/;  expires 7d;  access_log off; }

    # فایل‌های نقطه‌دار سرو نشوند — مثلاً .DS_Storeِ مک که همراهِ public کپی می‌شد و
    # فهرستِ فایل‌ها را لو می‌داد. پیش از بقیه‌ی regexها تا آن‌ها زودتر تطبیق نخورند.
    location ~ /\. {
        return 404;
    }

    # ---------- استاتیک ----------
    # یک هدرِ Cache-Controlِ کامل، نه `expires` + `add_header`؛ دو هدرِ
    # هم‌زمان باعث می‌شد CDN همیشه MISS بدهد و همه‌ی فایل‌ها به سرور بخورند.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* ^/(characters|favicon|apple-touch-icon) {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location /games/assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # بازی‌های استودیو دارایی‌هایشان را نسبی صدا می‌زنند (`icons/coin.png` کنارِ
    # خودِ فایلِ بازی در /games/). دارایی‌ها یک‌جا در /games/assets/ می‌مانند و
    # این سه مسیر همان‌جا می‌روند — بی‌آنکه نسخه‌ی دوم از فایل‌ها بسازیم.
    location ~* ^/games/(icons|musics|fonts)/(.+)$ {
        # بی‌توجه به بزرگی/کوچکیِ حرف: بعضی بازی‌ها «Icons/…» نوشته‌اند
        alias /var/www/luko/games/assets/$1/$2;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ---------- فایل‌های بازی: فقط با لینکِ امضاشده ----------
    # تا امروز هرکس بدونِ حساب می‌توانست همه‌ی بازی‌ها را دانلود کند. حالا
    # امضا را سرور می‌دهد و فقط برای مرحله‌ای که همان کاربر بازش کرده.
    location ~ ^/games/.+\.html$ {
        include /etc/nginx/snippets/game_link_secret.conf;
        secure_link $arg_k,$arg_e;
        secure_link_md5 "$secure_link_expires$uri$luko_game_secret";

        if ($secure_link = "")  { return 403; }   # امضا غلط یا نبود
        if ($secure_link = "0") { return 410; }   # منقضی شده

        limit_req zone=luko_games burst=10 nodelay;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---------- /games : هم مسیرِ SPA است هم پوشه‌ی فایل‌ها ----------
    # نقشه‌ی سیزن روی `/games` نشسته، ولی روی دیسک هم پوشه‌ای به همین نام
    # هست. بدونِ این دو تطبیقِ صریح، `try_files $uri $uri/` پوشه را پیدا
    # می‌کرد، ۳۰۱ به `/games/` می‌داد و بعد چون فهرستِ پوشه بسته است ۴۰۳
    # برمی‌گشت — یعنی صفحه فقط روی سرور می‌شکست، نه در توسعه.
    # `location =` بر همه‌ی تطبیق‌های پیشوندی مقدم است.
    # هر دو به همان پوسته‌ی index.html می‌روند تا هدرها و سئو فقط یک‌جا باشند
    location = /games {
        rewrite ^ /index.html last;
    }
    location = /games/ {
        rewrite ^ /index.html last;
    }

    location /games/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # پوسته‌ی اپ — همه‌ی مسیرهای SPA به این‌جا می‌رسند.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";

        # همین که این‌جا add_header هست، هدرهای امنیتیِ سطحِ server به ارث
        # نمی‌رسند؛ /login و /parent-login تا امروز بدونِ همه‌شان سرو می‌شدند.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # سئو (mapهای luko_seo بالای فایل)
        add_header X-Robots-Tag $luko_seo_robots always;
        sub_filter_once off;
        sub_filter '<!--luko:seo-->' $luko_seo_head;
        sub_filter 'لوکو | LUKO' $luko_seo_title;
        sub_filter 'لوکو — پلتفرم آموزشی و سرگرمی کودکان' $luko_seo_description;
    }

    # ---------- SPA ----------
    # روی panel.luko.ir، ریشه مستقیم به پنلِ والدین می‌رود؛ بقیه‌ی مسیرها
    # دستِ روترِ سمتِ کلاینت است.
    location = / {
        if ($host = panel.luko.ir) { return 302 /parent-panel; }
        rewrite ^ /index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # بازی‌ها در iframeِ هم‌ریشه اجرا می‌شوند، پس SAMEORIGIN لازم است
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}

