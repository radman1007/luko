# هدرهای مشترکِ همه‌ی مسیرهایی که به جنگو پروکسی می‌شوند.
# نبودنِ Host یعنی جنگو درخواست را با ALLOWED_HOSTS رد می‌کند (۴۰۰).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# فقط IPِ واقعی (بعد از real_ip)، نه زنجیره‌ای که کاربر هم می‌تواند اولش چیزی بگذارد:
# جنگو اولین مقدارِ این هدر را IPِ کاربر می‌گیرد.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_read_timeout 60s;
