# ---------------------------------------------------------------------------
# استقرارِ لوکو پشتِ CDN آروان (TLS روی لبه تمام می‌شود، مبدأ فقط http).
# نسخه‌ی مستقل با گواهیِ خودِ سرور: docker-compose.yml
#   nginx  → استاتیکِ فرانت + پروکسیِ /api به جنگو (هم‌ریشه، بدونِ CORS)
#   web    → gunicorn + Django
#   worker/beat → کارهای پس‌زمینه و ریست‌های زمان‌بندی‌شده
#   db/redis    → پایگاه‌داده و کش (کشِ گزارشِ پنل والدین روی همین redis است)
#
#   docker compose up -d --build
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luko}
      POSTGRES_USER: ${POSTGRES_USER:-luko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luko}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      GAME_FILES_DIR: /app/game-files
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      # همان فایل‌های بازی که nginx سرو می‌کند؛ کاتالوگ از نامِ آن‌ها ساخته می‌شود
      - ./frontend/dist/games:/app/game-files:ro
    # مهاجرت، کاتالوگِ بازی‌ها و جمع‌کردنِ استاتیک قبل از بالاآمدنِ سرویس.
    # همگام‌سازیِ ناموفق سرویس را پایین نمی‌آورد؛ کاتالوگِ قبلی سرِ جایش می‌ماند.
    command: >
      sh -c "python manage.py migrate --noinput &&
             (python manage.py sync_games || echo 'sync_games: کاتالوگ به‌روز نشد') &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-3} --timeout 60
             --access-logfile - --error-logfile -"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A config worker -l info --concurrency=2
    healthcheck:
      # HEALTHCHECKِ ایمیج به پورتِ وب می‌زند که worker ندارد؛ اینجا از خودِ celery می‌پرسیم
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      # beat صفِ پاسخ ندارد. فایلِ زمان‌بندش را هر تیک به‌روز می‌کند،
      # پس تازه‌بودنِ همان فایل یعنی زمان‌بند زنده است.
      test: ["CMD-SHELL", "python -c \"import os,sys,time; f='/tmp/celerybeat.pid'; sys.exit(0 if os.path.exists(f) else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"                                   # آروان با گواهیِ مبدأ به ۴۴۳ وصل می‌شود
    volumes:
      - ./deploy/nginx.arvan.conf:/etc/nginx/conf.d/default.conf:ro
      # گواهیِ TLSِ مبدأ (fullchain.pem / privkey.pem) — فقط روی سرور، در git نیست
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      # کلیدِ امضای لینکِ بازی‌ها (secure_link). فقط روی سرور است و در git نیست
      # (نمونه: deploy/game_link_secret.example.conf)؛ بی‌آن nginx بالا نمی‌آید.
      - ./deploy/game_link_secret.conf:/etc/nginx/snippets/game_link_secret.conf:ro
      - ./frontend/dist:/var/www/luko:ro          # خروجیِ `npm run build`
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  static:
  media:
