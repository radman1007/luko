# Netlify config for the LUKO frontend (Vite + React SPA in frontend/)
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"           # relative to base → frontend/dist

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: react-router handles client-side routes, so every path
# must serve index.html (otherwise deep links / refresh return 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# کشِ مرورگر. فایل‌های داخل /assets نامِ هش‌دار دارند، پس بی‌خطر «برای همیشه»
# کش می‌شوند و با هر انتشار، نامشان عوض می‌شود. بقیه محافظه‌کارانه‌تر.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# تصویرِ کاراکترها هش ندارد ولی به‌ندرت عوض می‌شود
[[headers]]
  for = "/characters/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# بازی‌ها هنوز در حالِ توسعه‌اند: هر بار اعتبارسنجی شود تا نسخهٔ کهنه سرو نشود
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML هیچ‌وقت کش نمی‌شود، وگرنه کاربر روی نسخهٔ قدیمی گیر می‌کند
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
