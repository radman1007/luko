    <script>
        // ===== موزیک پس‌زمینه =====
        let bgMusic = null;
        let musicStarted = false;

        function startBackgroundMusic() {
            if (musicStarted) return;
            musicStarted = true;

            try {
                bgMusic = new Audio('musics/piano.mp3');
                bgMusic.loop = true;
                bgMusic.volume = 0.5;

                bgMusic.play().catch(err => {
                    console.warn('Auto-play prevented, will play on user interaction:', err);
                    document.addEventListener('click', function playOnClick() {
                        if (bgMusic && !bgMusic.paused) return;
                        bgMusic.play().catch(() => {});
                        document.removeEventListener('click', playOnClick);
                    }, { once: true });
                });
            } catch (e) {
                console.warn('Background music error:', e);
            }
        }

        document.addEventListener('click', function firstClick() {
            startBackgroundMusic();
        }, { once: true });

        function ensureMusic() {
            if (!musicStarted) {
                startBackgroundMusic();
            }
        }

        // ===== ستاره‌ها =====
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = (Math.random() * 3) + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // ===== GUIDE DATA =====
        const guideData = [
            { start: 0, end: 6, text: 'سلام دوست من! 👋<br>من <span class="highlight">پیکسل</span> هستم.<br>خوش اومدی به بازی «<span class="highlight">مسابقه برج‌سازی تخم</span>»' },
            { start: 6, end: 9, text: 'بیا ببینم این بازی چطوریه،<br>خیلی <span class="highlight">راحته</span>:' },
            { start: 9, end: 19, text: 'اول چند تا پرندهٔ <span class="highlight">بامزه</span> میان روی صفحه.<br>تو باید یه پرنده رو انتخاب کنی که فکر میکنی<br><span class="highlight">بیشتر از همه</span> تخم می‌ذاره.<br>می‌تونی <span class="highlight">حدس</span> بزنی؟' },
            { start: 19, end: 27.5, text: 'بعد تخم‌ها از <span class="highlight">آسمون</span> می‌افتن!<br>هر تخم مال یه پرنده‌ست.<br>تخم رو <span class="highlight">بگیر</span> و بندازش توی <span class="highlight">ستون</span> همون پرنده.<br>تا وقتی تخم تو دستته، بقیه تخم‌ها <span class="highlight">آهسته</span> می‌افتن! 🐢' },
            { start: 27.5, end: 33.5, text: 'اگه تخم رو توی ستون پرندهٔ خودش بندازی،<br>برج <span class="highlight">یک طبقه</span> بالاتر می‌ره!' },
            { start: 33.5, end: 40.5, text: 'هر کدوم از پرنده‌ها که برجش <span class="highlight">بلندتر</span> بشه، برنده‌ست!<br>اگه تو درست حدس زده باشی، <span class="highlight">سکه</span> می‌گیری!' },
            { start: 40.5, end: 49, text: '🎯 <span class="highlight">یادت باشه:</span><br>عجله نکن، با دقت تخم‌ها رو بنداز.<br>اگه تخم بیفته زمین، <span class="highlight">می‌شکنه</span> و از دست می‌ره! 💔' },
            { start: 49, end: 60, text: 'حالا برو که برج‌های <span class="highlight">قشنگ</span> بسازی!<br><span class="highlight" style="font-size:1.6rem;">موفق باشی!</span> 🥚🏗️🎉' }
        ];

        // ===== GUIDE STATE =====
        let guideState = {
            isPlaying: false,
            currentIndex: -1,
            audio: null,
            startTime: 0,
            rafId: null,
            onComplete: null,
            useFallback: false
        };

        const guideScreen = document.getElementById('screen-guide');
        const speechText = document.getElementById('speechText');
        const progressBar = document.getElementById('progressBar');
        const timeIndicator = document.getElementById('timeIndicator');
        const pixelWrap = document.getElementById('pixelWrap');
        const skipBtn = document.getElementById('skipBtn');

        function showGuide(isFirstTime, onComplete) {
            ensureMusic();

            guideState.onComplete = onComplete;
            guideState.isPlaying = true;
            guideState.currentIndex = -1;
            guideState.useFallback = false;

            if (isFirstTime) {
                skipBtn.classList.add('hidden');
            } else {
                skipBtn.classList.remove('hidden');
            }

            guideScreen.classList.add('active');

            if (guideState.audio) {
                guideState.audio.pause();
                guideState.audio = null;
            }

            guideState.audio = new Audio('musics/pixel3.mp3');

            guideState.audio.play().then(() => {
                guideState.useFallback = false;
            }).catch(err => {
                console.warn('Audio play prevented, using timer fallback:', err);
                guideState.useFallback = true;
                guideState.startTime = Date.now();
            });

            guideState.audio.onended = () => finishGuide();
            guideState.audio.onerror = () => {
                console.warn('Audio error, using timer fallback.');
                guideState.useFallback = true;
                guideState.startTime = Date.now();
            };

            guideState.rafId = requestAnimationFrame(guideLoop);
        }

        function guideLoop() {
            if (!guideState.isPlaying) return;

            let currentTime;
            let duration;

            if (guideState.useFallback || !guideState.audio) {
                currentTime = (Date.now() - guideState.startTime) / 1000;
                duration = 60;
                if (currentTime >= 60) {
                    finishGuide();
                    return;
                }
            } else {
                currentTime = guideState.audio.currentTime;
                duration = guideState.audio.duration || 60;
            }

            const progress = Math.min((currentTime / duration) * 100, 100);
            progressBar.style.width = progress + '%';

            const mins = Math.floor(currentTime / 60);
            const secs = Math.floor(currentTime % 60);
            timeIndicator.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            let foundIndex = -1;
            for (let i = 0; i < guideData.length; i++) {
                if (currentTime >= guideData[i].start && currentTime < guideData[i].end) {
                    foundIndex = i;
                    break;
                }
            }

            if (foundIndex !== -1) {
                pixelWrap.classList.add('talking');
                pixelWrap.classList.remove('idle');
                if (foundIndex !== guideState.currentIndex) {
                    guideState.currentIndex = foundIndex;
                    speechText.innerHTML = `<div class="line">${guideData[foundIndex].text}</div>`;
                }
            } else {
                pixelWrap.classList.remove('talking');
                pixelWrap.classList.add('idle');
            }

            guideState.rafId = requestAnimationFrame(guideLoop);
        }

        function finishGuide() {
            if (!guideState.isPlaying) return;
            guideState.isPlaying = false;

            if (guideState.rafId) {
                cancelAnimationFrame(guideState.rafId);
                guideState.rafId = null;
            }

            if (guideState.audio) {
                guideState.audio.pause();
                guideState.audio = null;
            }

            pixelWrap.classList.remove('talking');
            pixelWrap.classList.add('happy');
            speechText.innerHTML = `<div class="line">${guideData[guideData.length - 1].text}</div>`;

            setTimeout(() => {
                guideScreen.classList.remove('active');
                pixelWrap.classList.remove('happy');
                pixelWrap.classList.add('idle');

                if (guideState.onComplete) {
                    guideState.onComplete();
                }
            }, 1500);
        }

        function skipGuide() {
            if (!guideState.isPlaying) return;

            if (guideState.rafId) {
                cancelAnimationFrame(guideState.rafId);
                guideState.rafId = null;
            }

            if (guideState.audio) {
                guideState.audio.pause();
                guideState.audio = null;
            }

            guideState.isPlaying = false;
            guideScreen.classList.remove('active');

            if (guideState.onComplete) {
                guideState.onComplete();
            }
        }

        // ===== SCREEN FUNCTIONS =====
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        // ===== TOAST =====
        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let displayMessage = message;
            if (message.includes('سکه')) {
                displayMessage = message.replace('سکه', '');
                toast.innerHTML = `
                    <img src="icons/coin.png" alt="سکه" class="toast-coin">
                    <span>${displayMessage}</span>
                `;
            } else {
                toast.innerHTML = `<span>${message}</span>`;
            }
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 350);
            }, 2500);
        }

        function toPersianNum(n) {
            return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function playBeep(freq, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playCrackSound() {
            playBeep(320, 0.06);
            setTimeout(() => playBeep(150, 0.12), 50);
        }

        // ===== COUNTDOWN =====
        function showCountdown(callback) {
            if (window.countdownRunning) return;
            window.countdownRunning = true;

            const overlay = document.getElementById('countdownOverlay');
            const numberEl = document.getElementById('countdownNumber');
            const labelEl = document.getElementById('countdownLabel');

            const color = getComputedStyle(document.body).getPropertyValue('--countdown-color').trim() || '#FFC93C';
            numberEl.style.color = color;
            numberEl.style.textShadow = `0 0 100px ${color}, 0 0 200px ${color}`;

            overlay.classList.add('show');

            const steps = ['۳', '۲', '۱', 'بریم!'];
            let index = 0;

            function showNext() {
                if (index >= steps.length) {
                    overlay.classList.remove('show');
                    window.countdownRunning = false;
                    if (callback) callback();
                    return;
                }

                numberEl.textContent = steps[index];
                numberEl.className = 'countdown-number';
                if (steps[index] === 'بریم!') {
                    numberEl.classList.add('go-text');
                    labelEl.textContent = 'شروع! 🚀';
                    playBeep(880, 0.4);
                } else {
                    labelEl.textContent = index === 0 ? 'آماده‌ای؟' : '';
                    playBeep(440 + (3 - index) * 80, 0.3);
                }

                numberEl.style.animation = 'none';
                requestAnimationFrame(() => {
                    numberEl.style.animation = steps[index] === 'بریم!' ? 'countdownGo 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)' :
                        'countdownPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                });

                index++;
                setTimeout(showNext, 700);
            }

            showNext();
        }

        // ===== BIRDS =====
        const BIRDS = {

            duck: { name: 'اردک', eggColor: '#4FC3F7', eggStroke: '#0288D1', tubeColor: 'rgba(79,195,247,0.3)', tubeBorder: 'rgba(2,136,209,0.6)' },
            quail: { name: 'بلدرچین', eggColor: '#FF6B6B', eggStroke: '#C62828', tubeColor: 'rgba(255,107,107,0.3)', tubeBorder: 'rgba(198,40,40,0.6)' },
            canary: { name: 'قناری', eggColor: '#66BB6A', eggStroke: '#2E7D32', tubeColor: 'rgba(102,187,106,0.3)', tubeBorder: 'rgba(46,125,50,0.6)' },
            parrot: { name: 'طوطی', eggColor: '#FFB300', eggStroke: '#E65100', tubeColor: 'rgba(255,179,0,0.3)', tubeBorder: 'rgba(230,81,0,0.6)' },
            pigeon: { name: 'کبوتر', eggColor: '#AB47BC', eggStroke: '#6A1B9A', tubeColor: 'rgba(171,71,188,0.3)', tubeBorder: 'rgba(106,27,154,0.6)' },
            sparrow: { name: 'گنجشک', eggColor: '#8D6E63', eggStroke: '#4E342E', tubeColor: 'rgba(141,110,99,0.3)', tubeBorder: 'rgba(78,52,46,0.6)' }

        // ===== آیکون تصویری پرنده‌ها =====

            chicken: './icons/mazrae 1.png',
            duck: './icons/sahel 3.png'

            chicken: '🐔',

        // ===== LEVEL CONFIGS =====
        const LEVEL_CONFIGS = {};

        const eggs4 = [
            { chicken: 6, duck: 4, quail: 7, canary: 5 },
            { chicken: 5, duck: 6, quail: 4, canary: 8 },
            { chicken: 7, duck: 5, quail: 6, canary: 4 },

            LEVEL_CONFIGS[i] = {
                birds: birds4,

        const birds5 = ['chicken', 'duck', 'quail', 'canary', 'parrot'];
        const eggs5 = [
            { chicken: 5, duck: 6, quail: 7, canary: 4, parrot: 8 },
            { chicken: 6, duck: 4, quail: 8, canary: 5, parrot: 7 },

        LEVEL_CONFIGS[14] = {

        const shopItems = {
            powers: [
                { id: 'time_stop', name: 'توقف زمان', price: 10, icon: '⏸️', desc: '۳ ثانیه تخم‌ها آهسته‌تر', type: 'power' },
                { id: 'mistake_shield', name: 'محافظ ۳ اشتباه', price: 15, icon: '🛡️', desc: '۳ اشتباه بخشیده میشه', type: 'power' }
            ],
            effects: [
                { id: 'star_trail', name: 'دنباله ستاره', price: 8, icon: '⭐', desc: 'ستاره پشت تخم‌ها', type: 'effect' },
                { id: 'color_explosion', name: 'انفجار رنگ', price: 10, icon: '🌈', desc: 'رنگ‌ها موقع برخورد', type: 'effect' },
                { id: 'snow', name: 'برف مصنوعی', price: 12, icon: '❄️', desc: 'برف توی صفحه', type: 'effect' },
                { id: 'confetti', name: 'کانفتی مداوم', price: 15, icon: '🎊', desc: 'کانفتی همیشه', type: 'effect' },
                { id: 'fireworks', name: 'آتش‌بازی کوچک', price: 18, icon: '🎇', desc: 'آتش‌بازی با تخم درست', type: 'effect' }
            ]
        };

        // ===== GAME STATE =====
        let gameState = {
            level: 1,
            running: false,
            paused: false,
            isGameOver: false,
            birds: [],
            eggCounts: {},
            placedCounts: {},
            totalEggs: 0,
            placedTotal: 0,
            correctDrags: 0,
            wrongDrags: 0,
            eggsMissed: 0,
            eggsPlacedCorrect: 0,
            prediction: null,
            startTime: null,
            spawnTimeout: null,
            eggQueue: [],
            activeEggs: [],
            coins: 0,
            isWin: false,
            eggsProcessed: 0,
            ownedItems: [],
            activeItem: null,
            shieldUses: 0,
            slowUntil: 0
        };

        const STATS_KEY = 'towerEggStats_v3';

        function loadStats() {
            try {
                const raw = localStorage.getItem(STATS_KEY);
                return raw ? JSON.parse(raw) : { totalGames: 0, totalCorrectDrags: 0, totalWrongDrags: 0, totalTime: 0,
                    bestTime: null, correctPredictions: 0, levelUnlocked: { 1: true }, levelCompleted: {} };
            } catch (e) { return { totalGames: 0, totalCorrectDrags: 0, totalWrongDrags: 0, totalTime: 0, bestTime: null,
                    correctPredictions: 0, levelUnlocked: { 1: true }, levelCompleted: {} }; }
        }

        function saveStats(stats) {
            try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
        }

        function loadCoins() {
            const saved = localStorage.getItem('towerEggCoins');
            gameState.coins = saved ? parseInt(saved) : 0;
            updateCoinDisplay();
        }

        function saveCoins() {
            localStorage.setItem('towerEggCoins', gameState.coins.toString());
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            document.getElementById('menu-coin-amount').textContent = gameState.coins;
            document.getElementById('shop-coin-amount').textContent = gameState.coins;
        }

        function loadShopPurchases() {
            try {
                const saved = localStorage.getItem('towerEggShopPurchases');
                if (saved) {
                    const data = JSON.parse(saved);
                    gameState.ownedItems = data.ownedItems || [];
                    gameState.activeItem = data.activeItem || null;
                }
            } catch (e) {}
        }

        function saveShopPurchases() {
            localStorage.setItem('towerEggShopPurchases', JSON.stringify({
                ownedItems: gameState.ownedItems,
                activeItem: gameState.activeItem
            }));
        }

        // ===== HANDLE START GAME =====
        function handleStartGame() {
            ensureMusic();
            const hasSeen = localStorage.getItem('towerEggFirstGuideSeen');

            if (!hasSeen) {
                showGuide(true, function() {
                    localStorage.setItem('towerEggFirstGuideSeen', 'true');
                    showLevelSelect();
                });
            } else {
                showLevelSelect();
            }
        }

        function openGuideFromMenu() {
            ensureMusic();
            showGuide(false, function() {
                showScreen('screen-landing');
            });
        }

        function showLevelSelect() {
            renderLevels();
            showScreen('screen-level');
        }

        function renderLevels() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            const stats = loadStats();
            if (!stats.levelUnlocked) stats.levelUnlocked = { 1: true };
            if (!stats.levelCompleted) stats.levelCompleted = {};

            for (let i = 1; i <= 15; i++) {
                const box = document.createElement('div');
                box.className = 'level-box';
                const isUnlocked = stats.levelUnlocked[i] || false;
                const isCompleted = stats.levelCompleted[i] || false;

                if (!isUnlocked) box.classList.add('locked');
                if (isCompleted) box.classList.add('completed');

                box.innerHTML = `
                    <span class="level-number">${i}</span>
                    ${!isUnlocked ? '<span class="lock-icon">🔒</span>' : ''}
                    ${isCompleted ? '<span class="check-icon">✅</span>' : ''}
                `;

                if (isUnlocked) {
                    box.addEventListener('click', () => {
                        ensureMusic();
                        startGame(i);
                    });
                }
                grid.appendChild(box);
            }
        }

        // ===== SHOP =====
        function showShop() {
            ensureMusic();
            renderShop();
            showScreen('screen-shop');
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            updateCoinDisplay();

            const activeTab = document.querySelector('.shop-tab.active');
            const tab = activeTab ? activeTab.dataset.tab : 'powers';
            const items = tab === 'powers' ? shopItems.powers : shopItems.effects;

            items.forEach(item => {
                const isOwned = gameState.ownedItems.includes(item.id);
                const isActive = gameState.activeItem === item.id;

                const card = document.createElement('div');
                card.className = `shop-item ${isActive ? 'active-item' : ''}`;

                let btnHtml = '';
                if (isActive) {
                    btnHtml = `<button class="shop-btn-sm active" onclick="toggleEffect('${item.id}')">✓ فعال</button>`;
                } else if (isOwned) {
                    btnHtml = `<button class="shop-btn-sm select" onclick="toggleEffect('${item.id}')">✨ انتخاب</button>`;
                } else {
                    const canAfford = gameState.coins >= item.price;
                    btnHtml = `<button class="shop-btn-sm ${canAfford ? 'buy' : 'locked'}" ${canAfford ? `onclick="buyEffect('${item.id}')"` : 'disabled'}>${canAfford ? '🛒 خرید' : '🔒 قفل'}</button>`;
                }

                card.innerHTML = `
                    <div class="shop-item-icon">${item.icon}</div>
                    <div class="name">${item.name}</div>
                    <div class="desc">${item.desc}</div>
                    <div class="price">${item.price > 0 ? `<img src="icons/coin.png" alt="سکه" onerror="this.textContent='🪙'"> ${item.price}` : '🎁 رایگان'}</div>
                    ${btnHtml}
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.shop-tab').forEach(tabEl => {
                tabEl.onclick = () => {
                    document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
                    tabEl.classList.add('active');
                    renderShop();
                };
            });
        }

        function buyEffect(id) {
            const allItems = [...shopItems.powers, ...shopItems.effects];
            const item = allItems.find(i => i.id === id);
            if (!item) return;
            if (gameState.coins < item.price) {
                showToast('سکه کافی نداری! 😢', 'red');
                return;
            }
            if (gameState.ownedItems.includes(id)) {
                showToast('این رو قبلاً خریدی!', 'gold');
                return;
            }

            gameState.coins -= item.price;
            saveCoins();

            gameState.ownedItems.push(id);
            gameState.activeItem = id;

            saveShopPurchases();
            renderShop();
            updateActiveEffectsBar();
            showToast(`🎉 ${item.name} خریداری و فعال شد!`, 'green');
        }

        function toggleEffect(id) {
            const allItems = [...shopItems.powers, ...shopItems.effects];
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            if (gameState.activeItem === id) {
                gameState.activeItem = null;
                showToast(`❌ ${item.name} غیرفعال شد`, 'red');
            } else {
                gameState.activeItem = id;
                showToast(`✨ ${item.name} فعال شد!`, 'gold');
            }

            saveShopPurchases();
            renderShop();
            updateActiveEffectsBar();
        }

        // ===== EFFECTS =====
        let snowInterval = null;
        let confettiInterval = null;

        function startSnowEffect() {
            if (snowInterval) return;
            const skyZone = document.getElementById('sky-zone');
            snowInterval = setInterval(() => {
                if (!gameState.running) return;
                const snow = document.createElement('div');
                snow.className = 'snow-particle';
                const size = 3 + Math.random() * 6;
                snow.style.width = size + 'px';
                snow.style.height = size + 'px';
                snow.style.left = Math.random() * 100 + '%';
                snow.style.top = '-10px';
                snow.style.opacity = 0.4 + Math.random() * 0.6;
                snow.style.animationDuration = (3 + Math.random() * 4) + 's';
                snow.style.animationDelay = (Math.random() * 2) + 's';
                skyZone.appendChild(snow);
                setTimeout(() => snow.remove(), 7000);
            }, 200);
        }

        function stopSnowEffect() {
            if (snowInterval) {
                clearInterval(snowInterval);
                snowInterval = null;
                document.querySelectorAll('.snow-particle').forEach(el => el.remove());
            }
        }

        function startConfettiEffect() {
            if (confettiInterval) return;
            const skyZone = document.getElementById('sky-zone');
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff6bb5', '#ffb347'];
            confettiInterval = setInterval(() => {
                if (!gameState.running) return;
                const c = document.createElement('div');
                c.className = 'effect-confetti-piece';
                c.style.left = Math.random() * 100 + '%';
                c.style.top = '-10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.width = (4 + Math.random() * 6) + 'px';
                c.style.height = (4 + Math.random() * 6) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                c.style.animationDuration = (2 + Math.random() * 3) + 's';
                c.style.animationDelay = (Math.random() * 1.5) + 's';
                skyZone.appendChild(c);
                setTimeout(() => c.remove(), 5000);
            }, 300);
        }

        function stopConfettiEffect() {
            if (confettiInterval) {
                clearInterval(confettiInterval);
                confettiInterval = null;
                document.querySelectorAll('.effect-confetti-piece').forEach(el => el.remove());
            }
        }

        function createStarTrail(eggEl) {
            if (gameState.activeItem !== 'star_trail') return;
            const skyZone = document.getElementById('sky-zone');
            const rect = eggEl.getBoundingClientRect();
            const skyRect = skyZone.getBoundingClientRect();
            const star = document.createElement('div');
            star.className = 'effect-star';
            star.textContent = '⭐';
            star.style.left = (rect.left - skyRect.left + rect.width / 2) + 'px';
            star.style.top = (rect.top - skyRect.top + rect.height / 2) + 'px';
            skyZone.appendChild(star);
            setTimeout(() => star.remove(), 1500);
        }

        function createColorExplosion(x, y) {
            if (gameState.activeItem !== 'color_explosion') return;
            const skyZone = document.getElementById('sky-zone');
            const skyRect = skyZone.getBoundingClientRect();
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff6bb5', '#ffb347', '#00d2ff'];
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'effect-particle';
                const angle = (i / 12) * Math.PI * 2;
                const dist = 40 + Math.random() * 60;
                p.style.left = (x - skyRect.left) + 'px';
                p.style.top = (y - skyRect.top) + 'px';
                p.style.width = (4 + Math.random() * 8) + 'px';
                p.style.height = p.style.width;
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                p.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                skyZone.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        function createFirework(x, y) {
            if (gameState.activeItem !== 'fireworks') return;
            const skyZone = document.getElementById('sky-zone');
            const skyRect = skyZone.getBoundingClientRect();
            const emojis = ['🎆', '✨', '🌟', '💫', '⭐', '🎇'];
            for (let i = 0; i < 8; i++) {
                const f = document.createElement('div');
                f.className = 'effect-firework';
                f.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
                const dist = 30 + Math.random() * 40;
                f.style.left = (x - skyRect.left + Math.cos(angle) * dist) + 'px';
                f.style.top = (y - skyRect.top + Math.sin(angle) * dist) + 'px';
                f.style.fontSize = (12 + Math.random() * 16) + 'px';
                skyZone.appendChild(f);
                setTimeout(() => f.remove(), 1200);
            }
        }

        function updateActiveEffectsBar() {
            const bar = document.getElementById('activeEffectsBar');
            bar.innerHTML = '';
            if (!gameState.activeItem) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';

            const allItems = [...shopItems.powers, ...shopItems.effects];
            const item = allItems.find(i => i.id === gameState.activeItem);

            if (item) {
                let extraText = '';
                if (item.id === 'mistake_shield') {
                    extraText = ` (${3 - gameState.shieldUses} بار)`;
                }
                const badge = document.createElement('span');
                badge.className = 'active-effect-badge';
                badge.innerHTML = `${item.icon} ${item.name}${extraText} <span class="remove-effect" onclick="toggleEffect('${item.id}')">✕</span>`;
                bar.appendChild(badge);
            }
        }

        function showEffectVisual(effectType, element) {
            const rect = element.getBoundingClientRect();
            if (effectType === 'correct') {
                createColorExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
                createStarTrail(element);
                createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }
        }

        // ===== GAME FUNCTIONS =====
        function startGame(level) {
            ensureMusic();

            if (level === 1 && !localStorage.getItem('towerEggFirstGuideSeen')) {
                showGuide(true, function() {
                    localStorage.setItem('towerEggFirstGuideSeen', 'true');
                    startGame(1);
                });
                return;
            }

            gameState.isGameOver = false;
            gameState.isWin = false;
            gameState.eggsMissed = 0;
            gameState.eggsPlacedCorrect = 0;
            gameState.eggsProcessed = 0;
            gameState.wrongDrags = 0;
            gameState.shieldUses = 0;
            gameState.slowUntil = 0;
            gameState.paused = false;
            showScreen('screen-game');
            gameState.level = level;
            const config = LEVEL_CONFIGS[level];
            if (!config) { showToast('مرحله پیدا نشد!', 'red'); return; }
            gameState.birds = config.birds;
            gameState.eggCounts = { ...config.eggCounts };
            gameState.placedCounts = {};
            gameState.activeEggs = [];
            gameState.eggQueue = [];
            gameState.correctDrags = 0;
            gameState.wrongDrags = 0;
            gameState.prediction = null;
            gameState.placedTotal = 0;
            gameState.totalEggs = Object.values(config.eggCounts).reduce((a, b) => a + b, 0);

            for (const b of config.birds) gameState.placedCounts[b] = 0;

            document.getElementById('gameLevelDisplay').textContent = `مرحله ${level}`;
            document.getElementById('targetCountLabel').textContent = toPersianNum(gameState.totalEggs);

            stopSnowEffect();
            stopConfettiEffect();

            if (gameState.activeItem === 'snow') startSnowEffect();
            if (gameState.activeItem === 'confetti') startConfettiEffect();

            updateActiveEffectsBar();
            showSlowmoBadge(false);

            buildGameUI();
            showPredictionModal();
        }

        function stopGame() {
            gameState.running = false;
            gameState.paused = false;
            gameState.isGameOver = true;
            gameState.slowUntil = 0;
            clearTimeout(gameState.spawnTimeout);
            gameState.spawnTimeout = null;
            cancelDrag();
            document.getElementById('egg-container').innerHTML = '';
            gameState.activeEggs = [];
            gameState.eggQueue = [];
            stopSnowEffect();
            stopConfettiEffect();
            showSlowmoBadge(false);
        }

        function buildGameUI() {
            const towersZone = document.getElementById('towers-zone');
            const birdsZone = document.getElementById('birds-zone');
            towersZone.innerHTML = '';
            birdsZone.innerHTML = '';
            for (const birdKey of gameState.birds) {
                const bird = BIRDS[birdKey];
                const slot = document.createElement('div');
                slot.className = 'tower-slot';
                slot.dataset.bird = birdKey;
                slot.innerHTML = `
                    <div class="tower-label">${bird.name}</div>
                    <div class="tower-tube" id="tube-${birdKey}" data-bird="${birdKey}"
                         style="background:${bird.tubeColor};border-color:${bird.tubeBorder};height:0px;">
                    </div>
                    <div class="tower-base"></div>
                `;
                towersZone.appendChild(slot);

                const panel = document.createElement('div');
                panel.className = 'bird-panel';
                panel.id = `bird-panel-${birdKey}`;
                panel.dataset.bird = birdKey;
                panel.innerHTML = `
                    <div class="bird-svg-wrap" id="bird-svg-${birdKey}">
                        ${getBirdVisual(birdKey)}
                    </div>
                    <div class="bird-count-badge" id="bird-count-${birdKey}">${toPersianNum(0)}</div>
                    <div class="bird-name">${bird.name}</div>
                `;
                birdsZone.appendChild(panel);
            }
        }

        function getBirdSVG(birdKey, mood) {
            const colors = {
                chicken: { body: '#FFD700', stroke: '#D4A017', crest: '#ff6b6b' },
                duck: { body: '#4FC3F7', stroke: '#0288D1', beak: '#ff9a2e' },
                quail: { body: '#FF6B6B', stroke: '#C62828' },
                canary: { body: '#66BB6A', stroke: '#2E7D32' },
                parrot: { body: '#FFB300', stroke: '#E65100' },
                pigeon: { body: '#AB47BC', stroke: '#6A1B9A' },
                sparrow: { body: '#8D6E63', stroke: '#4E342E' }
            };
            const c = colors[birdKey] || colors.chicken;
            return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="26" cy="34" rx="14" ry="11" fill="${c.body}" stroke="${c.stroke}" stroke-width="1.5"/>
                <ellipse cx="34" cy="22" rx="9" ry="8" fill="${c.body}" stroke="${c.stroke}" stroke-width="1.5"/>
                <circle cx="31" cy="19" r="3.5" fill="white" stroke="${c.stroke}" stroke-width="1.5"/>
                <circle cx="31" cy="19" r="1.8" fill="#1a2a4a"/>
                <circle cx="31.5" cy="18.2" r="0.6" fill="white"/>
                ${c.crest ? `<path d="M28 14 Q30 8 32 12 Q33 8 35 11 Q36 7 38 10" fill="${c.crest}" stroke="#cc2222" stroke-width="1"/>` : ''}
                ${mood === 'happy' ? `<ellipse cx="27" cy="23" rx="4" ry="2.5" fill="#ffb3c1" opacity="0.6"/><ellipse cx="35" cy="23" rx="4" ry="2.5" fill="#ffb3c1" opacity="0.6"/>` : ''}
            </svg>`;
        }

        function getEggSVG(birdKey, size) {
            const s = size || 42;
            const bird = BIRDS[birdKey];
            const r = s / 2;
            return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">
                <ellipse cx="${r}" cy="${r + r * 0.05}" rx="${r * 0.72}" ry="${r * 0.88}" fill="${bird.eggColor}" stroke="${bird.eggStroke}" stroke-width="${Math.max(1.5, s * 0.04)}"/>
                <ellipse cx="${r - r * 0.3}" cy="${r - r * 0.25}" rx="${r * 0.2}" ry="${r * 0.12}" fill="rgba(255,255,255,0.5)" transform="rotate(-20,${r - r * 0.3},${r - r * 0.25})"/>
            </svg>`;
        }

        function getShellSVG(birdKey, flip) {
            const bird = BIRDS[birdKey];
            return `<svg width="36" height="28" viewBox="0 0 36 28" xmlns="http://www.w3.org/2000/svg" style="transform:${flip < 0 ? 'scaleX(-1)' : 'none'};display:block;">
                <path d="M3 10 L8 3 L12 10 L17 2 L22 10 L27 4 L33 11 L33 15 Q33 27 18 27 Q3 27 3 15 Z"
                      fill="${bird.eggColor}" stroke="${bird.eggStroke}" stroke-width="2" stroke-linejoin="round"/>
            </svg>`;
        }

        // ===== PREDICTION =====
        function showPredictionModal() {
            const container = document.getElementById('predict-bird-btns');
            container.innerHTML = '';
            for (const birdKey of gameState.birds) {
                const bird = BIRDS[birdKey];
                const btn = document.createElement('button');
                btn.className = 'predict-btn';
                btn.dataset.bird = birdKey;
                btn.innerHTML = `<div style="width:52px;height:52px;">${getBirdVisual(birdKey)}</div><span class="predict-btn-label">${bird.name}</span>`;
                btn.addEventListener('click', () => selectPrediction(birdKey));
                container.appendChild(btn);
            }
            document.getElementById('btn-confirm-predict').disabled = true;
            document.getElementById('modal-predict').classList.add('open');
        }

        function selectPrediction(birdKey) {
            gameState.prediction = birdKey;
            document.querySelectorAll('.predict-btn').forEach(b => b.classList.remove('selected'));
            document.querySelector(`.predict-btn[data-bird="${birdKey}"]`).classList.add('selected');
            document.getElementById('btn-confirm-predict').disabled = false;
        }

        function confirmPrediction() {
            closeModal('modal-predict');
            showToast('حدست رو یادداشت کردم! حالا بسازیم ببینیم!', 'blue');

            showCountdown(function() {
                beginGameplay();
            });
        }

        // ===== GAMEPLAY =====
        function beginGameplay() {
            gameState.running = true;
            gameState.paused = false;
            gameState.isGameOver = false;
            // زمان به‌صورت داخلی محاسبه میشه (بدون نمایش در UI) - زمان بی‌نهایت
            gameState.startTime = Date.now();

            if (gameState.activeItem === 'time_stop') {
                gameState.slowUntil = Date.now() + 3000;
                showToast('⏸️ زمان کندتر شد! ۳ ثانیه', 'blue');
            }

            const queue = [];
            for (const birdKey of gameState.birds) {
                const count = gameState.eggCounts[birdKey];
                for (let i = 0; i < count; i++) queue.push(birdKey);
            }
            shuffle(queue);
            gameState.eggQueue = queue;

            showToast('تو معمار برج‌هایی! تخم‌ها رو بگیر و داخل لوله پرنده‌اش بذار.', 'blue');
            scheduleNextEgg();
        }

        function scheduleNextEgg() {
            if (!gameState.running) return;
            const config = LEVEL_CONFIGS[gameState.level];
            if (gameState.eggQueue.length === 0 && gameState.activeEggs.length === 0) return;
            if (gameState.eggQueue.length === 0) return;
            const delay = config.spawnInterval + Math.random() * 600;
            gameState.spawnTimeout = setTimeout(() => {
                if (!gameState.running || gameState.paused) {
                    if (gameState.running && gameState.paused) scheduleNextEgg();
                    return;
                }
                spawnEgg();
                scheduleNextEgg();
            }, delay);
        }

        // ===== حلقه سقوط تخم‌ها (rAF) =====
        let eggLoopRunning = false;
        let lastFrameTs = 0;

        function startEggLoop() {
            if (eggLoopRunning) return;
            eggLoopRunning = true;
            lastFrameTs = performance.now();
            requestAnimationFrame(eggLoopStep);
        }

        function getCurrentSpeedFactor() {
            let f = 1;
            // تا وقتی کودک تخم رو نگه داشته، همه‌چیز آهسته میشه
            if (dragging) f *= 0.35;
            // قدرت توقف زمان
            if (gameState.slowUntil && Date.now() < gameState.slowUntil) f *= 0.5;
            return f;
        }

        function eggLoopStep(ts) {
            if (!gameState.running) { eggLoopRunning = false; return; }

            let dt = ts - lastFrameTs;
            lastFrameTs = ts;
            if (dt > 60) dt = 60;

            if (!gameState.paused) {
                const f = getCurrentSpeedFactor();
                const eggs = gameState.activeEggs.slice();
                for (const el of eggs) {
                    if (!el.parentNode || el._dragging) continue;
                    el._elapsed += dt * f;
                    const p = Math.min(el._elapsed / el._fallDuration, 1);
                    el.style.top = (el._startY + (el._endY - el._startY) * p) + 'px';
                    if (p >= 1) {
                        breakEgg(el); // تخم نشست → می‌شکنه و میفته پایین
                    }
                }
            }

            if (gameState.running) requestAnimationFrame(eggLoopStep);
            else eggLoopRunning = false;
        }

        function spawnEgg() {
            if (gameState.eggQueue.length === 0) return;
            const birdKey = gameState.eggQueue.shift();
            const config = LEVEL_CONFIGS[gameState.level];
            const skyZone = document.getElementById('sky-zone');
            const skyW = skyZone.offsetWidth;
            const skyH = skyZone.offsetHeight;
            const eggSize = 40;
            const xPos = 16 + Math.random() * (skyW - eggSize - 32);
            const fallDuration = config.fallSpeed.min + Math.random() * (config.fallSpeed.max - config.fallSpeed.min);

            const eggEl = document.createElement('div');
            eggEl.className = 'falling-egg';
            eggEl.dataset.bird = birdKey;
            eggEl.style.left = xPos + 'px';
            eggEl.style.width = eggSize + 'px';
            eggEl.style.height = eggSize + 'px';
            eggEl.innerHTML = getEggSVG(birdKey, eggSize);

            if (gameState.level >= 9 && Math.random() < 0.2) eggEl.style.opacity = '0.55';

            eggEl._startY = -eggSize - 10;
            eggEl._endY = skyH + 40;
            eggEl._fallDuration = fallDuration;
            eggEl._elapsed = 0;
            eggEl._dragging = false;
            eggEl.style.top = eggEl._startY + 'px';

            document.getElementById('egg-container').appendChild(eggEl);
            gameState.activeEggs.push(eggEl);

            eggEl.addEventListener('mousedown', onEggMouseDown);
            eggEl.addEventListener('touchstart', onEggTouchStart, { passive: false });

            startEggLoop();
        }

        // ===== شکستن تخم =====
        function breakEgg(eggEl) {
            if (!eggEl.parentNode) return;
            const birdKey = eggEl.dataset.bird;
            const left = parseFloat(eggEl.style.left) || 0;
            const top = parseFloat(eggEl.style.top) || 0;
            const size = eggEl.offsetWidth || 40;

            removeActiveEgg(eggEl);
            eggEl.remove();

            gameState.eggsMissed++;
            gameState.eggsProcessed++;
            updateTargetCounter();

            playCrackSound();

            const container = document.getElementById('egg-container');
            const cx = left + size / 2;
            const cy = top + size / 2;

            // نیمه چپ پوسته
            const shellL = document.createElement('div');
            shellL.className = 'egg-shell-piece left';
            shellL.style.left = (cx - 18) + 'px';
            shellL.style.top = (cy - 14) + 'px';
            shellL.innerHTML = getShellSVG(birdKey, -1);
            container.appendChild(shellL);

            // نیمه راست پوسته
            const shellR = document.createElement('div');
            shellR.className = 'egg-shell-piece right';
            shellR.style.left = (cx - 18) + 'px';
            shellR.style.top = (cy - 14) + 'px';
            shellR.innerHTML = getShellSVG(birdKey, 1);
            container.appendChild(shellR);

            // زرده
            const yolk = document.createElement('div');
            yolk.className = 'egg-yolk-piece';
            yolk.style.left = (cx - 9) + 'px';
            yolk.style.top = (cy - 6) + 'px';
            yolk.style.width = '18px';
            yolk.style.height = '14px';
            yolk.style.background = 'radial-gradient(circle at 35% 35%, #FFE082, #FFB300)';
            yolk.style.boxShadow = '0 2px 8px rgba(0,0,0,0.35)';
            container.appendChild(yolk);

            setTimeout(() => { shellL.remove(); shellR.remove(); yolk.remove(); }, 1200);

            checkLoseCondition();
            checkGameOver();
        }

        // ===== درگ =====
        let dragging = null;
        let dragOffset = { x: 0, y: 0 };
        let dragLift = 0; // لِفت تخم بالای انگشت برای دید بهتر
        let lastPointerX = 0;
        let lastPointerY = 0;

        function onEggMouseDown(e) {
            e.preventDefault();
            startDrag(e.currentTarget, e.clientX, e.clientY, false);
        }

        function onEggTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            startDrag(e.currentTarget, touch.clientX, touch.clientY, true);
        }

        function startDrag(el, clientX, clientY, isTouch) {
            if (dragging) return;
            dragging = el;
            el._dragging = true;

            const rect = el.getBoundingClientRect();
            const skyRect = document.getElementById('sky-zone').getBoundingClientRect();

            const top = rect.top - skyRect.top;
            const left = rect.left - skyRect.left;

            el.style.top = top + 'px';
            el.style.left = left + 'px';

            dragOffset.x = clientX - rect.left;
            dragOffset.y = clientY - rect.top;
            dragLift = isTouch ? 48 : 0;

            lastPointerX = clientX;
            lastPointerY = clientY;

            el.classList.add('dragging');
            showSlowmoBadge(true);

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            document.addEventListener('touchend', onTouchEnd);
        }

        function onDragMove(e) {
            if (!dragging) return;
            moveDrag(e.clientX, e.clientY);
        }

        function onTouchMove(e) {
            if (!dragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            moveDrag(touch.clientX, touch.clientY);
        }

        function moveDrag(clientX, clientY) {
            if (!dragging) return;
            lastPointerX = clientX;
            lastPointerY = clientY;
            const skyRect = document.getElementById('sky-zone').getBoundingClientRect();
            const x = clientX - skyRect.left - dragOffset.x;
            const y = clientY - skyRect.top - dragOffset.y - dragLift;
            dragging.style.left = x + 'px';
            dragging.style.top = y + 'px';
            updateDropHighlight();
        }

        function onDragEnd(e) { endDrag(e.clientX, e.clientY); }

        function onTouchEnd(e) {
            const touch = e.changedTouches[0];
            endDrag(touch.clientX, touch.clientY);
        }

        function cancelDrag() {
            if (!dragging) return;
            dragging = null;
            dragLift = 0;
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onTouchMove);
            document.removeEventListener('touchend', onTouchEnd);
            showSlowmoBadge(false);
        }

        function endDrag(clientX, clientY) {
            if (!dragging) return;
            const el = dragging;
            dragging = null;
            dragLift = 0;

            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onTouchMove);
            document.removeEventListener('touchend', onTouchEnd);

            el.classList.remove('dragging');
            clearDropHighlights();
            showSlowmoBadge(false);

            // تشخیص آسان: مرکز تخم یا محل انگشت روی سطل یا تصویر کاراکتر
            const target = findDropTarget(el, clientX, clientY);
            const eggBird = el.dataset.bird;

            if (target) {
                if (target.bird === eggBird) {
                    handleCorrectDrop(el, target.bird);
                } else {
                    handleWrongDrop(el, document.getElementById(`tube-${target.bird}`), target.bird);
                }
            } else {
                returnEggToFall(el);
            }
        }

        // ===== تشخیص نرم و آسان دراپ =====
        function findDropTarget(eggEl, clientX, clientY) {
            const eggRect = eggEl.getBoundingClientRect();
            // نقاط بررسی: مرکز تخم + محل انگشت/موس
            const pts = [
                [eggRect.left + eggRect.width / 2, eggRect.top + eggRect.height / 2]
            ];
            if (typeof clientX === 'number') pts.push([clientX, clientY]);

            let best = null;
            let bestDist = Infinity;

            document.querySelectorAll('.tower-slot[data-bird], .bird-panel[data-bird]').forEach(slot => {
                const r = slot.getBoundingClientRect();
                const pad = 36; // حساسیت زیاد برای بچه‌ها
                for (const [px, py] of pts) {
                    if (px >= r.left - pad && px <= r.right + pad && py >= r.top - pad && py <= r.bottom + pad) {
                        const d = Math.hypot(px - (r.left + r.width / 2), py - (r.top + r.height / 2));
                        if (d < bestDist) {
                            bestDist = d;
                            best = { bird: slot.dataset.bird, slot };
                        }
                    }
                }
            });
            return best;
        }

        function updateDropHighlight() {
            clearDropHighlights();
            if (!dragging) return;
            const t = findDropTarget(dragging, lastPointerX, lastPointerY);
            if (t) {
                const tube = document.getElementById(`tube-${t.bird}`);
                if (tube) tube.classList.add('drop-target');
            }
        }

        function clearDropHighlights() {
            document.querySelectorAll('.tower-tube').forEach(t => t.classList.remove('drop-target'));
        }

        function handleCorrectDrop(eggEl, birdKey) {
            gameState.correctDrags++;
            gameState.placedCounts[birdKey]++;
            gameState.placedTotal++;
            gameState.eggsPlacedCorrect++;
            gameState.eggsProcessed++;

            showEffectVisual('correct', eggEl);

            removeActiveEgg(eggEl);
            eggEl.remove();

            const tube = document.getElementById(`tube-${birdKey}`);
            const eggDiv = document.createElement('div');
            eggDiv.className = 'egg-in-tube';
            eggDiv.style.background = BIRDS[birdKey].eggColor;
            eggDiv.style.border = `2px solid ${BIRDS[birdKey].eggStroke}`;
            tube.appendChild(eggDiv);
            const count = gameState.placedCounts[birdKey];
            const newHeight = count * 16;
            tube.style.height = Math.min(newHeight, 180) + 'px';
            tube.classList.add('correct-glow');
            setTimeout(() => tube.classList.remove('correct-glow'), 700);
            document.getElementById(`bird-count-${birdKey}`).textContent = toPersianNum(count);

            updateTargetCounter();

            showToast(`✅ تخم ${BIRDS[birdKey].name} درست!`, 'green');
            checkWinCondition();
            checkLoseCondition();
            checkGameOver();
        }

        function handleWrongDrop(eggEl, targetTube, tubeBird) {
            if (gameState.activeItem === 'mistake_shield' && gameState.shieldUses < 3) {
                gameState.shieldUses++;
                const left = 3 - gameState.shieldUses;
                showToast(`🛡️ اشتباه بخشیده شد! ${left > 0 ? left + ' محافظ مونده' : 'محافظ تموم شد'}`, 'purple');
                updateActiveEffectsBar();
                returnEggToFall(eggEl);
                return;
            }

            gameState.wrongDrags++;
            gameState.eggsProcessed++;
            targetTube.classList.add('wrong-shake');
            setTimeout(() => targetTube.classList.remove('wrong-shake'), 600);
            showToast(`❌ اشتباه! این تخم مال ${BIRDS[tubeBird].name} نیست!`, 'red');

            updateTargetCounter();

            removeActiveEgg(eggEl);
            eggEl.remove();
            checkLoseCondition();
            checkGameOver();
        }

        // ادامه سقوط با همون سرعت قبلی
        function returnEggToFall(eggEl) {
            eggEl._dragging = false;
            const skyZone = document.getElementById('sky-zone');
            const skyH = skyZone.offsetHeight;
            const endY = skyH + 40;
            let curTop = parseFloat(eggEl.style.top);
            if (isNaN(curTop)) {
                curTop = eggEl.getBoundingClientRect().top - skyZone.getBoundingClientRect().top;
            }

            // سرعت اصلی تخم (پیکسل بر میلی‌ثانیه) حفظ میشه
            const origSpeed = (eggEl._endY - eggEl._startY) / eggEl._fallDuration;
            const remaining = Math.max(endY - curTop, 12);

            eggEl._startY = curTop;
            eggEl._endY = endY;
            eggEl._fallDuration = remaining / origSpeed;
            eggEl._elapsed = 0;

            startEggLoop();
        }

        function removeActiveEgg(el) {
            const idx = gameState.activeEggs.indexOf(el);
            if (idx !== -1) gameState.activeEggs.splice(idx, 1);
        }

        function updateTargetCounter() {
            const remaining = gameState.totalEggs - gameState.eggsProcessed;
            document.getElementById('targetCountLabel').textContent = toPersianNum(Math.max(0, remaining));
        }

        function showSlowmoBadge(show) {
            const b = document.getElementById('slowmoBadge');
            if (b) b.classList.toggle('show', show);
        }

        function checkWinCondition() {
            const halfEggs = Math.ceil(gameState.totalEggs / 2);
            if (gameState.eggsPlacedCorrect >= halfEggs && gameState.eggsPlacedCorrect > 0) {
                gameState.isWin = true;
                endGame(true);
            }
        }

        function checkLoseCondition() {
            const halfEggs = Math.ceil(gameState.totalEggs / 2);
            const lostEggs = gameState.eggsMissed + gameState.wrongDrags;
            if (lostEggs >= halfEggs && gameState.eggsPlacedCorrect < halfEggs) {
                gameState.isWin = false;
                endGame(false);
            }
        }

        function checkGameOver() {
            if (gameState.eggQueue.length === 0 && gameState.activeEggs.length === 0) {
                const halfEggs = Math.ceil(gameState.totalEggs / 2);
                if (gameState.eggsPlacedCorrect >= halfEggs && gameState.eggsPlacedCorrect > 0) {
                    gameState.isWin = true;
                    endGame(true);
                } else {
                    gameState.isWin = false;
                    endGame(false);
                }
            }
        }

        function endGame(isWin) {
            if (gameState.isGameOver) return;
            gameState.running = false;
            gameState.isGameOver = true;
            gameState.slowUntil = 0;
            clearTimeout(gameState.spawnTimeout);
            cancelDrag();

            document.getElementById('egg-container').innerHTML = '';
            gameState.activeEggs = [];

            // محاسبه داخلی زمان (نمایش داده نمیشه)
            if (gameState.startTime) {
                const elapsedSec = Math.round((Date.now() - gameState.startTime) / 1000);
                const stats = loadStats();
                stats.totalTime = (stats.totalTime || 0) + elapsedSec;
                if (!stats.bestTime || elapsedSec < stats.bestTime) stats.bestTime = elapsedSec;
                stats.totalGames = (stats.totalGames || 0) + 1;
                stats.totalCorrectDrags = (stats.totalCorrectDrags || 0) + gameState.correctDrags;
                stats.totalWrongDrags = (stats.totalWrongDrags || 0) + gameState.wrongDrags;
                saveStats(stats);
            }

            // باز کردن مرحله بعد در صورت برد
            if (isWin) {
                const stats = loadStats();
                stats.levelCompleted[gameState.level] = true;
                const next = gameState.level + 1;
                if (next <= 15) stats.levelUnlocked[next] = true;
                saveStats(stats);

                const coinsEarned = gameState.correctDrags;
                gameState.coins += coinsEarned;
                saveCoins();

                showToast('🎉 عالی! برنده شدی!', 'gold');
                launchConfetti();

                setTimeout(() => { showResult(true); }, 800);
            } else {
                showToast('😔 متاسفم! تخم‌ها از دست رفتن!', 'red');
                setTimeout(() => { showResult(false); }, 500);
            }
        }

        function showResult(isWin) {
            const content = document.getElementById('resultContent');
            const halfEggs = Math.ceil(gameState.totalEggs / 2);
            const coinsEarned = gameState.correctDrags;

            let maxCount = 0,
                winner = gameState.birds[0];
            for (const birdKey of gameState.birds) {
                if (gameState.placedCounts[birdKey] > maxCount) {
                    maxCount = gameState.placedCounts[birdKey];
                    winner = birdKey;
                }
            }

            if (isWin) {
                let towersHtml = '';
                const maxH = 70;
                const maxVal = Math.max(...gameState.birds.map(b => gameState.placedCounts[b] || 0));
                for (const birdKey of gameState.birds) {
                    const count = gameState.placedCounts[birdKey] || 0;
                    const h = maxVal > 0 ? Math.max(6, Math.round((count / maxVal) * maxH)) : 6;
                    const isWinner = birdKey === winner;
                    towersHtml += `
                        <div class="result-tower-item">
                            <div class="result-tower-bar ${isWinner ? 'winner' : ''}" style="height:${h}px;"></div>
                            <div class="result-tower-label">${BIRDS[birdKey].name}</div>
                            <div class="result-tower-count">${toPersianNum(count)}</div>
                        </div>
                    `;
                }

                const predCorrect = gameState.prediction === winner;
                content.innerHTML = `
                    <div class="result-winner-wrap">
                        <div class="result-icon-box">
                            <img src="icons/happy gamer.png" alt="تبریک" onerror="this.textContent='🎉'">
                        </div>
                        <div style="font-size:22px;font-weight:900;color:var(--gold);margin-top:8px;">🎉 آفرین!</div>
                        <div style="font-size:16px;color:var(--text-secondary);font-weight:700;margin-top:4px;">برنده مسابقه</div>
                        <div class="result-winner-name" style="margin-top:4px;">${BIRDS[winner].name}</div>
                        <div style="width:64px;height:64px;margin:6px auto;">${getBirdVisual(winner)}</div>
                        <div style="font-size:14px;color:var(--gold);">${toPersianNum(maxCount)} تخم</div>
                    </div>

                    <div class="result-coin-display">
                        <img src="icons/coin.png" alt="سکه" onerror="this.textContent='🪙'">
                        <span>+ ${toPersianNum(coinsEarned)} سکه</span>
                    </div>

                    <div class="result-stats-grid">
                        <div class="result-stat-item">
                            <div class="stat-label">🥚 کل تخم‌ها</div>
                            <div class="stat-value blue">${toPersianNum(gameState.totalEggs)}</div>
                        </div>
                        <div class="result-stat-item">
                            <div class="stat-label">✅ انداخته شده درست</div>
                            <div class="stat-value green">${toPersianNum(gameState.eggsPlacedCorrect)}</div>
                        </div>
                        <div class="result-stat-item">
                            <div class="stat-label">❌ اشتباه</div>
                            <div class="stat-value red">${toPersianNum(gameState.wrongDrags)}</div>
                        </div>
                        <div class="result-stat-item">
                            <div class="stat-label">🎯 حد نصاب برد</div>
                            <div class="stat-value gold">${toPersianNum(halfEggs)}</div>
                        </div>
                    </div>

                    <div class="result-towers-mini">${towersHtml}</div>

                    <div class="result-prediction-row">
                        <div style="font-size:14px;color:var(--text-secondary);margin-bottom:5px;">حدس اولیه تو: <strong style="color:var(--text-color);">${BIRDS[gameState.prediction]?.name || '—'}</strong></div>
                        <div style="font-size:15px;font-weight:800;" class="${predCorrect ? 'correct' : 'wrong'}">
                            ${predCorrect ? '✅ حدست درست بود!' : '❌ حدست اشتباه بود — ولی یاد گرفتی!'}
                        </div>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:10px;width:100%;margin-top:10px;">
                        <button class="btn btn-gold" onclick="goNextLevel()" style="background:var(--btn-gold-bg);color:#0a0a1a;border:1px solid rgba(255,255,255,0.25);box-shadow:0 4px 25px rgba(255,201,60,0.3);">🚀 مرحله بعد</button>
                        <button class="btn btn-primary" onclick="retryLevel()" style="background:var(--btn-primary-bg);color:#fff;border:1px solid rgba(255,255,255,0.15);">🔄 شروع دوباره</button>

                    </div>

            } else {
                content.innerHTML = `
                    <div class="result-winner-wrap">
                        <div class="result-icon-box lose">
                            <img src="icons/sad gamer.png" alt="متاسفم" onerror="this.textContent='😢'">
                        </div>
                        <div style="font-size:22px;font-weight:900;color:var(--danger);margin-top:8px;">😔 متاسفم!</div>
                        <div style="font-size:16px;color:var(--text-secondary);font-weight:700;margin-top:4px;">نتونستی برج‌ها رو کامل کنی</div>
                    </div>

                    <div class="result-stats-grid">
                        <div class="result-stat-item">
                            <div class="stat-label">🥚 کل تخم‌ها</div>
                            <div class="stat-value blue">${toPersianNum(gameState.totalEggs)}</div>
                        </div>
                        <div class="result-stat-item">
                            <div class="stat-label">✅ انداخته شده درست</div>
                            <div class="stat-value green">${toPersianNum(gameState.eggsPlacedCorrect)}</div>
                        </div>
                        <div class="result-stat-item">
                            <div class="stat-label">💔 شکسته</div>
                            <div class="stat-value red">${toPersianNum(gameState.eggsMissed)}</div>
                        </div>
                        <div class="result-stat-item">
                            <div class="stat-label">🎯 حد نصاب برد</div>
                            <div class="stat-value gold">${toPersianNum(halfEggs)}</div>
                        </div>
                    </div>

                    <div style="font-size:14px;color:var(--text-secondary);text-align:center;margin:8px 0;padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
                        برای برد باید حداقل <strong style="color:var(--gold);">${toPersianNum(halfEggs)}</strong> تا تخم رو درست می‌انداختی!
                    </div>

                    <div style="display:flex;flex-direction:column;gap:10px;width:100%;margin-top:10px;">
                        <button class="btn btn-primary" onclick="retryLevel()" style="background:var(--btn-primary-bg);color:#fff;border:1px solid rgba(255,255,255,0.15);">🔄 تلاش دوباره</button>
                        <button class="btn btn-secondary" onclick="goHomeFromLose()" style="background:var(--btn-secondary-bg);backdrop-filter:blur(12px);color:var(--text-color);border:1px solid var(--glass-border);">🏠 خروج به منو</button>
                    </div>
                `;
            }

            document.getElementById('modal-result').classList.add('open');
        }

        function goNextLevel() {
            const nextLevel = gameState.level + 1;
            if (nextLevel > 15) {
                showToast('🎉 همه مراحل رو کامل کردی!', 'gold');
                closeModal('modal-result');
                goHome();
                return;
            }
            const stats = loadStats();
            if (stats.levelUnlocked && stats.levelUnlocked[nextLevel]) {
                closeModal('modal-result');
                startGame(nextLevel);
            } else {
                showToast('🔒 مرحله بعد قفل است!', 'red');
                closeModal('modal-result');
                goHome();
            }
        }

        function goHome() {
            document.getElementById('modal-result').classList.remove('open');
            stopGame();
            showScreen('screen-landing');
        }

        function goHomeFromLose() {
            document.getElementById('modal-result').classList.remove('open');
            stopGame();
            showScreen('screen-landing');
        }

        function retryLevel() {
            document.getElementById('modal-result').classList.remove('open');
            const currentLevel = gameState.level;
            stopGame();
            setTimeout(() => { startGame(currentLevel); }, 300);
        }

        // ===== STOP MENU =====
        function showStopMenu() {
            if (gameState.isGameOver) return;
            gameState.paused = true; // توقف واقعی بازی
            const btn = document.getElementById('stopBtn');
            btn.classList.add('active-stop');
            document.getElementById('modal-stop').classList.add('open');
        }

        function continueGame() {
            document.getElementById('modal-stop').classList.remove('open');
            const btn = document.getElementById('stopBtn');
            btn.classList.remove('active-stop');
            gameState.paused = false;
            lastFrameTs = performance.now();
            clearTimeout(gameState.spawnTimeout);
            scheduleNextEgg();
        }

        function restartGame() {
            document.getElementById('modal-stop').classList.remove('open');
            document.getElementById('modal-result').classList.remove('open');
            const btn = document.getElementById('stopBtn');
            btn.classList.remove('active-stop');
            if (gameState.isGameOver) return;
            const currentLevel = gameState.level;
            stopGame();
            setTimeout(() => { startGame(currentLevel); }, 300);
        }

        function quitGame() {
            document.getElementById('modal-stop').classList.remove('open');
            const btn = document.getElementById('stopBtn');
            btn.classList.remove('active-stop');
            stopGame();
            showScreen('screen-landing');
        }

        function launchConfetti() {
            const layer = document.getElementById('confetti-layer');
            const colors = ['#ff7b2e', '#f7c843', '#43e97b', '#4fc3f7', '#a78bfa', '#ff5252', '#ffe566'];
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.top = '-20px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = (8 + Math.random() * 8) + 'px';
                piece.style.height = (8 + Math.random() * 8) + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
                piece.style.animationDelay = Math.random() * 0.8 + 's';
                layer.appendChild(piece);
                setTimeout(() => piece.remove(), 4500);
            }
        }

        // ===== INIT =====
        loadCoins();
        loadShopPurchases();
        updateCoinDisplay();
        updateActiveEffectsBar();

        const initStats = loadStats();
        if (!initStats.levelUnlocked) initStats.levelUnlocked = { 1: true };
        if (!initStats.levelCompleted) initStats.levelCompleted = {};
        saveStats(initStats);

        setInterval(() => {
            if (!gameState.running) return;
            gameState.activeEggs = gameState.activeEggs.filter(el => el.parentNode);
        }, 600);

        console.log('🎮 بازی مسابقه برج‌سازی تخم آماده است!');
        console.log('🥚 تخم‌ها موقع افتادن می‌شکنن!');
        console.log('🐢 موقع نگه داشتن تخم، همه‌چیز آهسته میشه!');
        console.log('♾️ زمان بازی بی‌نهایته (فقط داخلی محاسبه میشه)');
    </script>
