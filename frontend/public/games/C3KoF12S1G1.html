<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مسابقه برج‌سازی تخم</title>
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6C5CE7;
            --secondary: #00D2FF;
            --neon-blue: #00D2FF;
            --neon-purple: #A855F7;
            --success: #00B894;
            --danger: #FF7675;
            --dark: #0a0a1a;
            --gold: #FFC93C;
            --gold-dark: #B96F00;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-color: #FFFFFF;
            --text-secondary: #A0A0B0;
            --font-family: 'Shoor Rounded', 'Shoor', Tahoma, sans-serif;
            --shadow-xl: 0 15px 70px rgba(0, 0, 0, 0.7);
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            --body-bg: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 30%, #0d1b2a 60%, #0a0a1a 100%);
            --btn-primary-bg: linear-gradient(135deg, #6C5CE7, #00D2FF);
            --btn-primary-shadow: rgba(108, 92, 231, 0.5);
            --btn-secondary-bg: rgba(255, 255, 255, 0.05);
            --btn-secondary-hover: rgba(255, 255, 255, 0.12);
            --btn-gold-bg: linear-gradient(135deg, #FFC93C, #f59e0b);
            --btn-danger-bg: linear-gradient(135deg, #FF7675, #c0392b);
            --menu-text-color: #FFFFFF;
            --menu-text-secondary: #A0A0B0;
            --btn-start-bg: linear-gradient(135deg, #FFC93C, #f59e0b);
            --btn-start-color: #0a0a1a;
            --btn-start-shadow: rgba(255, 201, 60, 0.4);
            --btn-start-hover-bg: linear-gradient(135deg, #FF6B6B, #FFD93D);
            --neon-glow: 0 0 30px rgba(0, 210, 255, 0.15), 0 0 60px rgba(108, 92, 231, 0.1);
            --border-glow: rgba(0, 210, 255, 0.15);
            --card-bg: rgba(255, 255, 255, 0.03);
            --header-border: rgba(0, 210, 255, 0.15);
            --game-card-border: rgba(0, 210, 255, 0.06);
            --countdown-color: #FFC93C;
            --sky-top: #0a0a1a;
            --sky-bottom: #1a0a2e;
            --ground: #6C5CE7;
            --ground-dark: #5A4BD1;
            --tower-bg: rgba(108, 92, 231, 0.22);
            --tower-border: rgba(108, 92, 231, 0.4);
            --tube-shine: rgba(255, 255, 255, 0.1);
            --correct-color: #43e97b;
            --wrong-color: #ff5252;
            --toast-blue: #3b82f6;
            --toast-green: #22c55e;
            --toast-red: #ef4444;
            --toast-gold: #f59e0b;
            --toast-purple: #a855f7;
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.3);
            --radius-lg: 22px;
            --radius-md: 14px;
            --radius-sm: 9px;
        }

        body.theme-default {
            --primary: #6C5CE7;
            --secondary: #00D2FF;
            --neon-blue: #00D2FF;
            --neon-purple: #A855F7;
            --body-bg: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 30%, #0d1b2a 60%, #0a0a1a 100%);
            --sky-top: #0a0a1a;
            --sky-bottom: #1a0a2e;
            --ground: #6C5CE7;
            --ground-dark: #5A4BD1;
            --text-color: #FFFFFF;
            --text-secondary: #A0A0B0;
            --menu-text-color: #FFFFFF;
            --menu-text-secondary: #A0A0B0;
            --btn-start-bg: linear-gradient(135deg, #FFC93C, #f59e0b);
            --btn-start-color: #0a0a1a;
            --btn-start-hover-bg: linear-gradient(135deg, #FF6B6B, #FFD93D);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.03);
            --countdown-color: #FFC93C;
            --gold: #FFC93C;
            --tower-bg: rgba(108, 92, 231, 0.22);
            --tower-border: rgba(108, 92, 231, 0.4);
        }

        body.theme-ocean {
            --primary: #0EA5E9;
            --secondary: #22D3EE;
            --neon-blue: #0EA5E9;
            --neon-purple: #22D3EE;
            --body-bg: linear-gradient(180deg, #0EA5E9 0%, #0369A1 50%, #0C4A6E 100%);
            --sky-top: #0C4A6E;
            --sky-bottom: #0369A1;
            --ground: #0EA5E9;
            --ground-dark: #0284C7;
            --text-color: #D4F4FF;
            --text-secondary: #BAE6FD;
            --menu-text-color: #FFFFFF;
            --menu-text-secondary: #BAE6FD;
            --glass-border: rgba(14, 165, 233, 0.12);
            --card-bg: rgba(255, 255, 255, 0.05);
            --countdown-color: #22D3EE;
            --gold: #FCD34D;
            --btn-start-bg: linear-gradient(135deg, #FCD34D, #F59E0B);
            --btn-start-color: #0C4A6E;
            --btn-start-hover-bg: linear-gradient(135deg, #FBBF24, #FCD34D);
            --tower-bg: rgba(14, 165, 233, 0.22);
            --tower-border: rgba(14, 165, 233, 0.4);
        }

        body.theme-moonlight {
            --primary: #818CF8;
            --secondary: #A78BFA;
            --neon-blue: #818CF8;
            --neon-purple: #A78BFA;
            --body-bg: linear-gradient(180deg, #1E1B4B 0%, #312E81 30%, #4C1D95 60%, #1E1B4B 100%);
            --sky-top: #1E1B4B;
            --sky-bottom: #312E81;
            --ground: #818CF8;
            --ground-dark: #6366F1;
            --text-color: #E0E7FF;
            --text-secondary: #C7D2FE;
            --menu-text-color: #E0E7FF;
            --menu-text-secondary: #C7D2FE;
            --glass-border: rgba(129, 140, 248, 0.12);
            --card-bg: rgba(255, 255, 255, 0.03);
            --countdown-color: #818CF8;
            --gold: #FCD34D;
            --btn-start-bg: linear-gradient(135deg, #FCD34D, #F59E0B);
            --btn-start-color: #1E1B4B;
            --btn-start-hover-bg: linear-gradient(135deg, #FBBF24, #FCD34D);
            --tower-bg: rgba(129, 140, 248, 0.22);
            --tower-border: rgba(129, 140, 248, 0.4);
        }

        body.theme-magic {
            --primary: #A855F7;
            --secondary: #F472B6;
            --neon-blue: #A855F7;
            --neon-purple: #F472B6;
            --body-bg: linear-gradient(180deg, #1E1B4B 0%, #4C1D95 30%, #A855F7 60%, #F472B6 85%, #FBBF24 100%);
            --sky-top: #1E1B4B;
            --sky-bottom: #4C1D95;
            --ground: #A855F7;
            --ground-dark: #9333EA;
            --text-color: #F3E8FF;
            --text-secondary: #D8B4FE;
            --menu-text-color: #F3E8FF;
            --menu-text-secondary: #7600f4;
            --glass-border: rgba(168, 85, 247, 0.12);
            --card-bg: rgba(255, 255, 255, 0.03);
            --countdown-color: #A855F7;
            --gold: #FBBF24;
            --btn-start-bg: linear-gradient(135deg, #FBBF24, #F472B6);
            --btn-start-color: #1E1B4B;
            --btn-start-hover-bg: linear-gradient(135deg, #A855F7, #FBBF24);
            --tower-bg: rgba(168, 85, 247, 0.22);
            --tower-border: rgba(168, 85, 247, 0.4);
        }

        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-Regular.ttf") format("truetype");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-Medium.ttf") format("truetype");
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-Black.ttf") format("truetype");
            font-weight: 900;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-ExtraBold.ttf") format("truetype");
            font-weight: 800;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-Regular.ttf") format("truetype");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-Medium.ttf") format("truetype");
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-Black.ttf") format("truetype");
            font-weight: 900;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-ExtraBold.ttf") format("truetype");
            font-weight: 800;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: var(--font-family);
            outline: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark);
        }

        body {
            color: var(--text-color);
            position: relative;
            background-image: var(--body-bg);
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed;
            transition: background 0.6s ease, color 0.6s ease;
        }

        .neon-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .neon-orb-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
            background: rgba(108, 92, 231, 0.3);
            animation: orbFloat 8s ease-in-out infinite;
        }
        .neon-orb-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -150px;
            background: rgba(0, 210, 255, 0.2);
            animation: orbFloat 10s ease-in-out infinite reverse;
        }
        .neon-orb-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 160, 0.1);
            animation: orbFloat 12s ease-in-out infinite;
        }
        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            z-index: 1;
            overflow-y: auto;
        }
        .screen.active {
            display: flex;
            animation: screenFadeIn 0.4s ease;
        }
        @keyframes screenFadeIn {
            from {
                opacity: 0;
                transform: scale(0.98) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl), var(--neon-glow), inset 0 1px 1px rgba(255, 255, 255, 0.02);
            color: var(--text-color);
            position: relative;
            z-index: 2;
            transition: all 0.5s ease;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            position: relative;
            overflow: hidden;
            width: 100%;
            min-height: 56px;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transition: left 0.6s;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 25px var(--btn-primary-shadow), 0 0 40px var(--secondary);
        }
        .btn-primary:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 8px 35px var(--btn-primary-shadow), 0 0 60px var(--secondary);
            border-color: var(--secondary);
        }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            backdrop-filter: blur(12px);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
        }
        .btn-secondary:hover {
            transform: translateY(-4px) scale(1.02);
            background: var(--btn-secondary-hover);
            border-color: var(--secondary);
            box-shadow: 0 0 25px var(--secondary);
        }

        .btn-gold {
            background: var(--btn-gold-bg);
            color: #0a0a1a;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 25px rgba(255, 201, 60, 0.3);
        }
        .btn-gold:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 35px rgba(255, 201, 60, 0.4);
        }

        .btn-start {
            background: var(--btn-start-bg) !important;
            color: var(--btn-start-color) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 4px 25px var(--btn-start-shadow) !important;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        .btn-start:hover {
            background: var(--btn-start-hover-bg) !important;
            transform: translateY(-6px) scale(1.03) !important;
            box-shadow: 0 8px 35px var(--btn-start-shadow), 0 0 50px var(--secondary) !important;
            border-color: var(--secondary) !important;
        }
        .btn-start:active {
            transform: scale(0.95) !important;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .back-btn:hover {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 118, 117, 0.4);
            background: rgba(255, 118, 117, 0.1);
            transform: rotate(180deg);
        }

        .menu-container {
            padding: 30px 20px 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .coin-display {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px rgba(255, 201, 60, 0.2), inset 0 0 20px rgba(255, 201, 60, 0.05);
            z-index: 10;
        }
        .coin-display img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            animation: coinSpin 3s ease-in-out infinite;
        }
        .coin-amount {
            color: var(--gold);
            font-weight: 800;
            font-size: 1rem;
            text-shadow: 0 0 20px var(--gold);
        }
        @keyframes coinSpin {
            0%,
            100% {
                transform: rotateY(0deg);
            }
            50% {
                transform: rotateY(180deg);
            }
        }

        .menu-title {
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 4px;
            font-family: 'Shoor Black', 'Shoor', Tahoma, sans-serif;
            background: linear-gradient(135deg, var(--menu-text-color), var(--gold), var(--neon-blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow: 0 0 40px rgba(0, 210, 255, 0.1);
        }
        .menu-subtitle {
            color: var(--menu-text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 15px;
        }
        .menu-character {
            width: 150px;
            height: 150px;
            margin: 10px auto 15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.4) 100%);
            border: 3px solid var(--gold);
            box-shadow: 0 0 60px rgba(255, 201, 60, 0.25), inset 0 0 60px rgba(255, 201, 60, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: framePulse 3s ease-in-out infinite;
        }
        @keyframes framePulse {
            0%,
            100% {
                box-shadow: 0 0 40px rgba(255, 201, 60, 0.2), 0 0 80px var(--neon-blue);
            }
            50% {
                box-shadow: 0 0 80px rgba(255, 201, 60, 0.4), 0 0 120px var(--secondary);
            }
        }
        .menu-character img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }
        .menu-buttons .row {
            display: flex;
            gap: 10px;
        }
        .menu-buttons .row .btn {
            flex: 1;
        }

        /* ===== GAME SCREEN ===== */
        #screen-game {
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%, var(--ground) 100%);
            flex-direction: column;
            overflow: hidden;
            padding: 10px 0 0 0;
        }

        .game-topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--header-border);
            flex-shrink: 0;
            margin-top: 40px;
            gap: 4px;
            flex-wrap: wrap;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .game-topbar .game-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--secondary);
        }
        .game-topbar .game-level {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid var(--header-border);
        }
        .game-topbar .target-counter {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--gold);
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid var(--header-border);
        }

        .slowmo-badge {
            display: none;
            font-size: 0.65rem;
            font-weight: 800;
            color: #fff;
            background: rgba(0, 210, 255, 0.25);
            border: 1px solid var(--secondary);
            border-radius: 20px;
            padding: 3px 10px;
            animation: slowmoPulse 1s ease-in-out infinite;
        }
        .slowmo-badge.show {
            display: inline-block;
        }
        @keyframes slowmoPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .stop-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2.5px solid rgba(255, 118, 117, 0.25);
            background: rgba(255, 118, 117, 0.08);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            position: relative;
        }
        .stop-btn:hover,
        .stop-btn:focus {
            border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 118, 117, 0.5), inset 0 0 20px rgba(255, 118, 117, 0.1);
            background: rgba(255, 118, 117, 0.15);
            transform: rotate(180deg);
        }
        .stop-btn .stop-ring {
            position: absolute;
            top: -4px;
            left: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            border-radius: 50%;
            border: 3px solid transparent;
            transition: all 0.5s ease;
            pointer-events: none;
        }
        .stop-btn:hover .stop-ring {
            border-color: var(--danger);
            box-shadow: 0 0 40px rgba(255, 118, 117, 0.5);
        }
        .stop-btn .stop-icon {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .stop-btn:hover .stop-icon {
            transform: rotate(180deg);
        }

        .stop-modal .modal-box {
            max-width: 320px;
        }
        .stop-modal .modal-box .stop-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .stop-modal .modal-box .stop-options .btn {
            min-height: 48px;
            font-size: 0.9rem;
        }
        .stop-modal .modal-box .stop-options .btn-continue {
            background: linear-gradient(135deg, #00B894, #00D2FF);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 184, 148, 0.3);
        }
        .stop-modal .modal-box .stop-options .btn-restart {
            background: linear-gradient(135deg, #FFC93C, #f59e0b);
            color: #0a0a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(255, 201, 60, 0.3);
        }
        .stop-modal .modal-box .stop-options .btn-quit {
            background: linear-gradient(135deg, #FF7675, #c0392b);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(255, 118, 117, 0.3);
        }

        .sky-zone {
            flex: 0 0 32%;
            position: relative;
            width: 100%;
            overflow: visible !important;
            margin-top: 4px;
        }

        .egg-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible !important;
        }
        .falling-egg {
            position: absolute;
            cursor: grab;
            pointer-events: all;
            touch-action: none;
            z-index: 15;
            transform-origin: center;
            transition: filter 0.15s, transform 0.05s;
            will-change: top, transform;
        }
        .falling-egg.dragging {
            cursor: grabbing;
            z-index: 100;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
            transform: scale(1.12);
            transition: transform 0.05s;
        }

        .towers-zone {
            flex: 0 0 42%;
            position: relative;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            padding: 0 8px 0px;
            overflow: visible;
        }
        .tower-slot {
            flex: 1;
            max-width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }
        .tower-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 3px;
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            padding: 2px 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            backdrop-filter: blur(4px);
        }
        .tower-tube {
            width: 48px;
            min-height: 20px;
            max-height: 180px;
            background: var(--tower-bg);
            border: 2.5px solid var(--tower-border);
            border-radius: 6px 6px 3px 3px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 2px 0 6px rgba(255, 255, 255, 0.05), 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
        }
        .tower-tube::before {
            content: '';
            position: absolute;
            top: 0;
            left: 6px;
            width: 8px;
            height: 100%;
            background: var(--tube-shine);
            border-radius: 4px;
            pointer-events: none;
        }
        .tower-tube.drop-target {
            border-color: #43e97b;
            box-shadow: 0 0 0 4px rgba(67, 233, 123, 0.4), inset 2px 0 6px rgba(255, 255, 255, 0.05);
            transform: scaleY(1.06);
        }
        .tower-tube.wrong-shake {
            animation: tube-shake 0.5s ease;
        }
        .tower-tube.correct-glow {
            animation: tube-glow 0.6s ease;
        }
        .tower-base {
            width: 60px;
            height: 10px;
            background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            border-radius: 4px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }
        .egg-in-tube {
            width: 38px;
            height: 12px;
            border-radius: 50%;
            margin: 1px 0;
            flex-shrink: 0;
            animation: egg-plop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes egg-plop {
            0% {
                transform: scaleX(1.3) scaleY(0.7);
            }
            100% {
                transform: scaleX(1) scaleY(1);
            }
        }

        .birds-zone {
            flex: 0 0 26%;
            width: 100%;
            padding: 4px 8px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .bird-panel {
            flex: 1;
            max-width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .bird-svg-wrap {
            width: 54px;
            height: 54px;
            position: relative;
        }
        .bird-svg-wrap svg,
        .bird-svg-wrap img {
            width: 100%;
            height: 100%;
            transition: transform 0.3s;
            pointer-events: none;
        }
        .bird-panel.happy .bird-svg-wrap svg,
        .bird-panel.happy .bird-svg-wrap img {
            animation: bird-happy 0.5s ease;
        }
        .bird-panel.sad .bird-svg-wrap svg,
        .bird-panel.sad .bird-svg-wrap img {
            animation: bird-sad 0.4s ease;
        }
        .bird-count-badge {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-color);
            backdrop-filter: blur(4px);
        }
        .bird-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
        }

        .ground-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(180deg, var(--ground) 0%, var(--ground-dark) 100%);
            flex-shrink: 0;
            border-top: 2px solid rgba(255, 255, 255, 0.05);
        }

        /* ===== BROKEN EGG ===== */
        .egg-shell-piece {
            position: absolute;
            pointer-events: none;
            z-index: 14;
            will-change: transform, opacity;
            animation: shellFallDown 1.1s cubic-bezier(0.3, 0.6, 0.7, 1) forwards;
        }
        .egg-shell-piece.left {
            animation-name: shellFallL;
        }
        .egg-shell-piece.right {
            animation-name: shellFallR;
        }
        @keyframes shellFallL {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(-24px, 150px) rotate(-140deg); opacity: 0; }
        }
        @keyframes shellFallR {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(24px, 150px) rotate(140deg); opacity: 0; }
        }
        .egg-yolk-piece {
            position: absolute;
            pointer-events: none;
            z-index: 13;
            border-radius: 50%;
            will-change: transform, opacity;
            animation: yolkDrop 1.1s ease-in forwards;
        }
        @keyframes yolkDrop {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            55% { transform: translateY(100px) scale(1.25); opacity: 1; }
            100% { transform: translateY(150px) scale(0.9); opacity: 0; }
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(10, 30, 60, 0.7);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow-y: auto;
        }
        .modal-overlay.open {
            display: flex;
            animation: screenFadeIn 0.3s ease;
        }
        .modal-box {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 2px solid var(--gold);
            border-radius: 32px;
            padding: 30px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 201, 60, 0.15);
            color: var(--text-color);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }
        .modal-overlay.open .modal-box {
            transform: scale(1);
        }

        .modal-detective {
            width: 72px;
            height: 72px;
            margin: 0 auto 10px;
        }
        .modal-title {
            font-size: 19px;
            font-weight: 900;
            color: var(--gold);
            text-align: center;
            margin-bottom: 8px;
        }
        .modal-text {
            font-size: 15px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .modal-predict-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-bottom: 12px;
        }
        .predict-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 14px;
            cursor: pointer;
            min-width: 68px;
            transition: border-color 0.15s, background 0.15s, transform 0.1s;
            font-family: var(--font-family);
        }
        .predict-btn:active {
            transform: scale(0.93);
        }
        .predict-btn.selected {
            border-color: var(--gold);
            background: rgba(255, 201, 60, 0.1);
        }
        .predict-btn-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
        }

        .btn-confirm-start {
            background: var(--btn-gold-bg) !important;
            color: #0a0a1a !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 4px 25px rgba(255, 201, 60, 0.4) !important;
            font-size: 1.1rem !important;
            padding: 16px !important;
            transition: all 0.3s ease !important;
        }
        .btn-confirm-start:hover {
            transform: translateY(-3px) scale(1.02) !important;
            box-shadow: 0 6px 30px rgba(255, 201, 60, 0.5) !important;
        }
        .btn-confirm-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== RESULT MODAL ===== */
        .result-icon-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), rgba(255, 201, 60, 0.05));
            box-shadow: 0 0 80px rgba(255, 201, 60, 0.3), 0 0 150px rgba(0, 210, 255, 0.1);
            animation: happyFloat 2s ease-in-out infinite, popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 0 auto;
        }
        .result-icon-box img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            animation: happyRotate 4s ease-in-out infinite;
        }
        .result-icon-box.lose {
            border-color: var(--danger);
            box-shadow: 0 0 80px rgba(255, 118, 117, 0.3), 0 0 150px rgba(255, 118, 117, 0.1);
            animation: sadFloat 2s ease-in-out infinite, popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .result-icon-box.lose img {
            animation: sadRotate 4s ease-in-out infinite;
        }
        @keyframes happyFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        @keyframes happyRotate {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes sadFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(5px) scale(0.95); }
        }
        @keyframes sadRotate {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .result-winner-name {
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
        }
        .result-prediction-row {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 18px;
            width: 100%;
            text-align: center;
            margin: 10px 0;
        }
        .result-prediction-row .correct {
            color: var(--success);
            font-weight: 900;
        }
        .result-prediction-row .wrong {
            color: var(--danger);
            font-weight: 900;
        }
        .result-towers-mini {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .result-tower-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .result-tower-bar {
            width: 34px;
            background: linear-gradient(180deg, var(--neon-blue), var(--primary));
            border-radius: 4px 4px 0 0;
            transition: height 0.5s;
        }
        .result-tower-bar.winner {
            background: linear-gradient(180deg, #ffe566, var(--gold));
        }
        .result-tower-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .result-tower-count {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .result-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin: 10px 0;
        }
        .result-stat-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }
        .result-stat-item .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .result-stat-item .stat-value {
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
            margin-top: 2px;
        }
        .result-stat-item .stat-value.green {
            color: var(--success);
        }
        .result-stat-item .stat-value.red {
            color: var(--danger);
        }
        .result-stat-item .stat-value.blue {
            color: var(--neon-blue);
        }

        .result-coin-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
            background: rgba(255, 201, 60, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 201, 60, 0.2);
            margin: 8px 0;
        }
        .result-coin-display img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* ===== TOAST ===== */
        #toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 92%;
            max-width: 380px;
            pointer-events: none;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 16px;
            font-family: var(--font-family);
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            pointer-events: none;
            max-width: 100%;
        }
        .toast.fade-out {
            animation: toast-out 0.3s ease forwards;
        }
        .toast .toast-coin {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
        }
        .toast.blue { background: var(--toast-blue); }
        .toast.green { background: var(--toast-green); }
        .toast.red { background: var(--toast-red); }
        .toast.gold { background: var(--toast-gold); }
        .toast.purple { background: var(--toast-purple); }
        @keyframes toast-in {
            from { transform: translateY(-20px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes toast-out {
            from { transform: translateY(0) scale(1); opacity: 1; }
            to { transform: translateY(-16px) scale(0.9); opacity: 0; }
        }

        /* ===== CONFETTI ===== */
        #confetti-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 500;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: conf-fall linear forwards;
        }
        @keyframes conf-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ===== COUNTDOWN ===== */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 8000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            flex-direction: column;
        }
        .countdown-overlay.show {
            display: flex;
            animation: countdownFadeIn 0.3s ease;
        }
        @keyframes countdownFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .countdown-number {
            font-size: 14rem;
            font-weight: 900;
            font-family: 'Shoor Black', 'Shoor', Tahoma, sans-serif;
            text-shadow: 0 0 100px var(--countdown-color), 0 0 200px var(--countdown-color);
            animation: countdownPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
            transition: color 0.3s ease;
            letter-spacing: 8px;
        }
        .countdown-number.go-text {
            font-size: 8rem;
            animation: countdownGo 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 4px;
        }
        @keyframes countdownPop {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(3deg); opacity: 1; }
            70% { transform: scale(0.95); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes countdownGo {
            0% { transform: scale(0.3) translateY(30px); opacity: 0; }
            40% { transform: scale(1.2) translateY(-5px); opacity: 1; }
            70% { transform: scale(0.95); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .countdown-label {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 15px;
            opacity: 0.7;
            font-family: var(--font-family);
            letter-spacing: 2px;
        }

        /* ===== KEYFRAMES ===== */
        @keyframes tube-shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            15% { transform: translateX(-6px) rotate(-4deg); }
            30% { transform: translateX(6px) rotate(4deg); }
            45% { transform: translateX(-5px) rotate(-3deg); }
            60% { transform: translateX(5px) rotate(3deg); }
            75% { transform: translateX(-3px) rotate(-2deg); }
        }
        @keyframes tube-glow {
            0%, 100% { box-shadow: inset 2px 0 6px rgba(255, 255, 255, 0.05), 0 2px 8px rgba(0, 0, 0, 0.15); }
            50% { box-shadow: inset 2px 0 6px rgba(255, 255, 255, 0.05), 0 0 20px rgba(67, 233, 123, 0.4), 0 0 8px rgba(67, 233, 123, 0.2); }
        }
        @keyframes bird-happy {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.18) translateY(-5px); }
            50% { transform: scale(1.12) translateY(-2px); }
        }
        @keyframes bird-sad {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }

        /* ===== EFFECTS STYLES ===== */
        .effect-star {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            animation: starFloat 1.5s ease-out forwards;
        }
        @keyframes starFloat {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5) rotate(360deg); opacity: 0; }
        }
        .effect-particle {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            border-radius: 50%;
            animation: particleExplode 0.8s ease-out forwards;
        }
        @keyframes particleExplode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        .effect-confetti-piece {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            width: 8px;
            height: 8px;
            animation: confettiFall 3s linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
        }
        .effect-glow {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            animation: glowPulse 1.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0.8; }
        }
        .effect-firework {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            font-size: 20px;
            animation: fireworkBurst 1s ease-out forwards;
        }
        @keyframes fireworkBurst {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(2) rotate(180deg); opacity: 0; }
        }
        .snow-particle {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            background: white;
            border-radius: 50%;
            animation: snowFall linear forwards;
        }
        @keyframes snowFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(360deg); opacity: 0; }
        }

        /* ===== LEVELS ===== */
        .levels-container {
            max-width: 420px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
        }
        .levels-container h2 {
            color: var(--gold);
            font-size: 1.8rem;
            font-family: 'Shoor Black', Tahoma, sans-serif;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(255, 201, 60, 0.2);
            flex-shrink: 0;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 10px 0;
            flex: 1;
            align-content: start;
            overflow-y: auto;
            padding: 4px;
        }
        .level-grid::-webkit-scrollbar { width: 3px; }
        .level-grid::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

        .level-box {
            aspect-ratio: 1/1;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--text-color);
            position: relative;
            padding: 6px;
        }
        .level-box:hover {
            transform: translateY(-2px) scale(1.05);
            border-color: var(--secondary);
            box-shadow: 0 0 30px var(--secondary);
            z-index: 2;
        }
        .level-box .level-number {
            font-size: 1.6rem;
            font-weight: 900;
            font-family: 'Shoor Black', Tahoma, sans-serif;
        }
        .level-box.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .level-box.locked:hover {
            transform: none;
            border-color: var(--glass-border);
            box-shadow: none;
            filter: grayscale(0.5);
            opacity: 0.4;
        }
        .level-box .lock-icon {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.6rem;
            opacity: 0.7;
        }
        .level-box .check-icon {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.6rem;
            opacity: 0.7;
        }

        /* ===== SHOP ===== */
        .shop-container {
            max-width: 420px;
            width: 100%;
            padding: 20px 15px 15px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
        }
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .shop-header h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-color);
            font-family: var(--font-family);
        }
        .shop-coin {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            box-shadow: 0 0 20px rgba(255, 201, 60, 0.1);
        }
        .shop-coin img { width: 18px; height: 18px; }
        .shop-coin span {
            color: var(--gold);
            font-weight: 800;
            font-size: 0.9rem;
        }

        .shop-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-shrink: 0;
            overflow-x: auto;
            padding: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }
        .shop-tabs::-webkit-scrollbar { height: 3px; }
        .shop-tabs::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        .shop-tab {
            flex: 1;
            padding: 10px 6px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: var(--font-family);
            text-align: center;
        }
        .shop-tab:hover { color: var(--text-color); }
        .shop-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 0 20px var(--btn-primary-shadow);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding: 5px 2px 10px;
            flex: 1;
        }
        .shop-grid::-webkit-scrollbar { width: 4px; }
        .shop-grid::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        .shop-item {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            color: var(--text-color);
            justify-content: space-between;
            cursor: pointer;
            min-height: 260px;
        }
        .shop-item:hover {
            transform: translateY(-4px);
            border-color: var(--secondary);
            box-shadow: 0 0 30px var(--secondary);
        }
        .shop-item.active-item {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 201, 60, 0.2);
            background: rgba(255, 201, 60, 0.05);
        }
        .shop-item .shop-item-icon {
            font-size: 3rem;
            margin-bottom: 4px;
        }
        .shop-item .name {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-color);
            margin-top: 2px;
        }
        .shop-item .desc {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin: 2px 0;
        }
        .shop-item .price {
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .shop-item .price img { width: 14px; height: 14px; }
        .shop-btn-sm {
            padding: 5px 10px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-family);
            font-weight: 700;
            font-size: 0.65rem;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            margin-top: 3px;
            min-height: 28px;
        }
        .shop-btn-sm.buy {
            background: var(--btn-gold-bg);
            color: #0a0a1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .shop-btn-sm.buy:hover { transform: scale(1.04); }
        .shop-btn-sm.active {
            background: var(--success);
            color: #fff;
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .shop-btn-sm.select {
            background: var(--secondary);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .shop-btn-sm.select:hover { transform: scale(1.04); }
        .shop-btn-sm.locked {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-guide .modal-box .guide-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            text-align: right;
        }
        .modal-guide .modal-box .guide-step-num {
            background: var(--neon-blue);
            color: #fff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            flex-shrink: 0;
        }
        .modal-guide .modal-box .guide-step-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.55;
        }

        /* ===== ACTIVE EFFECTS INDICATOR ===== */
        .active-effects-bar {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }
        .active-effect-badge {
            font-size: 0.6rem;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
        }
        .active-effect-badge .remove-effect {
            cursor: pointer;
            color: var(--danger);
            font-size: 0.5rem;
        }

        /* ===== GUIDE SCREEN ===== */
        #screen-guide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(30px);
            animation: guideFadeIn 0.5s ease;
        }
        #screen-guide.active { display: flex; }

        @keyframes guideFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .guide-container {
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl), 0 0 60px rgba(108, 92, 231, 0.15);
            padding: 35px 30px 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .guide-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(108, 92, 231, 0.03) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== PIXEL CHARACTER ===== */
        .pixel-wrap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 0 60px rgba(255, 201, 60, 0.25), inset 0 0 60px rgba(255, 201, 60, 0.05);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-bottom: 12px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.4) 100%);
        }
        .pixel-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.15s ease;
        }
        .pixel-wrap.talking img {
            animation: pixelTalk 0.15s ease-in-out infinite alternate;
        }
        .pixel-wrap.happy img {
            animation: pixelHappy 0.5s ease-in-out infinite alternate;
        }
        .pixel-wrap.idle img {
            animation: pixelFloat 3s ease-in-out infinite;
        }

        @keyframes pixelTalk {
            0% { transform: scale(1) translateY(0) rotate(-1deg); }
            100% { transform: scale(1.05) translateY(-2px) rotate(2deg); }
        }
        @keyframes pixelHappy {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.05) translateY(-5px); }
        }
        @keyframes pixelFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== SPEECH BUBBLE ===== */
        .speech-bubble {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 120px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 20px 22px;
            margin: 6px 0 14px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: all 0.5s ease;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid rgba(255, 255, 255, 0.04);
        }

        .speech-text {
            font-size: 1.2rem;
            line-height: 1.9;
            color: var(--text-color);
            text-align: center;
            font-weight: 500;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
        }
        .speech-text .highlight {
            color: var(--gold);
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 201, 60, 0.4);
        }
        .speech-text .emoji-big {
            font-size: 1.8rem;
        }
        .speech-text .line {
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            animation: textReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes textReveal {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); filter: blur(3px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* ===== PROGRESS BAR ===== */
        .progress-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 6px 0 14px;
            position: relative;
            z-index: 1;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--gold));
            border-radius: 4px;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        /* ===== TIME INDICATOR ===== */
        .time-indicator {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        /* ===== GUIDE BUTTONS ===== */
        .guide-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }
        .guide-buttons .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            min-height: 50px;
        }
        .guide-buttons .btn:active { transform: scale(0.95); }

        .btn-skip {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }
        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-color: var(--danger);
            transform: translateY(-2px);
        }

        .btn-skip.hidden { display: none; }

        @media (max-width: 400px) {
            .guide-container { padding: 22px 16px 20px; }
            .pixel-wrap { width: 75px; height: 75px; }
            .speech-text { font-size: 1rem; min-height: 60px; }
            .speech-bubble { padding: 14px 16px; min-height: 90px; }
            .guide-buttons .btn { font-size: 0.8rem; padding: 10px 14px; min-height: 42px; }
        }

        @media (min-width: 600px) {
            .pixel-wrap { width: 120px; height: 120px; }
            .speech-text { font-size: 1.3rem; }
        }

        @media (max-width: 380px) {
            .tower-tube { width: 38px; }
            .tower-base { width: 50px; }
            .egg-in-tube { width: 30px; height: 10px; }
            .bird-svg-wrap { width: 44px; height: 44px; }
            .menu-title { font-size: 1.8rem; }
            .menu-character { width: 120px; height: 120px; }
            .stop-btn { width: 30px; height: 30px; }
            .game-topbar .game-title { font-size: 0.55rem; }
            .game-topbar .game-level { font-size: 0.5rem; padding: 1px 6px; }
            .game-topbar .target-counter { font-size: 0.5rem; padding: 1px 6px; }
            .level-box .level-number { font-size: 1.2rem; }
            .result-icon-box { width: 90px; height: 90px; }
            .modal-box { padding: 20px 16px; }
            .result-stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .countdown-number { font-size: 9rem; }
            .countdown-number.go-text { font-size: 5rem; }
            .shop-item { min-height: 200px; }
        }
        @media (min-height: 700px) {
            .sky-zone { flex: 0 0 34%; }
            .towers-zone { flex: 0 0 40%; }
            .birds-zone { flex: 0 0 26%; }
        }
        @media (min-width: 480px) {
            .tower-tube { width: 56px; }
            .tower-base { width: 68px; }
            .towers-zone { gap: 14px; }
        }
    </style>
</head>
<body>

    <div class="neon-orb neon-orb-1"></div>
    <div class="neon-orb neon-orb-2"></div>
    <div class="neon-orb neon-orb-3"></div>
    <div class="stars" id="stars"></div>

    <div id="toast-container"></div>
    <div id="confetti-layer"></div>
    <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-number" id="countdownNumber">۳</div>
        <div class="countdown-label" id="countdownLabel">آماده‌ای؟</div>
    </div>

    <!-- ===== صفحه اصلی ===== -->
    <div class="screen active" id="screen-landing">
        <div class="menu-container glass-card" style="max-width:400px;">
            <div class="coin-display">
                <img src="icons/coin.png" alt="Coin" onerror="this.textContent='🪙'">
                <span class="coin-amount" id="menu-coin-amount">0</span>
            </div>
            <div class="menu-character">
                <img src="icons/gamerhi.png" alt="Pixel" onerror="this.textContent='🧑‍🌾'">
            </div>
            <p class="menu-subtitle">تو معمار برج‌هایی! تخم‌ها رو بگیر و بلندترین برج رو بساز!</p>

            <div class="menu-buttons">
                <button onclick="handleStartGame()" class="btn btn-start">🚀 شروع بازی</button>
                <div class="row">
                    <button onclick="openGuideFromMenu()" class="btn btn-secondary">📘 راهنما</button>
                    <button onclick="showShop()" class="btn btn-secondary">🛍️ فروشگاه</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== فروشگاه ===== -->
    <div class="screen" id="screen-shop">
        <div class="shop-container glass-card" style="max-width:400px;width:100%;padding:20px 15px 15px;max-height:92vh;display:flex;flex-direction:column;">
            <div class="shop-header">
                <button class="back-btn" onclick="showScreen('screen-landing')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;">
                        <path d="M19 12H5M12 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h2>🛍️ فروشگاه</h2>
                <div class="shop-coin">
                    <img src="icons/coin.png" alt="Coin" onerror="this.textContent='🪙'" style="width:18px;height:18px;">
                    <span id="shop-coin-amount">0</span>
                </div>
            </div>
            <div class="shop-tabs">
                <button class="shop-tab active" data-tab="powers">⚡ قدرت‌ها</button>
                <button class="shop-tab" data-tab="effects">🎆 افکت‌های ویژه</button>
            </div>
            <div class="shop-grid" id="shop-grid"></div>
        </div>
    </div>

    <!-- ===== صفحه انتخاب سطح ===== -->
    <div class="screen" id="screen-level">
        <div class="levels-container glass-card">
            <h2> مراحل بازی</h2>
            <div class="level-grid" id="levelGrid"></div>
            <button class="btn btn-secondary" onclick="showScreen('screen-landing')" style="margin-top:10px;flex-shrink:0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
                بازگشت
            </button>
        </div>
    </div>

    <!-- ===== صفحه بازی ===== -->
    <div class="screen" id="screen-game">
        <div class="game-topbar">
            <button class="stop-btn" id="stopBtn" onclick="showStopMenu()" aria-label="توقف بازی">
                <span class="stop-ring"></span>
                <svg class="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                </svg>
            </button>
            <span class="game-title">🥚 مسابقه برج‌سازی</span>
