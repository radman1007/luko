<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 بازی اعداد لوکو</title>
    
    <style>
      /* ============================================
         LOKO Design System - Typography
         ============================================ */
      @font-face {
        font-family: "Shoor";
        src: url("./fonts/Shoor-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Shoor";
        src: url("./fonts/Shoor-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Shoor";
        src: url("./fonts/Shoor-Black.ttf") format("truetype");
        font-weight: 900;
      }
      @font-face {
        font-family: "Shoor";
        src: url("./fonts/Shoor-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }
      @font-face {
        font-family: "Shoor Rounded";
        src: url("./fonts/ShoorRounded-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Shoor Rounded";
        src: url("./fonts/ShoorRounded-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Shoor Rounded";
        src: url("./fonts/ShoorRounded-Black.ttf") format("truetype");
        font-weight: 900;
      }
      @font-face {
        font-family: "Shoor Rounded";
        src: url("./fonts/ShoorRounded-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }

      /* ============================================
         Reset & Base
         ============================================ */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
          --primary: #6C5CE7;
          --neon-blue: #00D2FF;
          --neon-pink: #FF00A0;
          --neon-green: #00FF9D;
          --accent: #FFEAA7;
          --success: #00B894;
          --danger: #FF7675;
          --dark: #1E1E2F;
          --gold: #FFC93C;
          --gold-dark: #B96F00;
          --glass: rgba(255, 255, 255, 0.15);
          --glass-border: rgba(255, 255, 255, 0.3);
          --font: 'Shoor Rounded', 'Shoor', Tahoma, sans-serif;
      }

      html, body { height: 100%; overflow-x: hidden; }

      body {
          font-family: var(--font);
          background: linear-gradient(135deg, #0c0a14 0%, #181225 100%);
          color: #fff;
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          overflow-y: auto;
      }

      /* ============================================
         LOKO Galaxy Background
         ============================================ */
      .galaxy-bg {
          position: fixed;
          top: 0; left: 0;
          width: 100%; height: 100%;
          z-index: -1;
          overflow: hidden;
          transition: background 0.8s ease;
      }

      .stars, .stars2, .stars3 {
          position: absolute;
          top: 0; left: 0;
          width: 100%; height: 100%;
      }

      .stars {
          background-image: 
              radial-gradient(2px 2px at 20px 30px, #fff, transparent),
              radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
              radial-gradient(1px 1px at 90px 40px, #fff, transparent),
              radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
              radial-gradient(1px 1px at 230px 80px, #fff, transparent),
              radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
              radial-gradient(1px 1px at 370px 200px, #fff, transparent),
              radial-gradient(2px 2px at 450px 50px, rgba(255,255,255,0.8), transparent);
          background-size: 500px 500px;
          animation: twinkle 4s ease-in-out infinite;
      }
      .stars2 {
          background-image: 
              radial-gradient(1px 1px at 50px 100px, #fff, transparent),
              radial-gradient(2px 2px at 100px 200px, rgba(255,255,255,0.6), transparent),
              radial-gradient(1px 1px at 200px 150px, #fff, transparent),
              radial-gradient(1px 1px at 280px 250px, rgba(255,255,255,0.8), transparent),
              radial-gradient(2px 2px at 350px 100px, #fff, transparent),
              radial-gradient(1px 1px at 420px 300px, rgba(255,255,255,0.7), transparent);
          background-size: 600px 600px;
          animation: twinkle 6s ease-in-out infinite reverse;
      }
      .stars3 {
          background-image: 
              radial-gradient(3px 3px at 150px 50px, rgba(108, 92, 231, 0.8), transparent),
              radial-gradient(2px 2px at 250px 180px, rgba(255, 0, 160, 0.6), transparent),
              radial-gradient(3px 3px at 400px 120px, rgba(0, 255, 157, 0.5), transparent);
          background-size: 700px 700px;
          animation: twinkle 8s ease-in-out infinite;
      }

      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

      /* ============================================
         Screens & Layout
         ============================================ */
      .screen {
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          min-height: 100vh;
          min-height: 100dvh;
          padding: 20px;
          padding-bottom: 100px;
          animation: fadeIn 0.5s ease;
          overflow-y: auto;
          max-width: 480px;
          margin: 0 auto;
          width: 100%;
      }
      .screen.active { display: flex; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

      /* ============================================
         LOKO Coin System
         ============================================ */
      .coin-display {
          display: flex;
          align-items: center;
          gap: 8px;
          background: var(--glass);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          border-radius: 30px;
          padding: 6px 16px 6px 6px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.2);
          margin-bottom: 15px;
          transition: transform 0.3s ease;
      }
      .coin-display:hover { transform: scale(1.05); }
      .coin-icon-img {
          width: 32px; height: 32px;
          object-fit: contain;
          filter: drop-shadow(0 0 8px var(--gold));
          animation: spin 3s linear infinite;
      }
      .coin-amount {
          font-weight: 800;
          font-size: 1.3rem;
          color: var(--gold);
          text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* ============================================
         Character (Gamer)
         ============================================ */
      .character-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-bottom: 20px;
          flex-shrink: 0;
      }
      .character-img {
          width: 120px;
          height: 120px;
          object-fit: contain;
          animation: float 3s ease-in-out infinite;
          filter: drop-shadow(0 10px 15px rgba(108,92,231,0.5));
      }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

      /* Speech Bubble */
      .speech-bubble {
          background: var(--glass);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          border-radius: 16px;
          padding: 12px 20px;
          margin-bottom: 15px;
          position: relative;
          max-width: 280px;
          text-align: center;
          animation: bubblePop 0.5s ease;
          box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }
      .speech-bubble::after {
          content: '';
          position: absolute;
          bottom: -10px;
          left: 50%;
          transform: translateX(-50%);
          border: 8px solid transparent;
          border-top-color: var(--glass-border);
      }
      .speech-text {
          font-size: 1rem;
          line-height: 1.5;
          color: var(--accent);
          font-weight: 500;
      }
      @keyframes bubblePop { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

      /* ============================================
         LOKO Buttons System
         ============================================ */
      .menu-buttons {
          display: flex;
          flex-direction: column;
          gap: 12px;
          width: 100%;
          max-width: 300px;
          align-items: center;
      }
      .btn {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          border: none;
          border-radius: 16px;
          font-family: var(--font);
          font-size: 1.1rem;
          font-weight: 800;
          cursor: pointer;
          transition: transform 0.1s ease, box-shadow 0.2s ease;
          position: relative;
          overflow: hidden;
          min-height: 56px;
          width: 100%;
          box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
      .btn-icon { font-size: 1.3rem; }

      .btn-primary {
          background: linear-gradient(180deg, #FFE68A 0%, var(--gold) 45%, var(--gold-dark) 100%);
          color: #1E1E2F;
          text-shadow: 0 1px 1px rgba(255,255,255,0.3);
          box-shadow: 0 6px 0 #8a4f00, 0 8px 15px rgba(255, 201, 60, 0.4);
      }
      .btn-primary:active { box-shadow: 0 2px 0 #8a4f00, 0 3px 8px rgba(255, 201, 60, 0.4); }

      .btn-secondary {
          background: var(--glass);
          backdrop-filter: blur(10px);
          border: 2px solid var(--gold);
          color: var(--gold);
          box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      }
      .btn-secondary:active { box-shadow: 0 1px 0 rgba(0,0,0,0.3); }

      .btn-danger {
          background: linear-gradient(180deg, #ff8a8a 0%, var(--danger) 45%, #d32f2f 100%);
          color: white;
          box-shadow: 0 6px 0 #8a1f1f, 0 8px 15px rgba(255, 118, 117, 0.3);
      }
      .btn-danger:active { box-shadow: 0 2px 0 #8a1f1f; }

      .btn-back {
          position: fixed;
          bottom: 20px; right: 20px;
          padding: 10px 16px;
          background: var(--glass);
          backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          color: white;
          border-radius: 12px;
          font-size: 0.9rem;
          z-index: 100;
          min-height: 44px;
          width: auto;
          box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }
      .btn-split-container { display: flex; gap: 12px; width: 100%; }
      .btn-split-container .btn { font-size: 0.9rem; min-height: 48px; }

      .btn-show-number {
          background: linear-gradient(180deg, #8df0ff 0%, var(--neon-blue) 45%, #0099cc 100%);
          color: var(--dark);
          box-shadow: 0 6px 0 #006080, 0 8px 15px rgba(0, 210, 255, 0.4);
          margin: 15px 0;
          min-width: 180px;
          font-weight: 900;
      }
      .btn-show-number:active { box-shadow: 0 2px 0 #006080; }
      .btn-show-number:disabled { background: #555; color: #aaa; box-shadow: none; cursor: not-allowed; transform: none; }

      /* ============================================
         Game Screen Layout
         ============================================ */
      .game-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
          padding: 12px 16px;
          background: var(--glass);
          backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          border-radius: 16px;
          margin-bottom: 15px;
          flex-shrink: 0;
          box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }
      .level-badge {
          display: flex;
          flex-direction: column;
          align-items: center;
          background: linear-gradient(135deg, var(--primary) 0%, #5849c4 100%);
          padding: 6px 12px;
          border-radius: 12px;
          min-width: 60px;
          border: 1px solid var(--glass-border);
      }
      .level-badge span:first-child { font-size: 0.65rem; opacity: 0.9; }
      #level-number { font-size: 1.3rem; font-weight: 900; }
      .score-display, .timer-display { font-size: 0.9rem; font-weight: 800; color: var(--accent); }

      .game-area { display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; }
      
      /* ============================================
         Flip Card
         ============================================ */
      .card-container { perspective: 1000px; margin: 10px 0; flex-shrink: 0; }
      .flip-card { width: 140px; height: 170px; cursor: pointer; }
      .flip-card-inner {
          position: relative;
          width: 100%; height: 100%;
          transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
          transform-style: preserve-3d;
      }
      .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
      .flip-card-front, .flip-card-back {
          position: absolute;
          width: 100%; height: 100%;
          backface-visibility: hidden;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .flip-card-front {
          background: linear-gradient(135deg, var(--primary) 0%, #4834d4 100%);
          border: 3px solid rgba(255, 255, 255, 0.3);
      }
      .card-pattern { text-align: center; color: white; }
      .card-pattern .star-icon { font-size: 3rem; animation: spin 10s linear infinite; }
      .card-pattern p { font-size: 0.8rem; margin-top: 8px; opacity: 0.9; }
      
      .flip-card-back {
          background: linear-gradient(135deg, var(--neon-pink) 0%, #c0007a 100%);
          border: 3px solid rgba(255, 255, 255, 0.3);
          transform: rotateY(180deg);
      }
      
      .number-display-container {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-wrap: wrap;
          gap: 5px;
          width: 100%;
          padding: 10px;
      }
      .number-img {
          width: 50px;
          height: 50px;
          object-fit: contain;
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      }
      .number-img.small {
          width: 35px;
          height: 35px;
      }
      .placeholder-text {
          font-size: 4rem;
          font-weight: 900;
          color: white;
      }

      /* ============================================
         Options
         ============================================ */
      .options-container {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
          width: 100%;
          max-width: 260px;
          margin-top: 15px;
          opacity: 0;
          transform: translateY(20px);
          transition: all 0.5s ease;
          pointer-events: none;
          flex-shrink: 0;
      }
      .options-container.show { opacity: 1; transform: translateY(0); pointer-events: all; }
      .option-btn {
          padding: 10px;
          font-size: 1.3rem;
          font-weight: 900;
          background: var(--glass);
          backdrop-filter: blur(10px);
          border: 2px solid var(--glass-border);
          border-radius: 14px;
          color: white;
          cursor: pointer;
          transition: all 0.2s ease;
          min-height: 80px;
          box-shadow: 0 4px 0 rgba(0,0,0,0.3);
          display: flex;
          align-items: center;
          justify-content: center;
      }
      .option-btn:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.2); }
      .option-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
      .option-btn.correct { background: linear-gradient(135deg, var(--success) 0%, #008f6b 100%); border-color: var(--success); animation: correctPulse 0.5s ease; }
      .option-btn.wrong { background: linear-gradient(135deg, var(--danger) 0%, #d32f2f 100%); border-color: var(--danger); animation: shake 0.5s ease; }
      @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

      /* ============================================
         Help Screen & Shop Screen
         ============================================ */
      .help-container, .shop-container {
          background: var(--glass);
          backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          border-radius: 20px;
          padding: 25px;
          max-width: 320px;
          width: 100%;
          box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      }
      .help-container h2, .shop-container h2 {
          text-align: center;
          margin-bottom: 20px;
          font-size: 1.3rem;
          color: var(--gold);
      }
      .help-item {
          display: flex;
          align-items: flex-start;
          gap: 12px;
          margin-bottom: 15px;
          padding: 12px;
          background: rgba(255, 255, 255, 0.05);
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.05);
      }
      .help-icon { font-size: 1.6rem; min-width: 40px; text-align: center; }
      .help-text h3 { font-size: 0.9rem; margin-bottom: 4px; color: var(--neon-blue); }
      .help-text p { font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }
      .help-container .btn, .shop-container .btn { width: 100%; margin-top: 12px; }

      /* Shop Grid */
      .shop-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 15px;
          margin-bottom: 15px;
      }
      .theme-card {
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 16px;
          padding: 10px;
          text-align: center;
          transition: transform 0.2s;
      }
      .theme-card:hover { transform: translateY(-3px); }
      .theme-preview {
          width: 100%;
          height: 80px;
          border-radius: 10px;
          margin-bottom: 10px;
          background-size: cover;
          background-position: center;
          border: 1px solid rgba(255,255,255,0.1);
      }
      .theme-name { font-size: 0.9rem; font-weight: 800; margin-bottom: 5px; }
      .theme-price {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 5px;
          background: rgba(0,0,0,0.3);
          padding: 4px 8px;
          border-radius: 20px;
          font-size: 0.8rem;
          color: var(--gold);
          margin-bottom: 8px;
      }
      .theme-btn {
          width: 100%;
          padding: 6px;
          border: none;
          border-radius: 8px;
          font-family: var(--font);
          font-weight: 700;
          font-size: 0.8rem;
          cursor: pointer;
          transition: transform 0.1s;
      }
      .theme-btn:active { transform: scale(0.95); }
      .theme-btn.buy { background: var(--gold); color: var(--dark); }
      .theme-btn.select { background: var(--success); color: white; }
      .theme-btn.selected { background: #333; color: #aaa; cursor: default; }
      .theme-btn.locked { background: #555; color: #aaa; cursor: not-allowed; }

      /* ============================================
         Tutorial Modal
         ============================================ */
      .modal {
          display: none;
          position: fixed;
          top: 0; left: 0;
          width: 100%; height: 100%;
          background: rgba(0, 0, 0, 0.9);
          backdrop-filter: blur(5px);
          z-index: 1000;
          align-items: center;
          justify-content: center;
          animation: modalFadeIn 0.3s ease;
          padding: 20px;
          flex-direction: column;
      }
      .modal.show { display: flex; }
      @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

      .tutorial-content {
          background: linear-gradient(135deg, #1E1E2F 0%, #2d2d44 100%);
          border: 2px solid var(--glass-border);
          border-radius: 20px;
          padding: 20px;
          text-align: center;
          max-width: 320px;
          width: 100%;
          position: relative;
      }
      .tutorial-character {
          width: 150px;
          height: 150px;
          object-fit: contain;
          margin: 0 auto 10px;
          animation: float 3s ease-in-out infinite;
      }
      .tutorial-bubble {
          background: var(--glass);
          border: 1px solid var(--glass-border);
          border-radius: 16px;
          padding: 15px;
          margin-bottom: 20px;
          min-height: 80px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
      .tutorial-text {
          font-size: 1.1rem;
          font-weight: 800;
          color: var(--accent);
          line-height: 1.4;
      }

      /* Game Over Modal */
      .modal-content {
          background: linear-gradient(135deg, #1E1E2F 0%, #2d2d44 100%);
          border: 2px solid var(--glass-border);
          border-radius: 20px;
          padding: 30px;
          text-align: center;
          max-width: 300px;
          width: 100%;
          animation: modalPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      @keyframes modalPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
      .modal-icon { font-size: 3.5rem; margin-bottom: 12px; animation: bounce 1s ease infinite; }
      @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      .modal-content h2 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent); }
      .modal-content p { font-size: 1rem; opacity: 0.9; margin-bottom: 15px; }
      .modal-content .btn { width: 100%; }

      /* Notification */
      .notification {
          position: fixed;
          top: 20px; left: 50%;
          transform: translateX(-50%);
          z-index: 2000;
          animation: slideDown 0.3s ease;
      }
      @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-100%); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
      .notification-content {
          background: linear-gradient(135deg, var(--primary), #5849c4);
          color: white;
          padding: 15px 30px;
          border-radius: 12px;
          font-size: 1rem;
          box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
          border: 1px solid var(--glass-border);
      }

      @media (max-width: 380px) {
          .flip-card { width: 120px; height: 150px; }
          .number-img { width: 40px; height: 40px; }
      }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="galaxy-bg" id="galaxy-bg">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop></audio>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen active">
        <div class="coin-display">
            <img src="./icons/coin.png" class="coin-icon-img" alt="Coin">
            <div class="coin-amount" id="menu-coins">0</div>
        </div>
        
        <div class="character-container">
            <div class="speech-bubble">
                <p class="speech-text">سلام! آماده‌ای بریم؟ 🌟</p>
            </div>
            <img src="./icons/gamer.png" class="character-img" alt="Gamer Character">
        </div>
        
        <div class="menu-buttons">
            <button class="btn btn-primary" onclick="startGame()">
                <span class="btn-icon">▶️</span>
                شروع بازی
            </button>
            
            <div class="btn-split-container">
                <button class="btn btn-secondary" onclick="showScreen('shop-screen')">
                    <span class="btn-icon">🛍️</span>
                    فروشگاه
                </button>
                <button class="btn btn-secondary" onclick="showTutorial(false)">
                    <span class="btn-icon">❓</span>
                    راهنما
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="level-badge">
                <span>مرحله</span>
                <span id="level-number">1</span>
            </div>
            <div class="score-display">
                <span>امتیاز: </span>
                <span id="score">0</span>
            </div>
            <div class="timer-display">
                <span>⏱️</span>
                <span id="timer">120.0</span>
            </div>
        </div>

        <div class="game-area">
            <div class="speech-bubble" id="game-speech" style="margin-top: 15px; margin-bottom: 5px;">
                <p class="speech-text">روی دکمه دیدن آیتم‌ها بزن! 🚀</p>
            </div>

            <!-- Flip Card -->
            <div class="card-container">
                <div class="flip-card" id="flip-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="card-pattern">
                                <div class="star-icon">⭐</div>
                                <p>روی دکمه کلیک کن</p>
                            </div>
                        </div>
                        <div class="flip-card-back" id="card-back">
                            <div class="number-display-container" id="number-display">
                                <span class="placeholder-text">?</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Show Number Button -->
            <button class="btn btn-show-number" id="show-btn" onclick="revealNumber()">
                <span class="btn-icon">👁️</span>
                دیدن آیتم‌ها
            </button>

            <!-- Answer Options -->
            <div class="options-container" id="options-container">
                <!-- Options generated by JS -->
            </div>
        </div>

        <button class="btn btn-back" onclick="backToMenu()">
            <span>↩️</span>
            بازگشت
        </button>
    </div>

    <!-- Shop Screen -->
    <div id="shop-screen" class="screen">
        <div class="shop-container">
            <h2>🛍️ فروشگاه لوکو</h2>
            <div class="coin-display" style="margin: 0 auto 20px; width: fit-content;">
                <img src="./icons/coin.png" class="coin-icon-img" alt="Coin">
                <div class="coin-amount" id="shop-coins">0</div>
            </div>
            <div class="shop-grid" id="shop-grid"></div>
            <button class="btn btn-primary" onclick="showScreen('menu-screen')">
                <span>↩️</span>
                بازگشت به منو
            </button>
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal">
        <div class="tutorial-content">
            <img src="./icons/gamerhi.png" class="tutorial-character" alt="Guide">
            <div class="tutorial-bubble">
                <p class="tutorial-text" id="tutorial-text">سلام من پیکسل هستم دوست جدید تو در این بازی</p>
            </div>
            <button class="btn btn-danger" id="skip-tutorial-btn" onclick="skipTutorial()">
                <span class="btn-icon">⏭️</span>
                رد کردن
            </button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">⌛</div>
            <h2>زمان تمام شد!</h2>
            <p>امتیاز شما: <span id="final-score">0</span></p>
            <button class="btn btn-primary" onclick="backToMenu()">بازگشت به منو</button>
        </div>
    </div>

    <!-- Level Up Modal -->
    <div id="levelup-modal" class="modal">
        <div class="modal-content" style="background: linear-gradient(135deg, var(--primary) 0%, #4834d4 100%); border-color: var(--gold);">
            <div class="modal-icon">🎊</div>
            <h2>تبریک! مرحله جدید!</h2>
            <p id="new-level-text">مرحله ۲</p>
            <button class="btn btn-primary" onclick="startNewLevel()">شروع</button>
        </div>
    </div>

    <script>
      // ============================================
      // LOKO Design System - Space Number Guessing Game
      // ============================================

      // Themes Data
      const THEMES_DATA = [
          { 
              id: 'simple', 
              name: 'ساده', 
              price: 0, 
              bg: "radial-gradient(circle at 10% 20%, rgba(157, 78, 221, 0.4), transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 212, 255, 0.4), transparent 40%), radial-gradient(circle at 50% 50%, rgba(255, 60, 172, 0.2), transparent 60%), #050510", 
              music: "./musics/first1.mp3"
          },
          { 
              id: 'abnabati', 
              name: 'آبنباتی', 
              price: 10, 
              bg: "url('./icons/abnabati.png')", 
              music: "./musics/Abnabat.mp3"
          },
          { 
              id: 'snowy', 
              name: 'یخی', 
              price: 8, 
              bg: "url('./icons/snowy.png')", 
              music: "./musics/snowy.mp3"
          },
          { 
              id: 'sami', 
              name: 'جنگل سمی', 
              price: 15, 
              bg: "url('./icons/sami forest.png')", 
              music: "./musics/sami.mp3"
          },
          { 
              id: 'space', 
              name: 'فضایی', 
              price: 14, 
              bg: "url('./icons/space .png')", 
              music: "./musics/space.mp3"
          },
          { 
              id: 'forest', 
              name: 'جنگل', 
              price: 12, 
              bg: "url('./icons/forest.png')", 
              music: "./musics/forest.mp3"
          }
      ];

      // Game State
      const gameState = {
          currentNumber: 0,
          level: 1,
          score: 0,
          correctAnswers: 0,
          wrongAnswers: 0,
          roundCorrectAnswers: 0,
          timer: 120,
          timerInterval: null,
          isPlaying: false,
          maxNumber: 10,
          showTime: 1000,
          optionsCount: 4,
          initialCoins: 0,
          gameCompleted: false,
          maxLevels: 5
      };

      let stats = {
          bestTime: null,
          totalCorrect: 0,
          totalWrong: 0,
          totalGames: 0,
          highestLevel: 1
      };

      let lokoData = {
          coins: 0,
          pendingSync: false,
          ownedThemes: ['simple'],
          selectedTheme: 'simple',
          tutorialSeen: false
      };

      let audioContext = null;
      let tutorialAudio = null;
      let tutorialTimeouts = [];

      function initAudio() {
          if (!audioContext) {
              audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
      }

      function playSound(type) {
          try {
              initAudio();
              const oscillator = audioContext.createOscillator();
              const gainNode = audioContext.createGain();
              oscillator.connect(gainNode);
              gainNode.connect(audioContext.destination);
              
              switch(type) {
                  case 'reveal':
                      oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                      oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
                      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                      oscillator.start(audioContext.currentTime);
                      oscillator.stop(audioContext.currentTime + 0.3);
                      break;
                  case 'correct':
                      playMelody([523, 659, 784], 0.15);
                      break;
                  case 'wrong':
                      oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                      oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.3);
                      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                      oscillator.start(audioContext.currentTime);
                      oscillator.stop(audioContext.currentTime + 0.4);
                      break;
                  case 'levelup':
                      playMelody([523, 659, 784, 1047], 0.2);
                      break;
                  case 'click':
                      oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                      gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                      oscillator.start(audioContext.currentTime);
                      oscillator.stop(audioContext.currentTime + 0.1);
                      break;
                  case 'flip':
                      oscillator.type = 'triangle';
                      oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                      oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.15);
                      gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                      oscillator.start(audioContext.currentTime);
                      oscillator.stop(audioContext.currentTime + 0.2);
                      break;
                  case 'coin':
                      oscillator.frequency.setValueAtTime(988, audioContext.currentTime);
                      gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                      oscillator.start(audioContext.currentTime);
                      oscillator.stop(audioContext.currentTime + 0.2);
                      setTimeout(() => playMelody([1318], 0.2), 100);
                      break;
              }
          } catch(e) { console.log('Audio not supported'); }
      }

      function playMelody(frequencies, duration) {
          frequencies.forEach((freq, index) => {
              setTimeout(() => {
                  const osc = audioContext.createOscillator();
                  const gain = audioContext.createGain();
                  osc.connect(gain);
                  gain.connect(audioContext.destination);
                  osc.frequency.value = freq;
                  gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                  osc.start(audioContext.currentTime);
                  osc.stop(audioContext.currentTime + duration);
              }, index * (duration * 1000));
          });
      }

      // ============================================
      // Local Storage & Data Persistence
      // ============================================
      function loadLokoData() {
          try {
              const saved = localStorage.getItem('lokoPlatformData');
              if (saved) {
                  const parsed = JSON.parse(saved);
                  lokoData = { ...lokoData, ...parsed };
              }
          } catch(e) { console.log('Could not load LOKO data'); }
          updateCoinDisplay();
          applyTheme(lokoData.selectedTheme);
      }

      function saveLokoData() {
          try {
              localStorage.setItem('lokoPlatformData', JSON.stringify(lokoData));
              lokoData.pendingSync = true;
          } catch(e) { console.log('Could not save LOKO data'); }
      }

      window.addEventListener('online', syncLokoData);
      function syncLokoData() {
          if (lokoData.pendingSync) {
              console.log('Syncing LOKO data with server...');
              lokoData.pendingSync = false;
              saveLokoData();
          }
      }

      function updateCoinDisplay() {
          const coinEls = [document.getElementById('menu-coins'), document.getElementById('shop-coins')];
          coinEls.forEach(el => { if(el) el.textContent = lokoData.coins; });
      }

      function loadStats() {
          try {
              const saved = localStorage.getItem('spaceNumberStats');
              if (saved) stats = JSON.parse(saved);
          } catch(e) {}
      }

      function saveStats() {
          try { localStorage.setItem('spaceNumberStats', JSON.stringify(stats)); } catch(e) {}
      }

      function updateGameStats() {
          stats.totalCorrect += gameState.correctAnswers;
          stats.totalWrong += gameState.wrongAnswers;
          stats.totalGames++;
          saveStats();
      }

      // ============================================
      // Screen Navigation
      // ============================================
      function showScreen(screenId) {
          playSound('click');
          document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
          const targetScreen = document.getElementById(screenId);
          if (targetScreen) targetScreen.classList.add('active');
          
          if (screenId === 'shop-screen') renderShop();
      }

      function showNotification(message) {
          const notification = document.createElement('div');
          notification.className = 'notification';
          notification.innerHTML = `<div class="notification-content"><span>${message}</span></div>`;
          document.body.appendChild(notification);
          setTimeout(() => {
              notification.style.animation = 'slideDown 0.3s ease reverse';
              setTimeout(() => notification.remove(), 300);
          }, 2000);
      }

      // ============================================
      // Number Image Generation
      // ============================================
      function getNumberHTML(num, sizeClass = '') {
          let html = '';
          if (num <= 5 && num > 0) {
              html = `<img src="./icons/a${num}.png" class="number-img ${sizeClass}" alt="${num}">`;
          } else if (num > 0) {
              let fives = Math.floor(num / 5);
              let remainder = num % 5;
              for (let i = 0; i < fives; i++) {
                  html += `<img src="./icons/a5.png" class="number-img ${sizeClass}" alt="5">`;
              }
              if (remainder > 0) {
                  html += `<img src="./icons/a${remainder}.png" class="number-img ${sizeClass}" alt="${remainder}">`;
              }
          }
          return html;
      }

      // ============================================
      // Game Logic
      // ============================================
      function startGame() {
          playSound('click');
          
          if (!lokoData.tutorialSeen) {
              showTutorial(true);
              return;
          }
          
          startGameLogic();
      }

      function startGameLogic() {
          gameState.level = 1;
          gameState.score = 0;
          gameState.correctAnswers = 0;
          gameState.wrongAnswers = 0;
          gameState.roundCorrectAnswers = 0;
          gameState.maxNumber = 10;
          gameState.showTime = 1000;
          gameState.isPlaying = true;
          gameState.initialCoins = lokoData.coins;
          gameState.gameCompleted = false;
          
          document.getElementById('level-number').textContent = '1';
          document.getElementById('score').textContent = '0';
          
          resetCard();
          showScreen('game-screen');
          
          // Set initial timer display but don't start it
          gameState.timer = 120 - (gameState.level - 1) * 20;
          document.getElementById('timer').textContent = gameState.timer.toFixed(1);
          
          updateSpeech('روی دکمه دیدن آیتم‌ها بزن! 🚀');
      }

      function resetCard() {
          const card = document.getElementById('flip-card');
          const showBtn = document.getElementById('show-btn');
          const optionsContainer = document.getElementById('options-container');
          const numberDisplay = document.getElementById('number-display');
          
          card.classList.remove('flipped');
          showBtn.disabled = false;
          showBtn.style.display = 'flex';
          showBtn.style.opacity = '1';
          optionsContainer.classList.remove('show');
          optionsContainer.innerHTML = '';
          numberDisplay.innerHTML = '<span class="placeholder-text">?</span>';
      }

      function startTimer() {
          if (gameState.timerInterval) clearInterval(gameState.timerInterval);
          
          gameState.timerInterval = setInterval(() => {
              gameState.timer -= 0.1;
              if (gameState.timer <= 0) {
                  gameState.timer = 0;
                  stopTimer();
                  gameOver();
              }
              document.getElementById('timer').textContent = gameState.timer.toFixed(1);
          }, 100);
      }

      function stopTimer() {
          if (gameState.timerInterval) {
              clearInterval(gameState.timerInterval);
              gameState.timerInterval = null;
          }
      }

      function revealNumber() {
          playSound('flip');
          
          // Start timer only if it's not running yet (first reveal in the level)
          if (!gameState.timerInterval) {
              startTimer();
          }
          
          const card = document.getElementById('flip-card');
          const showBtn = document.getElementById('show-btn');
          const numberDisplay = document.getElementById('number-display');
          
          gameState.currentNumber = Math.floor(Math.random() * gameState.maxNumber) + 1;
          numberDisplay.innerHTML = getNumberHTML(gameState.currentNumber);
          
          card.classList.add('flipped');
          playSound('reveal');
          
          showBtn.disabled = true;
          showBtn.style.opacity = '0.5';
          
          updateSpeech('تعداد آیتم‌ها رو یادت بمونه! 🧠');
          
          setTimeout(() => {
              card.classList.remove('flipped');
              updateSpeech('حالا درست رو انتخاب کن! 🤔');
              setTimeout(() => generateOptions(), 500);
          }, gameState.showTime);
      }

      function generateOptions() {
          const optionsContainer = document.getElementById('options-container');
          optionsContainer.innerHTML = '';
          
          let options = [gameState.currentNumber];
          
          while (options.length < gameState.optionsCount) {
              const wrongNum = Math.floor(Math.random() * gameState.maxNumber) + 1;
              if (!options.includes(wrongNum)) options.push(wrongNum);
          }
          
          options = shuffleArray(options);
          
          options.forEach(num => {
              const btn = document.createElement('button');
              btn.className = 'option-btn';
              btn.innerHTML = getNumberHTML(num, 'small');
              btn.onclick = () => checkAnswer(num, btn);
              optionsContainer.appendChild(btn);
          });
          
          setTimeout(() => optionsContainer.classList.add('show'), 100);
      }

      function shuffleArray(array) {
          const newArray = [...array];
          for (let i = newArray.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
          }
          return newArray;
      }

      function checkAnswer(selectedNumber, buttonElement) {
          const isCorrect = selectedNumber === gameState.currentNumber;
          document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
          
          if (isCorrect) {
              playSound('correct');
              buttonElement.classList.add('correct');
              gameState.correctAnswers++;
              gameState.roundCorrectAnswers++;
              
              const baseScore = 10 * gameState.level;
              const speedBonus = Math.max(0, Math.floor(gameState.timer * 2));
              const roundScore = baseScore + speedBonus;
              gameState.score += roundScore;
              document.getElementById('score').textContent = gameState.score;
              
              updateSpeech('آفرین! درست بود! 🎉');
              
              if (gameState.roundCorrectAnswers >= 3) {
                  if (gameState.level >= gameState.maxLevels) {
                      gameState.gameCompleted = true;
                      completeGame();
                  } else {
                      setTimeout(() => levelUp(), 1000);
                  }
              } else {
                  setTimeout(() => nextRound(), 1500);
              }
          } else {
              playSound('wrong');
              buttonElement.classList.add('wrong');
              gameState.wrongAnswers++;
              gameState.roundCorrectAnswers = 0;
              
              document.querySelectorAll('.option-btn').forEach(btn => {
                  if (btn.innerHTML === getNumberHTML(gameState.currentNumber, 'small')) {
                      btn.classList.add('correct');
                  }
              });
              
              updateSpeech(`اشتباه بود! دوباره تلاش کن! 💪`);
              setTimeout(() => nextRound(), 2000);
          }
          
          updateGameStats();
      }

      function levelUp() {
          playSound('levelup');
          gameState.level++;
          gameState.roundCorrectAnswers = 0;
          gameState.maxNumber = 10 + (gameState.level - 1) * 5;
          gameState.showTime = Math.max(300, 1000 - (gameState.level - 1) * 100);
          document.getElementById('level-number').textContent = gameState.level;
          
          if (gameState.level > stats.highestLevel) {
              stats.highestLevel = gameState.level;
              saveStats();
          }
          
          stopTimer();
          gameState.timer = 120 - (gameState.level - 1) * 20;
          document.getElementById('timer').textContent = gameState.timer.toFixed(1);
          
          const modal = document.getElementById('levelup-modal');
          document.getElementById('new-level-text').textContent = `مرحله ${gameState.level} - زمان: ${gameState.timer} ثانیه`;
          modal.classList.add('show');
          updateSpeech('تبریک! مرحله جدید! 🎊');
      }

      function completeGame() {
          let reward = 0;
          if (gameState.initialCoins === 0) {
              reward = 10;
          } else {
              reward = 1;
          }
          
          lokoData.coins += reward;
          saveLokoData();
          playSound('coin');
          
          showNotification(`🎉 پاداش پایانی: +${reward} سکه لوکو`);
          updateCoinDisplay();
          stopTimer();
          
          setTimeout(() => backToMenu(), 2500);
      }

      function gameOver() {
          document.getElementById('final-score').textContent = gameState.score;
          document.getElementById('gameover-modal').classList.add('show');
          updateSpeech('زمان تمام شد! ⌛');
      }

      function startNewLevel() {
          playSound('click');
          document.getElementById('levelup-modal').classList.remove('show');
          resetCard();
          updateSpeech('آماده‌ای؟ روی دکمه دیدن آیتم‌ها بزن! 🚀');
      }

      function nextRound() {
          resetCard();
          updateSpeech('آیتم‌های بعدی رو ببین! 👀');
      }

      function updateSpeech(text) {
          const speechBubble = document.getElementById('game-speech');
          if (speechBubble) {
              const speechText = speechBubble.querySelector('.speech-text');
              if (speechText) {
                  speechText.textContent = text;
                  speechBubble.style.animation = 'none';
                  speechBubble.offsetHeight;
                  speechBubble.style.animation = 'bubblePop 0.5s ease';
              }
          }
      }

      function backToMenu() {
          playSound('click');
          stopTimer();
          if (gameState.isPlaying && !gameState.gameCompleted) updateGameStats();
          gameState.isPlaying = false;
          updateCoinDisplay();
          showScreen('menu-screen');
      }

      // ============================================
      // Tutorial System
      // ============================================
      function showTutorial(isFirstTime) {
          playSound('click');
          document.getElementById('tutorial-modal').classList.add('show');
          
          const skipBtn = document.getElementById('skip-tutorial-btn');
          if (isFirstTime) {
              skipBtn.style.display = 'none';
          } else {
              skipBtn.style.display = 'flex';
          }
          
          // Clear any existing timeouts
          tutorialTimeouts.forEach(t => clearTimeout(t));
          tutorialTimeouts = [];
          
          if (tutorialAudio) {
              tutorialAudio.pause();
          }
          tutorialAudio = new Audio('./musics/9.mp3');
          tutorialAudio.play().catch(e => console.log('Audio play failed'));
          
          const textEl = document.getElementById('tutorial-text');
          const texts = [
              { time: 0, text: "سلام من پیکسل هستم دوست جدید تو در این بازی" },
              { time: 4000, text: "در این بازی 1 عدد به تو نمایش داده میشه" },
              { time: 7000, text: "باید از آیتم هایی که زیر دستت هست" },
              { time: 9000, text: "اونو انتخاب کنی که تعدادش با اون برابره" },
              { time: 14000, text: "هرمرحله زمان محدودی داره، مرحله اول 2 دقیقه" },
              { time: 18000, text: "و آخرین مرحله 40 ثانیه است" },
              { time: 20000, text: "پس سریع باش ، هربار که درست جواب بدی یه جایزه از من میگیری" },
              { time: 25000, text: "5 مرحله داری که هرکدوم یه دنیای جذاب داره" },
              { time: 30000, text: "موفق باشی دوست من" }
          ];
          
          texts.forEach((item) => {
              const timeout = setTimeout(() => {
                  textEl.style.animation = 'none';
                  textEl.offsetHeight;
                  textEl.style.animation = 'bubblePop 0.3s ease';
                  textEl.textContent = item.text;
              }, item.time);
              tutorialTimeouts.push(timeout);
          });
          
          if (isFirstTime) {
              lokoData.tutorialSeen = true;
              saveLokoData();
              
              tutorialAudio.onended = () => {
                  document.getElementById('tutorial-modal').classList.remove('show');
                  startGameLogic();
              };
          }
      }

      function skipTutorial() {
          playSound('click');
          if (tutorialAudio) tutorialAudio.pause();
          tutorialTimeouts.forEach(t => clearTimeout(t));
          document.getElementById('tutorial-modal').classList.remove('show');
      }

      // ============================================
      // Shop System
      // ============================================
      function renderShop() {
          const grid = document.getElementById('shop-grid');
          grid.innerHTML = '';
          
          THEMES_DATA.forEach(theme => {
              const isOwned = lokoData.ownedThemes.includes(theme.id);
              const isSelected = lokoData.selectedTheme === theme.id;
              const canAfford = lokoData.coins >= theme.price;
              
              const card = document.createElement('div');
              card.className = 'theme-card';
              
              let bgStyle = theme.bg;
              if (theme.bg.includes('url')) {
                  bgStyle = `${theme.bg} center/cover no-repeat`;
              }
              
              card.innerHTML = `
                  <div class="theme-preview" style="background: ${bgStyle};"></div>
                  <div class="theme-name">${theme.name}</div>
                  <div class="theme-price">
                      <img src="./icons/coin.png" style="width:16px; height:16px;" alt="coin">
                      ${theme.price === 0 ? 'رایگان' : theme.price}
                  </div>
              `;
              
              const btn = document.createElement('button');
              btn.className = 'theme-btn';
              
              if (isSelected) {
                  btn.classList.add('selected');
                  btn.textContent = 'انتخاب شده';
                  btn.disabled = true;
              } else if (isOwned) {
                  btn.classList.add('select');
                  btn.textContent = 'انتخاب';
                  btn.onclick = () => selectTheme(theme.id);
              } else if (canAfford) {
                  btn.classList.add('buy');
                  btn.textContent = 'خرید';
                  btn.onclick = () => buyTheme(theme);
              } else {
                  btn.classList.add('locked');
                  btn.textContent = 'سکه کافی نیست';
                  btn.disabled = true;
              }
              
              card.appendChild(btn);
              grid.appendChild(card);
          });
      }

      function buyTheme(theme) {
          if (lokoData.coins >= theme.price) {
              playSound('coin');
              lokoData.coins -= theme.price;
              lokoData.ownedThemes.push(theme.id);
              saveLokoData();
              updateCoinDisplay();
              renderShop();
              showNotification(`🎉 تم "${theme.name}" با موفقیت خریداری شد!`);
          }
      }

      function selectTheme(id) {
          playSound('click');
          lokoData.selectedTheme = id;
          saveLokoData();
          applyTheme(id);
          renderShop();
          showNotification('✨ تم تغییر کرد!');
      }

      function applyTheme(id) {
          const theme = THEMES_DATA.find(t => t.id === id);
          if (theme) {
              const bgEl = document.getElementById('galaxy-bg');
              if (theme.bg.includes('url')) {
                  bgEl.style.background = `${theme.bg} center/cover no-repeat`;
              } else {
                  bgEl.style.background = theme.bg;
              }
              
              const musicEl = document.getElementById('bg-music');
              musicEl.src = theme.music;
              musicEl.play().catch(e => console.log('Autoplay prevented'));
          }
      }

      // ============================================
      // Event Listeners
      // ============================================
      document.addEventListener('DOMContentLoaded', () => {
          loadStats();
          loadLokoData();
          renderShop();
          
          document.addEventListener('click', () => initAudio(), { once: true });
          
          let lastTouchEnd = 0;
          document.addEventListener('touchend', (e) => {
              const now = Date.now();
              if (now - lastTouchEnd <= 300) e.preventDefault();
              lastTouchEnd = now;
          }, false);
          
          document.addEventListener('visibilitychange', () => {
              if (document.hidden && gameState.isPlaying) stopTimer();
          });
      });
    </script>
