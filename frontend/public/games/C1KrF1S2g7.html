<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خرگوش مهربان - LOKO UI</title>
    
    <style>
        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-Regular.ttf") format("truetype");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-Medium.ttf") format("truetype");
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor";
            src: url("./fonts/Shoor-Black.ttf") format("truetype");
            font-weight: 900;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-Regular.ttf") format("truetype");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-Medium.ttf") format("truetype");
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("./fonts/ShoorRounded-Black.ttf") format("truetype");
            font-weight: 900;
            font-display: swap;
        }
    </style>

    <style>
        :root {
            --primary: #6C5CE7;
            --neon-blue: #00D2FF;
            --neon-pink: #FF00A0;
            --neon-green: #00FF9D;
            --accent: #FFEAA7;
            --success: #00B894;
            --danger: #FF7675;
            --dark: #1E1E2F;
            --gold: #FFC93C;
            --gold-dark: #B96F00;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --font: 'Shoor Rounded', 'Shoor', Tahoma, sans-serif;
            --shadow-xl: 0 15px 70px rgba(0, 0, 0, 0.5);
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: var(--font);
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(157, 78, 221, 0.4), transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 212, 255, 0.4), transparent 40%), radial-gradient(circle at 50% 50%, rgba(255, 60, 172, 0.2), transparent 60%), #050510;
            min-height: 100vh;
            overflow: hidden;
            direction: rtl;
            color: #fff;
            position: relative;
            background-size: cover;
            background-attachment: fixed;
        }

        .menu-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .magic-glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: magicMove 12s infinite alternate ease-in-out; }
        .magic-glow.purple { background: var(--primary); width: 400px; height: 400px; top: -100px; right: -100px; }
        .magic-glow.blue { background: var(--neon-blue); width: 350px; height: 350px; bottom: -50px; left: -50px; animation-delay: 2s; }
        .magic-glow.pink { background: var(--gold); width: 250px; height: 250px; top: 40%; left: 20%; animation-delay: 4s; opacity: 0.2; }
        @keyframes magicMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(80px, 50px) scale(1.3); } }

        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; transition: opacity 0.3s ease; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .screen.active { display: flex; opacity: 1; }
        .screen.overlay { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 1000; }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); border: 1px solid var(--glass-border); border-top: 1px solid rgba(255, 255, 255, 0.4); border-left: 1px solid rgba(255, 255, 255, 0.4); border-radius: 24px; box-shadow: var(--shadow-xl), inset 0 1px 1px rgba(255,255,255,0.2); }

        .coin-display { position: absolute; top: 15px; right: 15px; display: flex; align-items: center; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); z-index: 100; }
        .coin-amount { color: var(--gold); font-weight: 800; font-size: 1.2rem; margin-left: 10px; text-shadow: 0 0 10px var(--gold); }
        .coin-icon-img { width: 28px; height: 28px; object-fit: contain; animation: coinMagic 2s ease-in-out infinite; }
        @keyframes coinMagic { 0% { transform: rotateY(0deg) scale(1); filter: drop-shadow(0 0 3px var(--gold)); } 50% { transform: rotateY(180deg) scale(1); filter: drop-shadow(0 0 12px var(--gold)); } 100% { transform: rotateY(360deg) scale(1); filter: drop-shadow(0 0 3px var(--gold)); } }

        .menu-container { padding: 40px 24px 30px; text-align: center; max-width: 420px; width: 100%; position: relative; overflow: hidden; }
        .menu-title-banner { background: linear-gradient(135deg, var(--glass-bg), var(--glass-bg)); border: 1px solid var(--primary); box-shadow: 0 0 20px var(--primary), inset 0 0 20px var(--glass-bg); padding: 15px 20px; border-radius: 20px; margin-bottom: 20px; margin-top: 10px; }
        .game-title { font-size: 2.6rem; font-weight: 900; background: linear-gradient(to bottom right, #fff, var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: titleColorShift 2s ease-in-out infinite; }
        @keyframes titleColorShift { 0% { filter: drop-shadow(0 0 15px var(--neon-blue)) hue-rotate(0deg); } 50% { filter: drop-shadow(0 0 25px var(--gold)) hue-rotate(0deg); } 100% { filter: drop-shadow(0 0 15px var(--neon-blue)) hue-rotate(0deg); } }

        .character-wrapper { position: relative; width: 200px; height: 200px; margin: 20px auto 30px; display: flex; justify-content: center; align-items: center; }
        .character-frame { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%); border: 4px solid var(--gold); box-shadow: 0 0 30px var(--gold), inset 0 0 30px rgba(255, 215, 0, 0.2); display: flex; justify-content: center; align-items: center; overflow: visible; position: relative; animation: framePulse 3s ease-in-out infinite; }
        @keyframes framePulse { 0%, 100% { box-shadow: 0 0 30px var(--gold), inset 0 0 30px rgba(255, 215, 0, 0.2); } 50% { box-shadow: 0 0 50px var(--gold), inset 0 0 40px rgba(255, 215, 0, 0.4); } }
        .gamer-img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); animation: gamerFloat 3s ease-in-out infinite; }
        @keyframes gamerFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.02); } }

        .speech-bubble-inside { position: absolute; top: -15px; right: -40px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--neon-blue); padding: 8px 15px; border-radius: 15px; font-size: 0.9rem; font-weight: 800; color: #fff; white-space: nowrap; box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); animation: bubblePop 2s ease-in-out infinite; z-index: 10; }
        .speech-bubble-inside::after { content: ''; position: absolute; bottom: -10px; left: 15px; border-width: 10px 10px 0; border-style: solid; border-color: var(--neon-blue) transparent transparent transparent; }
        @keyframes bubblePop { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(2deg); } }

        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden; width: 100%; }
        .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent); transition: left 0.6s; }
        .btn:hover::before { left: 100%; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(180deg, #FFE68A 0%, #FFC93C 45%, #FFA800 100%); color: #1a1a2e; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 5px 20px var(--gold-dark), 0 0 20px var(--gold); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .btn-primary:hover { box-shadow: 0 8px 30px var(--gold-dark), 0 0 30px var(--gold); transform: translateY(-2px); }
        .btn-secondary { background: var(--glass-bg); backdrop-filter: blur(15px); color: #fff; border: 1px solid var(--neon-blue); box-shadow: 0 0 20px rgba(0, 210, 255, 0.6), inset 0 0 10px var(--glass-bg); }
        .btn-secondary:hover { background: var(--neon-blue); box-shadow: 0 0 25px var(--neon-blue); transform: translateY(-2px); }
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: #fff; box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: #fff; box-shadow: 0 5px 15px rgba(235, 51, 73, 0.4); }

        .secondary-buttons { display: flex; gap: 15px; width: 100%; margin-top: 15px; }
        .secondary-buttons .btn { flex: 1; font-size: 1rem; padding: 12px; }

        .help-cinematic-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; position: relative; gap: 20px; }
        .gamer-aura-wrapper { width: 260px; height: 260px; position: relative; display: flex; justify-content: center; align-items: center; animation: fadeScaleIn 1s ease; }
        .gamer-aura-wrapper::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: var(--neon-pink); filter: blur(50px); opacity: 0.6; animation: pulseAura 2s infinite ease-in-out; z-index: 0; }
        .help-gamer-img { width: 220px; height: 220px; object-fit: contain; z-index: 1; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); animation: gamerFloat 3s ease-in-out infinite; }
        .help-speech-bubble { background: var(--glass-bg); backdrop-filter: blur(15px); border: 2px solid var(--neon-blue); padding: 25px 35px; border-radius: 25px; max-width: 90%; width: 450px; text-align: center; font-size: 1.1rem; line-height: 2.2; color: var(--text-color); box-shadow: 0 0 20px rgba(0, 210, 255, 0.6), inset 0 0 20px rgba(255,255,255,0.1); min-height: 100px; display: flex; align-items: center; justify-content: center; position: relative; transition: opacity 0.3s ease; font-weight: 800; }
        .help-speech-bubble::after { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); border-width: 0 12px 12px; border-style: solid; border-color: var(--neon-blue) transparent transparent transparent; }
        .skip-help-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 40px; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.3); border-radius: 25px; cursor: pointer; font-family: var(--font); font-weight: 700; font-size: 1.2rem; transition: all 0.3s; }
        .skip-help-btn:hover { background: var(--primary); color: #fff; box-shadow: 0 0 20px var(--primary); }
        @keyframes fadeScaleIn { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulseAura { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.7; } }

        .level-select-container { max-width: 450px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; padding: 30px 20px; }
        .level-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .level-header h2 { flex: 1; text-align: center; font-size: 1.5rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; padding: 5px; }
        .level-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 15px; font-weight: 800; font-size: 1.5rem; cursor: pointer; background: var(--glass-bg); border: 2px solid var(--glass-border); color: #fff; transition: all 0.3s; }
        .level-btn:hover { transform: scale(1.05); border-color: var(--gold); }
        .level-btn.locked { opacity: 0.3; cursor: not-allowed; background: rgba(0,0,0,0.5); border-color: #333; }
        .level-btn.unlocked { background: linear-gradient(135deg, var(--primary), var(--neon-pink)); box-shadow: 0 0 10px var(--primary); border-color: transparent; }
        .level-btn.completed { background: linear-gradient(135deg, var(--success), #38ef7d); box-shadow: 0 0 10px var(--success); border-color: transparent; }

        .game-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 100%; width: 100%; padding: 5px; gap: 5px; overflow: hidden; }
        .game-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 18px; flex-shrink: 0; }
        .level-badge { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 16px; font-weight: 500; }
        .level-badge strong { font-size: 24px; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .timer { display: flex; align-items: center; gap: 8px; color: var(--neon-blue); font-size: 20px; font-weight: 800; font-family: 'Shoor Black', Tahoma, sans-serif; }
        .btn-icon { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-icon:hover { background: var(--danger); transform: rotate(180deg); }

        .game-scene { flex: 1; position: relative; border-radius: 20px; overflow: hidden; min-height: 150px; border: 2px solid var(--glass-border); box-shadow: var(--shadow-xl); background: transparent; }

        .sky-night { position: absolute; top: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%); transition: opacity 0.5s ease; z-index: 0; }
        .sky-night.hidden { opacity: 0; pointer-events: none; }
        .moon { position: absolute; top: 20px; left: 30px; width: 60px; height: 60px; background: linear-gradient(135deg, #f5f5f5, #e0e0e0); border-radius: 50%; box-shadow: 0 0 30px rgba(255,255,255,0.5), inset -10px -10px 20px rgba(0,0,0,0.1); }
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(2px 2px at 50px 50px, #fff, transparent), radial-gradient(2px 2px at 100px 80px, #fff, transparent), radial-gradient(1px 1px at 150px 30px, #fff, transparent), radial-gradient(2px 2px at 200px 100px, #fff, transparent); animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        .sky-day { position: absolute; top: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 50%, #7EC8E3 100%); transition: opacity 0.5s ease; z-index: 0; }
        .sky-day.hidden { opacity: 0; pointer-events: none; }
        .sun { position: absolute; top: 20px; right: 30px; width: 70px; height: 70px; background: linear-gradient(135deg, #FFD700, #FFA500); border-radius: 50%; box-shadow: 0 0 50px rgba(255,215,0,0.8); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(255,215,0,0.8); } 50% { transform: scale(1.05); box-shadow: 0 0 70px rgba(255,215,0,1); } }

        .ground { position: absolute; bottom: 0; left: 0; width: 100%; height: 45%; background: linear-gradient(180deg, #2d5a27 0%, #1e3d1a 100%); border-top: 4px solid #4a7c43; z-index: 0; }
        .ground.hidden { background: transparent !important; border-top: none !important; }

        .game-world { position: absolute; top: 50%; left: 50%; width: 0; height: 0; transform: translate(-50%, -50%) scale(var(--game-scale, 1)); transform-origin: center center; transition: transform 0.3s ease; }

        .start-point { position: absolute; width: 40px; height: 40px; background: rgba(76, 175, 80, 0.3); border: 3px dashed #4CAF50; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1; transform: translate(-50%, -50%); }
        .start-point span { color: white; font-size: 8px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

        .path-container { position: absolute; top: 0; left: 0; width: 0; height: 0; z-index: 2; }
        .path-tile { position: absolute; width: 56px; height: 56px; background: linear-gradient(145deg, #8B5A2B, #5C3310); border: 3px solid #A0522D; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 16px rgba(0,0,0,0.5), inset 0 3px 6px rgba(255,255,255,0.2), inset 0 -3px 6px rgba(0,0,0,0.3); transition: all 0.3s ease; z-index: 2; transform: translate(-50%, -50%); }
        .path-tile::before { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; height: 35%; background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent); border-radius: 10px 10px 50% 50%; }
        .tile-number { font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.9); text-shadow: 0 2px 3px rgba(0,0,0,0.5); margin-bottom: 0px; z-index: 2; }
        .tile-arrow { font-size: 26px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue), 0 2px 4px rgba(0,0,0,0.6); margin-top: -2px; z-index: 2; }
        .path-tile.correct { background: linear-gradient(145deg, #4CAF50, #2E7D32); border-color: #81C784; box-shadow: 0 8px 16px rgba(0,0,0,0.5), inset 0 3px 6px rgba(255,255,255,0.3), 0 0 15px rgba(76, 175, 80, 0.6); }
        .path-tile.wrong { background: linear-gradient(145deg, #f44336, #b71c1c); border-color: #ef5350; box-shadow: 0 8px 16px rgba(0,0,0,0.5), inset 0 3px 6px rgba(255,255,255,0.3), 0 0 15px rgba(244, 67, 54, 0.6); }

        .home {
            position: absolute;
            width: 80px;
            height: 90px;
            z-index: 1;
            transform: translate(-50%, -50%);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        .home-default { background-image: url('./icons/khoone sade.png'); }
        .home-abnabati { background-image: url('./icons/khoone abnabati.png'); }
        .home-yakhi { background-image: url('./icons/khoone yakhi.png'); }
        .home-padeshahi { background-image: url('./icons/khoone padeshahi.png'); }
        .home-qhasr { background-image: url('./icons/khoone qhasr.png'); }

        .rabbit-game { position: absolute; width: 55px; height: 55px; z-index: 10; transition: left 0.4s ease, top 0.4s ease; transform: translate(-50%, -50%); }
        .rabbit-game .rabbit-sprite { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); }
        .rabbit-game.moving .rabbit-sprite { animation: rabbit-hop 0.4s ease; }
        .rabbit-game.moving-fast .rabbit-sprite { animation: rabbit-hop-fast 0.25s ease; }
        .rabbit-game.hit-wall .rabbit-sprite { animation: hit-wall 0.5s ease; }
        .rabbit-game.hit-wall-fast .rabbit-sprite { animation: hit-wall-fast 0.3s ease; }
        @keyframes rabbit-hop { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.1) translateY(-5px); } }
        @keyframes rabbit-hop-fast { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.15) translateY(-8px); } }
        @keyframes hit-wall { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-10deg) scale(0.9); } 75% { transform: rotate(10deg) scale(0.9); } }
        @keyframes hit-wall-fast { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-25deg) scale(0.8); } 75% { transform: rotate(25deg) scale(0.8); } }

        .move-input-area { padding: 10px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 18px; flex-shrink: 0; }
        .move-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; min-height: 40px; }
        .move-slot { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: all 0.3s ease; }
        .move-slot:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        .move-slot.filled { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); }
        .move-slot.correct { background: rgba(76, 175, 80, 0.4); border-color: var(--success); border-style: solid; }
        .move-slot.wrong { background: rgba(244, 67, 54, 0.4); border-color: var(--danger); border-style: solid; }
        .move-slot.drag-over { background: rgba(255, 215, 0, 0.3); border-color: var(--gold); transform: scale(1.1); }

        .move-buttons { display: flex; justify-content: center; gap: 10px; }
        .move-btn { width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary), var(--neon-pink)); border: none; border-radius: 12px; font-size: 24px; cursor: grab; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); display: flex; align-items: center; justify-content: center; }
        .move-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6); }
        .move-btn:active { cursor: grabbing; transform: scale(0.95); }
        .move-btn.dragging { opacity: 0.5; transform: scale(0.9); }

        .action-buttons { display: flex; justify-content: center; gap: 10px; flex-shrink: 0; }
        .action-buttons .btn { flex: 1; max-width: 140px; padding: 10px 15px; font-size: 0.9rem; }

        .celebration-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 450px; padding: 30px; position: relative; overflow: hidden; text-align: center; }
        .rabbit-celebration .rabbit-sprite { width: 150px; height: 150px; object-fit: contain; animation: celebrate 1s ease-in-out infinite; }
        @keyframes celebrate { 0%, 100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.1) rotate(-5deg); } 75% { transform: scale(1.1) rotate(5deg); } }
        .celebration-title { font-size: 48px; color: var(--gold); text-shadow: 0 0 30px var(--gold); margin-bottom: 10px; animation: title-bounce 1s ease-in-out infinite; font-weight: 900; }

        .feedback-subtitle { font-size: 1.3rem; font-family: 'Shoor', Tahoma, sans-serif; opacity: 0.95; text-align: center; line-height: 2; margin-bottom: 15px; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .shop-container { max-width: 500px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; }

        .shop-item { background: rgba(15, 15, 30, 0.8); backdrop-filter: blur(15px); border: 2px solid var(--glass-border); border-radius: 16px; padding: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.3s ease; position: relative; }

<body>
    <audio id="bg-music" loop preload="auto"></audio>
    <audio id="help-audio" src="./musics/7.mp3" preload="auto"></audio>

    <div class="menu-bg">

    <div id="countdown-overlay" class="countdown-overlay">

                    <button id="btn-shop" class="btn btn-secondary">

        function initLevels() {
            GameState.levels = [];
            for(let i=1; i<=50; i++) {
                let path = [];
                if (i === 1) {
                    path = [{direction:'up', count:2}, {direction:'right', count:4}, {direction:'down', count:2}];
                } else if (i === 2) {
                    path = [{direction:'up', count:3}, {direction:'right', count:3}, {direction:'up', count:2}, {direction:'left', count:2}, {direction:'up', count:1}];
                } else {
                    let r = i % 4;
                    if (r === 0) path = [{direction:'up', count:2+i%3}, {direction:'right', count:2+i%2}, {direction:'down', count:2+i%3}];
                    else if (r === 1) path = [{direction:'right', count:3+i%2}, {direction:'up', count:2+i%3}, {direction:'left', count:2+i%2}, {direction:'up', count:1+i%2}];
                    else if (r === 2) path = [{direction:'up', count:2}, {direction:'right', count:4+i%2}, {direction:'up', count:1+i%3}, {direction:'left', count:3+i%2}, {direction:'down', count:2}];
                    else path = [{direction:'left', count:3}, {direction:'up', count:2+i%3}, {direction:'right', count:4+i%2}, {direction:'up', count:1}];
                }
                GameState.levels.push({ name: `مرحله ${i}`, path: path });
            }
        }

        function loadStats() {
            const saved = localStorage.getItem('rabbitGameStatsLOKO_v17');
            if (saved) {
                const parsed = JSON.parse(saved);
                savedStats = { ...savedStats, ...parsed };
                if (parsed.ownedSkins) savedStats.ownedSkins = parsed.ownedSkins;
                if (parsed.activeSkin) savedStats.activeSkin = parsed.activeSkin;
                if (parsed.ownedThemes) savedStats.ownedThemes = parsed.ownedThemes;
                if (parsed.activeTheme) savedStats.activeTheme = parsed.activeTheme;
                if (parsed.ownedHouses) savedStats.ownedHouses = parsed.ownedHouses;
                if (parsed.activeHouse) savedStats.activeHouse = parsed.activeHouse;
                if (parsed.completedLevels) savedStats.completedLevels = parsed.completedLevels;
                if (parsed.highestLevel) savedStats.highestLevel = parsed.highestLevel;
                if (parsed.currentLevel) savedStats.currentLevel = parsed.currentLevel;
                if (parsed.hasSeenHelp !== undefined) savedStats.hasSeenHelp = parsed.hasSeenHelp;
            }
            // سکه‌ها را همیشه صفر نگه دار (برای شروع جدید)
            savedStats.lokoCoins = 0;
            savedStats.initialLokoCoins = 0;
            
            GameState.activeSkin = savedStats.activeSkin || 'default';
            GameState.ownedSkins = savedStats.ownedSkins || ['default'];
            GameState.activeTheme = savedStats.activeTheme || 'simple';
            GameState.ownedThemes = savedStats.ownedThemes || ['simple'];
            GameState.activeHouse = savedStats.activeHouse || 'simple';
            GameState.ownedHouses = savedStats.ownedHouses || ['simple'];
            GameState.currentLevel = savedStats.currentLevel || 1;
            
            updateCoinDisplay();
            updateRabbitSkin();
            applyTheme(GameState.activeTheme, false);
            updateHouse(GameState.activeHouse);
        }

            savedStats.ownedSkins = GameState.ownedSkins;

            savedStats.ownedHouses = GameState.ownedHouses;
            savedStats.activeHouse = GameState.activeHouse;
            savedStats.currentLevel = GameState.currentLevel;
            savedStats.completedLevels = savedStats.completedLevels || [];

            const house = HOUSES_DATA.find(h => h.id === houseId);

            const homeElement = document.getElementById('home');
            homeElement.className = 'home';

            GameState.activeHouse = houseId;
            saveStats();

        function buyHouse(houseId) {
            const house = HOUSES_DATA.find(h => h.id === houseId);
            if (!house) return;
            if (GameState.ownedHouses.includes(houseId)) return;
            if (savedStats.lokoCoins >= house.price) {
                savedStats.lokoCoins -= house.price;
                GameState.ownedHouses.push(houseId);
                updateHouse(houseId);
                saveStats();
                updateCoinDisplay();
                renderHouses();
                showFeedback('purchase', '🎉 خرید موفق! 🎉', `خانه ${house.name} با موفقیت خریداری و فعال شد!`, 'gamer');

            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));

        function renderLevelGrid() {
            const grid = document.getElementById('levels-grid');
            if (!grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= GameState.levels.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                const isUnlocked = i <= savedStats.highestLevel;
                const isCompleted = savedStats.completedLevels.includes(i);
                if (isCompleted) {
                    btn.classList.add('completed');
                    btn.innerHTML = `<span>${i}</span><span style="font-size:0.6rem">⭐</span>`;
                } else if (isUnlocked) {
                    btn.classList.add('unlocked');
                    btn.textContent = i;
                } else {
                    btn.classList.add('locked');
                    btn.textContent = '🔒';
                }
                if (isUnlocked) {
                    btn.onclick = () => {
                        if (!savedStats.hasSeenHelp) {
                            savedStats.hasSeenHelp = true;
                            saveStats();
                            showHelp(true, i);
                        } else {
                            startGame(i);
                        }
                    };
                }
                grid.appendChild(btn);
            }
        }

        function showHelp(startAfter = false, levelNum = null) {
            GameState.startAfterHelp = startAfter;
            GameState.startLevelNum = levelNum;
            showScreen('guide-screen');
            const audio = document.getElementById('help-audio');
            const speechText = document.getElementById('help-speech-text');
            GameState.helpTimeouts.forEach(t => clearTimeout(t));
            GameState.helpTimeouts = [];
            const changeText = (text) => {
                speechText.style.opacity = '0';
                setTimeout(() => { speechText.innerHTML = text; speechText.style.opacity = '1'; }, 300);
            };
            GameState.helpTimeline.forEach((item) => {
                const timeout = setTimeout(() => { changeText(item.text); }, item.time * 1000);
                GameState.helpTimeouts.push(timeout);
            });
            if (audio) {
                audio.currentTime = 0;
                audio.play().then(_ => {
                    audio.onended = () => { 
                        if (GameState.startAfterHelp) {
                            GameState.startAfterHelp = false;
                            startGame(GameState.startLevelNum);
                        } else {
                            showScreen('menu-screen');
                        }
                    };
                }).catch(error => {
                    console.warn("Autoplay blocked:", error);
                    const fallbackTimeout = setTimeout(() => { 
                        if (GameState.startAfterHelp) {
                            GameState.startAfterHelp = false;
                            startGame(GameState.startLevelNum);
                        } else {
                            showScreen('menu-screen');
                        }
                    }, 25000);
                    GameState.helpTimeouts.push(fallbackTimeout);
                });
            }
        }

        function skipHelp() {
            const audio = document.getElementById('help-audio');
            if (audio) { audio.pause(); audio.currentTime = 0; }
            GameState.helpTimeouts.forEach(t => clearTimeout(t));
            GameState.helpTimeouts = [];
            
            if (GameState.startAfterHelp) {
                GameState.startAfterHelp = false;
                startGame(GameState.startLevelNum);
            } else {
                showScreen('menu-screen');
            }
        }

        // ============================================================
        // 14. توابع اصلی بازی
        // ============================================================
        function startGame(level = null) {
            if (level) {
                GameState.currentLevel = level;
            } else {
                GameState.currentLevel = savedStats.currentLevel || savedStats.highestLevel || 1;
            }
            GameState.correctMoves = 0;
            GameState.wrongMoves = 0;
            GameState.timer = 60;
            GameState.moves = [];
            GameState.isPlaying = false;
            savedStats.initialLokoCoins = savedStats.lokoCoins;
            updateRabbitSkin();
            updateHouse(GameState.activeHouse);
            showScreen('game-screen');
            loadLevel(GameState.currentLevel);
            
            startCountdown(() => {
                startTimer();
            });
        }

        function playBeep(freq) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function startCountdown(callback) {
            const overlay = document.getElementById('countdown-overlay');
            const textEl = document.getElementById('countdown-text');
            overlay.style.display = 'flex';
            
            let count = 3;
            textEl.textContent = count;
            playBeep(500);
            
            const interval = setInterval(() => {
                count--;
                textEl.style.animation = 'none';
                textEl.offsetHeight;
                textEl.style.animation = 'countPop 0.8s ease';
                
                if (count > 0) {
                    textEl.textContent = count;
                    playBeep(500);
                } else if (count === 0) {
                    textEl.textContent = "بریم!";
                    playBeep(800);
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    callback();
                }
            }, 800);
        }

        // ============================================================
        // 15. تابع نمایش بازخورد (برد/باخت/وقت کم/خرید)

        function closeFeedback() {
            document.getElementById('feedback-overlay').classList.remove('show');
            document.getElementById('feedback-emoji').style.display = 'block';
            
            if (isTimeUp) {
                isTimeUp = false;
                GameState.timer = 60;
                loadLevel(GameState.currentLevel);
                startCountdown(() => { startTimer(); });
            } else if (feedbackCallback) {
                const cb = feedbackCallback;
                feedbackCallback = null;
                cb();
            }
        }

        function startTimer() {
            stopTimer();
            GameState.timer = 60;
            updateTimerDisplay();
            GameState.timerInterval = setInterval(() => {
                GameState.timer--;
                updateTimerDisplay();
                if (GameState.timer <= 0) {
                    clearInterval(GameState.timerInterval);
                    GameState.timerInterval = null;
                    timeUp();
                }
            }, 1000);
        }

        function stopTimer() {
            if (GameState.timerInterval) {
                clearInterval(GameState.timerInterval);
                GameState.timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const seconds = GameState.timer;
            const display = seconds.toString().padStart(2, '0');
            document.getElementById('game-timer').textContent = display;
        }

        function timeUp() {
            GameState.isPlaying = false;
            isTimeUp = true;
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-clear').disabled = true;
            showFeedback('timeout');
        }

        // ============================================================
        // 16. تابع پاک کردن تایل (برای برداشتن فلش از اسلات)
        // ============================================================
        function clearSlotAndTile(slotIndex) {
            const slots = document.querySelectorAll('.move-slot');
            const slot = slots[slotIndex];
            if (!slot) return;
            
            slot.classList.remove('filled', 'correct', 'wrong');
            slot.textContent = '';
            slot.removeAttribute('data-direction');
            GameState.moves[slotIndex] = null;
            
            const tiles = document.querySelectorAll('.path-tile');
            if (tiles[slotIndex]) {
                tiles[slotIndex].classList.remove('correct', 'wrong');
            }
        }

        function loadLevel(levelNum) {
            const levelIndex = (levelNum - 1) % GameState.levels.length;
            const level = GameState.levels[levelIndex];
            document.getElementById('current-level').textContent = levelNum;
            GameState.moves = [];
            GameState.correctMoves = 0;
            GameState.wrongMoves = 0;
            GameState.isPlaying = false;
            GameState.currentPathIndex = 0;
            GameState.pathPositions = [];

            const container = document.getElementById('path-container');
            container.innerHTML = '';

            let tempX = 0, tempY = 0;
            let minX = 0, maxX = 0, minY = 0, maxY = 0;
            let pathCoords = [];

            level.path.forEach(segment => {
                for (let i = 0; i < segment.count; i++) {
                    if (segment.direction === 'up') tempY -= TILE_STEP_Y;
                    if (segment.direction === 'down') tempY += TILE_STEP_Y;
                    if (segment.direction === 'left') tempX -= TILE_STEP_X;
                    if (segment.direction === 'right') tempX += TILE_STEP_X;
                    minX = Math.min(minX, tempX);
                    maxX = Math.max(maxX, tempX);
                    minY = Math.min(minY, tempY);
                    maxY = Math.max(maxY, tempY);
                    pathCoords.push({ x: tempX, y: tempY, direction: segment.direction });
                }
            });

            const lastCoord = pathCoords.length > 0 ? pathCoords[pathCoords.length - 1] : { x: 0, y: 0, direction: 'right' };
            let homeX = lastCoord.x;
            let homeY = lastCoord.y;
            if (lastCoord.direction === 'up') homeY -= TILE_STEP_Y * 1.27;
            if (lastCoord.direction === 'down') homeY += TILE_STEP_Y * 1.27;
            if (lastCoord.direction === 'left') homeX -= TILE_STEP_X * 1.27;
            if (lastCoord.direction === 'right') homeX += TILE_STEP_X * 1.27;

            minX = Math.min(minX, homeX); maxX = Math.max(maxX, homeX);
            minY = Math.min(minY, homeY); maxY = Math.max(maxY, homeY);

            const offsetX = -(minX + maxX) / 2;
            const offsetY = -(minY + maxY) / 2;

            const rabbit = document.getElementById('rabbit-game');
            const startPoint = document.getElementById('start-point');
            rabbit.style.left = `${offsetX}px`;
            rabbit.style.top = `${offsetY}px`;
            startPoint.style.left = `${offsetX}px`;
            startPoint.style.top = `${offsetY}px`;
            GameState.rabbitPosition = { x: offsetX, y: offsetY };
            GameState.pathPositions.push({ x: offsetX, y: offsetY, direction: 'start' });

            pathCoords.forEach((coord, idx) => {
                const tile = document.createElement('div');
                tile.className = 'path-tile';
                tile.dataset.index = idx;
                tile.dataset.direction = coord.direction;

                const posX = offsetX + coord.x;
                const posY = offsetY + coord.y;
                tile.style.left = `${posX}px`;
                tile.style.top = `${posY}px`;

                const numberSpan = document.createElement('span');
                numberSpan.className = 'tile-number';
                numberSpan.textContent = idx + 1;
                tile.appendChild(numberSpan);

                const arrowSpan = document.createElement('span');
                arrowSpan.className = 'tile-arrow';
                const arrows = { 'up': '↑', 'down': '↓', 'left': '←', 'right': '→' };
                arrowSpan.textContent = arrows[coord.direction];
                tile.appendChild(arrowSpan);

                container.appendChild(tile);
                GameState.pathPositions.push({ x: posX, y: posY, direction: coord.direction });
            });

            const home = document.getElementById('home');
            home.style.left = `${offsetX + homeX}px`;
            home.style.top = `${offsetY + homeY}px`;
            
            const activeHouse = HOUSES_DATA.find(h => h.id === GameState.activeHouse);
            if (activeHouse) {
                home.className = 'home';
                home.classList.add(activeHouse.houseClass);
            }

            const scene = document.getElementById('game-scene');
            const sceneW = scene.clientWidth;
            const sceneH = scene.clientHeight;
            const worldW = (maxX - minX) + 200; 
            const worldH = (maxY - minY) + 200; 
            const scale = Math.min(1, sceneW / worldW, sceneH / worldH);
            document.getElementById('game-world').style.setProperty('--game-scale', scale);

            createMoveSlots(level);

            const ground = document.getElementById('ground');
            const skyNight = document.getElementById('sky-night');
            const skyDay = document.getElementById('sky-day');
            if (GameState.activeTheme === 'simple') {
                ground.classList.remove('hidden');
                skyNight.classList.remove('hidden');
                skyDay.classList.add('hidden');
            } else {
                ground.classList.add('hidden');
                skyNight.classList.add('hidden');
                skyDay.classList.add('hidden');
            }

            rabbit.classList.remove('moving', 'moving-fast', 'hit-wall', 'hit-wall-fast');
            document.querySelectorAll('.move-slot').forEach(slot => slot.style.opacity = '1');
            document.getElementById('btn-run').disabled = false;
            document.getElementById('btn-clear').disabled = false;
        }

        function createMoveSlots(level) {
            const slotsContainer = document.getElementById('move-slots');
            slotsContainer.innerHTML = '';
            const totalMoves = level.path.reduce((sum, p) => sum + p.count, 0);
            for (let i = 0; i < totalMoves; i++) {
                const slot = document.createElement('div');
                slot.className = 'move-slot';
                slot.dataset.index = i;
                slot.addEventListener('click', () => {
                    if (slot.classList.contains('filled') && !GameState.isPlaying) {
                        clearSlotAndTile(i);
                    }
                });
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('dragleave', handleDragLeave);
                slot.addEventListener('drop', handleDrop);
                slotsContainer.appendChild(slot);
            }
        }

        let draggedDirection = null;
        document.querySelectorAll('.move-btn').forEach(btn => {
            btn.addEventListener('dragstart', (e) => {
                draggedDirection = btn.dataset.direction;
                btn.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', draggedDirection);
            });
            btn.addEventListener('dragend', (e) => {
                btn.classList.remove('dragging');
                draggedDirection = null;
            });
            btn.addEventListener('click', () => {
                if (GameState.isPlaying) return;
                const emptySlot = findEmptySlot();
                if (emptySlot !== -1) addMoveToSlot(emptySlot, btn.dataset.direction);
                else showToast('همه جای خالی‌ها پر شده!');
            });
        });

        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const direction = e.dataTransfer.getData('text/plain') || draggedDirection;
            if (direction) {
                const slotIndex = parseInt(e.currentTarget.dataset.index);
                addMoveToSlot(slotIndex, direction);
            }
        }

        function findEmptySlot() {
            const slots = document.querySelectorAll('.move-slot');
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i].classList.contains('filled')) return i;
            }
            return -1;
        }

        function addMoveToSlot(slotIndex, direction) {
            const slots = document.querySelectorAll('.move-slot');
            const slot = slots[slotIndex];
            if (!slot) return;
            
            if (slot.classList.contains('filled')) {
                clearSlotAndTile(slotIndex);
            }
            
            const directionEmoji = { 'up': '⬆️', 'down': '⬇️', 'left': '⬅️', 'right': '➡️' };
            slot.textContent = directionEmoji[direction];
            slot.classList.add('filled');
            slot.classList.remove('correct', 'wrong');
            slot.dataset.direction = direction;
            GameState.moves[slotIndex] = direction;
            
            const tiles = document.querySelectorAll('.path-tile');
            if (tiles[slotIndex]) {
                tiles[slotIndex].classList.remove('correct', 'wrong');
            }
        }

        function runMoves() {
            const levelIndex = (GameState.currentLevel - 1) % GameState.levels.length;
            const level = GameState.levels[levelIndex];
            const expectedPath = [];
            level.path.forEach(segment => {
                for (let i = 0; i < segment.count; i++) expectedPath.push(segment.direction);
            });
            const filledMoves = GameState.moves.filter(m => m !== null && m !== undefined);
            if (filledMoves.length < expectedPath.length) {
                showToast(`هنوز ${expectedPath.length - filledMoves.length} حرکت باقی مانده!`);
                return;
            }
            GameState.isPlaying = true;
            GameState.currentPathIndex = 0;
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-clear').disabled = true;
            executeMove(0, expectedPath);
        }

        async function executeMove(index, expectedPath) {
            if (index >= expectedPath.length) {
                setTimeout(() => {
                    GameState.isPlaying = false;
                    document.getElementById('btn-run').disabled = false;
                    document.getElementById('btn-clear').disabled = false;
                    checkWin();
                }, 500);
                return;
            }
            const move = GameState.moves[index];
            const expected = expectedPath[index];
            const slot = document.querySelectorAll('.move-slot')[index];
            const rabbit = document.getElementById('rabbit-game');
            const isFast = currentSpeed > 1;
            const delay = isFast ? 250 : 400;

            if (move === expected) {
                slot.classList.add('correct');
                GameState.correctMoves++;
                await moveRabbitToTile(index + 1, isFast);
                highlightTile(index, 'correct');
                GameState.currentPathIndex = index + 1;
                setTimeout(() => executeMove(index + 1, expectedPath), delay);
            } else {
                slot.classList.add('wrong');
                GameState.wrongMoves++;
                rabbit.classList.add(isFast ? 'hit-wall-fast' : 'hit-wall');
                setTimeout(() => rabbit.classList.remove('hit-wall', 'hit-wall-fast'), isFast ? 300 : 500);
                
                GameState.isPlaying = false;
                document.getElementById('btn-run').disabled = true;
                document.getElementById('btn-clear').disabled = true;
                feedbackCallback = () => {
                    clearWrongMoves(index + 1);
                    document.getElementById('btn-run').disabled = false;
                    document.getElementById('btn-clear').disabled = false;
                };
                showFeedback('wrong', 'اشتباه زدی! 🤔');
                return;
            }
        }

        async function moveRabbitToTile(tileIndex, isFast) {
            const rabbit = document.getElementById('rabbit-game');
            const position = GameState.pathPositions[tileIndex];
            if (!position) return;
            rabbit.classList.add(isFast ? 'moving-fast' : 'moving');
            return new Promise(resolve => {
                rabbit.style.left = `${position.x}px`;
                rabbit.style.top = `${position.y}px`;
                setTimeout(() => {
                    rabbit.classList.remove('moving', 'moving-fast');
                    resolve();
                }, isFast ? 250 : 400);
            });
        }

        function highlightTile(index, status) {
            const tiles = document.querySelectorAll('.path-tile');
            if (tiles[index]) tiles[index].classList.add(status);
        }

        function clearWrongMoves(fromIndex) {
            const slots = document.querySelectorAll('.move-slot');
            const tiles = document.querySelectorAll('.path-tile');
            for (let i = fromIndex; i < slots.length; i++) {
                slots[i].classList.remove('filled', 'correct', 'wrong');
                slots[i].textContent = '';
                slots[i].removeAttribute('data-direction');
                GameState.moves[i] = null;
                if (tiles[i]) tiles[i].classList.remove('correct', 'wrong');
            }
            const rabbit = document.getElementById('rabbit-game');
            const correctIndex = fromIndex;
            if (correctIndex >= 0 && GameState.pathPositions[correctIndex]) {
                const pos = GameState.pathPositions[correctIndex];
                rabbit.style.left = `${pos.x}px`;
                rabbit.style.top = `${pos.y}px`;
                GameState.currentPathIndex = correctIndex;
            } else {
                rabbit.style.left = `${GameState.pathPositions[0].x}px`;
                rabbit.style.top = `${GameState.pathPositions[0].y}px`;
                GameState.currentPathIndex = 0;
            }
        }

        function checkWin() {
            const levelIndex = (GameState.currentLevel - 1) % GameState.levels.length;
            const level = GameState.levels[levelIndex];
            const expectedPath = [];
            level.path.forEach(segment => {
                for (let i = 0; i < segment.count; i++) expectedPath.push(segment.direction);
            });
            const allCorrect = GameState.moves.every((move, i) => move === expectedPath[i]);
            if (allCorrect) celebrateWin();
        }

        function celebrateWin() {
            stopTimer();
            const rabbit = document.getElementById('rabbit-game');
            const lastPosition = GameState.pathPositions[GameState.pathPositions.length - 1];
            if (lastPosition) {
                rabbit.style.left = `${lastPosition.x}px`;
                rabbit.style.top = `${lastPosition.y}px`;
            }
            
            if (GameState.activeTheme === 'simple') {
                setTimeout(() => {
                    document.getElementById('sky-night').classList.add('hidden');
                    document.getElementById('sky-day').classList.remove('hidden');
                }, 500);
            }

            savedStats.totalCorrect += GameState.correctMoves;
            savedStats.totalWrong += GameState.wrongMoves;
            
            if (!savedStats.completedLevels.includes(GameState.currentLevel)) {
                savedStats.completedLevels.push(GameState.currentLevel);
            }
            if (GameState.currentLevel >= savedStats.highestLevel && GameState.currentLevel < 50) {
                savedStats.highestLevel = GameState.currentLevel + 1;
            }
            savedStats.currentLevel = GameState.currentLevel + 1;
            if (savedStats.currentLevel > 50) savedStats.currentLevel = 50;

            // ======== سیستم پاداش سکه ========
            let reward = 0;
            // اگر سکه‌ها 0 باشد، 10 سکه جایزه بده
            if (savedStats.lokoCoins === 0) {
                reward = 10;
            } else {
                // اگر سکه‌ها بیشتر از 0 باشد، 1 سکه جایزه بده
                reward = 1;
            }
            savedStats.lokoCoins += reward;
            // =================================
            
            saveStats();
            updateCoinDisplay();

            feedbackCallback = () => {
                document.getElementById('celeb-correct').textContent = GameState.correctMoves;
                document.getElementById('celeb-wrong').textContent = GameState.wrongMoves;
                const timeTaken = 60 - GameState.timer;
                document.getElementById('celeb-time').textContent = `${timeTaken} ثانیه`;
                const rewardDisplay = document.getElementById('coin-reward-display');
                if (reward > 0) {
                    document.getElementById('celeb-reward').textContent = `+${reward}`;
                    rewardDisplay.style.display = 'flex';
                } else {
                    rewardDisplay.style.display = 'none';
                }
                createConfetti();
                
                const skin = RABBIT_SKINS.find(s => s.id === GameState.activeSkin);
                if (skin) {
                    const celebrationRabbit = document.querySelector('.rabbit-celebration .rabbit-sprite');
                    if (celebrationRabbit) {
                        celebrationRabbit.src = skin.img;
                    }
                }
                
                showScreen('celebration-screen');
            };
            
            showFeedback('win');
        }

        function createConfetti() {
            const container = document.querySelector('.confetti');
            container.innerHTML = '';
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181', '#AA96DA', '#FCBAD3'];
            const shapes = ['square', 'circle'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = `${Math.random() * 2}s`;
                piece.style.animationDuration = `${2 + Math.random() * 2}s`;
                if (shapes[Math.floor(Math.random() * shapes.length)] === 'circle') piece.style.borderRadius = '50%';
                container.appendChild(piece);
            }
        }

        function nextLevel() {
            if (GameState.currentLevel < 50) {
                GameState.currentLevel++;
            } else {
                GameState.currentLevel = 1;
            }
            GameState.moves = [];
            saveStats();
            showScreen('game-screen');
            loadLevel(GameState.currentLevel);
            startCountdown(() => { startTimer(); });
        }

        function clearMoves() {
            if (GameState.isPlaying) return;
            const slots = document.querySelectorAll('.move-slot');
            const tiles = document.querySelectorAll('.path-tile');
            slots.forEach((slot, index) => {
                slot.classList.remove('filled', 'correct', 'wrong');
                slot.textContent = '';
                slot.removeAttribute('data-direction');
                GameState.moves[index] = null;
                if (tiles[index]) tiles[index].classList.remove('correct', 'wrong');
            });
            GameState.moves = [];
            GameState.currentPathIndex = 0;
            const rabbit = document.getElementById('rabbit-game');
            rabbit.style.left = `${GameState.pathPositions[0].x}px`;
            rabbit.style.top = `${GameState.pathPositions[0].y}px`;
        }

        function pauseGame() {
            if (GameState.currentScreen === 'game-screen') {
                stopTimer();
                showScreen('pause-screen');
            }
        }

        function resumeGame() {
            startTimer();
            showScreen('game-screen');
        }

        function showToast(message) {
            const toast = document.getElementById('hint-toast');
            const text = document.getElementById('hint-text');
            text.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        // ============================================================
        // 17. رویدادهای DOM
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-start').addEventListener('click', showLevelSelect);
            document.getElementById('btn-levels-back').addEventListener('click', () => showScreen('menu-screen'));
            document.getElementById('btn-guide').addEventListener('click', () => showHelp(false));
            document.getElementById('btn-back-guide').addEventListener('click', skipHelp);
            document.getElementById('btn-shop').addEventListener('click', showShop);
            document.getElementById('btn-shop-back').addEventListener('click', () => {
                showScreen('menu-screen');
                updateCoinDisplay();
            });
            document.getElementById('btn-run').addEventListener('click', runMoves);
            document.getElementById('btn-clear').addEventListener('click', clearMoves);
            document.getElementById('btn-pause').addEventListener('click', pauseGame);
            document.getElementById('btn-resume').addEventListener('click', resumeGame);
            document.getElementById('btn-restart').addEventListener('click', () => {
                showScreen('game-screen');
                GameState.timer = 60;
                loadLevel(GameState.currentLevel);
                startCountdown(() => { startTimer(); });
            });
            document.getElementById('btn-quit').addEventListener('click', () => {
                stopTimer();
                showScreen('menu-screen');
                updateCoinDisplay();
            });
            document.getElementById('btn-next-level').addEventListener('click', nextLevel);
            
            initLevels();
            loadStats();
            updateRabbitSkin();
            updateHouse(GameState.activeHouse);
            
            const unlockAudio = () => {
                const bgMusic = document.getElementById('bg-music');
                if (bgMusic && bgMusic.paused && bgMusic.src) {
                    bgMusic.play().catch(e => {});
                }
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('touchstart', unlockAudio);
            };
            document.addEventListener('click', unlockAudio);
            document.addEventListener('touchstart', unlockAudio);

            window.addEventListener('resize', () => {
                if (GameState.currentScreen === 'game-screen') {
                    loadLevel(GameState.currentLevel);
                }
            });
        });

        window.addEventListener('beforeunload', () => {
            if (GameState.currentScreen === 'game-screen') {
                const saveData = { level: GameState.currentLevel, moves: GameState.moves, timer: GameState.timer };
                localStorage.setItem('rabbitGameSave', JSON.stringify(saveData));
            }
        });

        // ============================================================
        // 18. توابع Global برای استفاده در HTML
        // ============================================================
        window.buySkin = buySkin;
        window.selectSkin = selectSkin;
        window.buyTheme = buyTheme;
        window.selectTheme = selectTheme;
        window.buyHouse = buyHouse;
        window.selectHouse = selectHouse;
        window.showShopTab = showShopTab;
        window.showToast = showToast;
        window.closeFeedback = closeFeedback;
    </script>
