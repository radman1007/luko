<script>
    // ============================================
    // LOKO System & LocalStorage
    // ============================================
    function getLS(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) || fallback; }
        catch(e) { return fallback; }
    }
    function setLS(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
    }

    let lokoCoins = parseInt(getLS('loko_coins', 0)) || 0;
    let initialCoins = 0;
    let hasSeenIntro = getLS('loko_played_intro', false);

    const themes = [
        { id: 'default', name: 'فضای تاریک', price: 0, class: 'theme-default', color: 'linear-gradient(135deg, #0c0a14, #181225)' },
        { id: 'forest', name: 'جنگل سحرآمیز', price: 0, class: 'theme-forest', color: 'linear-gradient(135deg, #0f2f1a, #1a4029)' },
        { id: 'ocean', name: 'اقیانوس عمیق', price: 15, class: 'theme-ocean', color: 'linear-gradient(135deg, #0a1a2f, #12253e)' },
        { id: 'candy', name: 'سرزمین کندی', price: 20, class: 'theme-candy', color: 'linear-gradient(135deg, #2f0a1f, #3e1228)' }
    ];
    let ownedThemes = getLS('loko_themes', ['default', 'forest']);
    let activeTheme = getLS('loko_active_theme', 'forest');

    function applyTheme(themeId) {
        const theme = themes.find(t => t.id === themeId);
        if (theme) {
            document.body.className = theme.class;
            activeTheme = themeId;
            setLS('loko_active_theme', themeId);
        }
    }

    function renderShop() {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        themes.forEach(theme => {
            const isOwned = ownedThemes.includes(theme.id);
            const isActive = activeTheme === theme.id;
            const card = document.createElement('div');
            card.className = 'shop-card glass';
            card.innerHTML = `
                <div class="theme-preview" style="background: ${theme.color}"></div>
                <div class="theme-name">${theme.name}</div>
                <button class="btn-buy ${isActive ? 'selected-theme' : ''} ${!isOwned && lokoCoins < theme.price ? 'locked' : ''}" data-id="${theme.id}" data-price="${theme.price}">
                    ${isActive ? '✅ فعال' : isOwned ? 'انتخاب' : `<img src="./icons/coin.png" style="width:20px; height:20px;"> ${toPersianNum(theme.price)}`}
                </button>
            `;
            grid.appendChild(card);
        });

        document.querySelectorAll('.btn-buy').forEach(btn => {
            btn.addEventListener('click', () => {
                playClickSound();
                const id = btn.dataset.id;
                const price = parseInt(btn.dataset.price);
                if (ownedThemes.includes(id)) {
                    applyTheme(id);
                    renderShop();
                } else {
                    if (lokoCoins >= price) {
                        lokoCoins -= price;
                        ownedThemes.push(id);
                        setLS('loko_coins', lokoCoins);
                        setLS('loko_themes', ownedThemes);
                        applyTheme(id);
                        updateCoinUI();
                        renderShop();
                    }
                }
            });
        });
    }

    function updateCoinUI() {
        document.querySelectorAll('.coin-amount').forEach(el => {
            el.textContent = toPersianNum(lokoCoins);
        });
    }

    // ============================================
    // Images & Items
    // ============================================
    const itemImages = {
        "🥕": "./icons/havij.png",
        "🍎": "./icons/sib.png",
        "🎋": "./icons/bambo.png",
        "🍌": "./icons/moz.png",
        "🐟": "./icons/mahi.png",
        "🦴": "./icons/ostokhan.png"
    };

    const charImages = {
        "🐰": "./icons/khargosh.png",
        "🐵": "./icons/meimon.png",
        "🦊": "./icons/robah.png",
        "🐴": "./icons/asb.png",
        "🐘": "./icons/fil.png",
        "🐱": "./icons/gorbeh.png",

    // ============================================
    // Audio & Sounds
    // ============================================
    function toPersianNum(num) {
        const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return num.toString().replace(/\d/g, x => farsiDigits[x]);
    }

    const audioCache = {};
    let currentAudio = null;
    let bgMusic = document.getElementById('bg-music');

    function preloadAudioFiles() {
        const files = [
            "./musics/m1.mp3", "./musics/m2.mp3", "./musics/m3.mp3",
            "./musics/m4.mp3", "./musics/m5.mp3", "./musics/m6.mp3",
            "./musics/m7.mp3", "./musics/m8.mp3", "./musics/m9.mp3",
            "./musics/m10.mp3", "./musics/m11.mp3", "./musics/m12.mp3",
            "./musics/m13.mp3", "./musics/m14.mp3", "./musics/m15.mp3",
            "./musics/m16.mp3", "./musics/m17.mp3", "./musics/Rahnama.mp3"
        ];
        files.forEach(file => {
            const audio = new Audio(file);
            audio.preload = 'auto';
            audio.load();
            audioCache[file] = audio;
        });
    }

    let audioCtx;
    function playClickSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = 600;
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            o.start();
            o.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function playAudio(filePath, startTime, endTime) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.ontimeupdate = null;
        }

        if (!audioCache[filePath]) {
            audioCache[filePath] = new Audio(filePath);
        }
        currentAudio = audioCache[filePath];
        currentAudio.currentTime = 0;

        const startPlayback = () => {
            try {
                if (startTime && startTime > 0) currentAudio.currentTime = startTime;
                else currentAudio.currentTime = 0;
                currentAudio.play().catch(e => {});
            } catch (e) {}
        };

        if (currentAudio.readyState >= 1) startPlayback();
        else {
            currentAudio.addEventListener('loadedmetadata', startPlayback, { once: true });
            currentAudio.load();
        }

        if (endTime) {
            currentAudio.ontimeupdate = function() {
                if (currentAudio.currentTime >= endTime) {
                    currentAudio.pause();
                    currentAudio.ontimeupdate = null;
                }
            };
        }
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.ontimeupdate = null;
        }
    }

    // ============================================
    // Intro Logic
    // ============================================
    let introTimeouts = [];
    function playIntro(onComplete) {
        const overlay = document.getElementById('intro-overlay');
        const textEl = document.getElementById('intro-text');
        overlay.classList.add('active');
        
        stopAudio();
        bgMusic.pause();
        
        const introAudio = new Audio("./musics/Rahnama.mp3");
        currentAudio = introAudio;
        introAudio.play().catch(e => {});
        
        const timings = [
            { time: 0, text: "سلام من پیکسل هستم، راهنمای تو در این بازی" },
            { time: 4000, text: "۱. گوش کن به راوی که داستان می‌گه و راهنماییت می‌کنه." },
            { time: 9000, text: "۲. بِکِش و رها کن آیتم‌ها (مثل هویج یا سیب) رو به شخصیت مورد نظر." },
            { time: 17000, text: "۳ جواب بده به سؤال‌های ریاضی با کلیک روی کارت درست." },
            { time: 23000, text: "۴. بعد از ۵ داستان، امتیاز نهایی رو ببین و جشن بگیر!" },
            { time: 28000, text: "موفق باشی دوست من" }
        ];
        
        introTimeouts.forEach(t => clearTimeout(t));
        introTimeouts = [];
        
        timings.forEach(t => {
            const id = setTimeout(() => {
                textEl.style.opacity = '0';
                setTimeout(() => {
                    textEl.textContent = t.text;
                    textEl.style.opacity = '1';
                }, 400);
            }, t.time);
            introTimeouts.push(id);
        });
        
        const endId = setTimeout(() => {
            overlay.classList.remove('active');
            introAudio.pause();
            if (onComplete) onComplete();
        }, 31000);
        introTimeouts.push(endId);
    }

    function skipIntro() {
        introTimeouts.forEach(t => clearTimeout(t));
        introTimeouts = [];
        document.getElementById('intro-overlay').classList.remove('active');
        stopAudio();
        bgMusic.play().catch(e => {});
    }

    // ============================================
    // Game Logic
    // ============================================
    let gameState = {

        score: 0,
        currentStep: 0,
        draggedElement: null,

                {

                    characters: [
                        { emoji: "🐰", name: "خرگوش", position: "left" },
                        { emoji: "🐵", name: "میمون", position: "right" }
                    ],
                    items: ["🥕", "🥕", "🥕"],
                    action: "drag_items",
                    targetChar: "🐵",
                    itemsToDrag: 2,
                    audio: { file: "./musics/m4.mp3", start: 0, end: 7 },

                },
                {

    function startGame() {
        playClickSound();
        if (!hasSeenIntro) {
            setLS('loko_played_intro', true);
            hasSeenIntro = true;
            playIntro(startActualGame);
        } else {
            startActualGame();
        }
    }

    function startActualGame() {
        initialCoins = lokoCoins;
        bgMusic.volume = 0.15; 
        bgMusic.play().catch(e => {});
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        gameState.currentStory = 0;
        gameState.score = 0;
        loadStory(0);
    }

    function loadStory(storyIndex) {
        gameState.currentStory = storyIndex;
        gameState.currentStep = 0;
        const story = stories[storyIndex];
        
        // Update HUD Progress
        const progressEl = document.getElementById('hud-progress');
        if (progressEl) {
            progressEl.textContent = `داستان ${toPersianNum(storyIndex + 1)} از ${toPersianNum(stories.length)}`;
        }
        
        clearStage();
        loadStep(storyIndex, 0);
    }

    function loadStep(storyIndex, stepIndex) {
        const story = stories[storyIndex];
        const step = story.steps[stepIndex];
        
        if (gameState.stepTimeout) {
            clearTimeout(gameState.stepTimeout);
            gameState.stepTimeout = null;
        }
        
        updateNarrator(step.narrator);
        clearStage();

        if (step.characters) {
            displayCharacters(step.characters);
        }

        if (step.audio) {
            setTimeout(() => {
                playAudio(step.audio.file, step.audio.start, step.audio.end);
            }, 100);
        }

        switch (step.action) {
            case "intro":
                setTimeout(() => {
                    if (step.items && step.items.length > 0) {
                        displayItems(step.items);
                    }
                }, 1000);
                gameState.stepTimeout = setTimeout(() => nextStep(), step.duration || 5000);
                break;

            case "show_items":
                if (step.items && step.items.length > 0) {
                    displayItems(step.items);
                }
                gameState.stepTimeout = setTimeout(() => nextStep(), step.duration || 3000);
                break;

            case "drag_items":
                gameState.requiredDragCount = step.itemsToDrag || step.items.length;
                gameState.itemsDraggedCount = 0;
                displayItems(step.items);
                setupDragAndDrop(step);
                break;

            case "count":
                showAnswerCards(step);
                break;

            case "select_char":
                setupCharacterSelection(step);
                break;

            case "equal_stickers":
                showStickerOptions(step);
                break;

            case "celebrate":
                gameState.stepTimeout = setTimeout(() => {
                    showCelebration();
                    gameState.celebrationTimeout = setTimeout(() => {
                        if (storyIndex < stories.length - 1) {
                            showStoryCloud();
                        } else {
                            endGame();
                        }
                    }, 1500);
                }, step.duration || 2000);
                break;
        }
    }

    function updateNarrator(text) {
        const narratorText = document.getElementById('narrator-text');
        narratorText.style.opacity = '0';
        setTimeout(() => {
            narratorText.textContent = text;
            narratorText.style.opacity = '1';
        }, 200);
    }

    function displayCharacters(characters) {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
        characters.forEach((char, index) => {
            const charElement = document.createElement('div');
            charElement.className = 'character entering';
            charElement.id = `char-${index}`;
            charElement.dataset.emoji = char.emoji;
            charElement.style.animationDelay = `${index * 0.2}s`;
            
            let charVisual = '';
            if (charImages[char.emoji]) {
                charVisual = `<img src="${charImages[char.emoji]}" class="char-img" alt="${char.name}">`;
            } else {
                charVisual = `<div class="char-emoji">${char.emoji}</div>`;
            }
            
            charElement.innerHTML = `${charVisual}<div class="char-name">${char.name}</div>`;
            
            if (char.position === 'left') {
                charElement.style.order = index;
            } else {
                charElement.style.order = 10 + index;
            }
            stage.appendChild(charElement);
            
            setTimeout(() => {
                charElement.classList.remove('entering');
            }, 1000 + index * 200);
        });
    }

    function displayItems(items) {
        const itemsZone = document.getElementById('items-zone');
        itemsZone.innerHTML = '';
        itemsZone.classList.add('visible');
        items.forEach((item, index) => {
            const itemElement = document.createElement('div');
            itemElement.className = 'draggable-item';
            itemElement.dataset.item = item;
            itemElement.style.animationDelay = `${index * 0.1}s`;
            
            if (itemImages[item]) {
                itemElement.innerHTML = `<img src="${itemImages[item]}" alt="${item}">`;
            } else {
                itemElement.textContent = item;
            }
            
            itemsZone.appendChild(itemElement);
        });
    }

    function setupDragAndDrop(step) {
        const targetCharEmoji = step.targetChar;
        const targetCharElement = document.querySelector(`.character[data-emoji="${targetCharEmoji}"]`);

        if (targetCharElement) {
            targetCharElement.classList.add('drop-target');
        }

        const draggableItems = document.querySelectorAll('.draggable-item');
        draggableItems.forEach(item => {
            item.addEventListener('mousedown', startDrag);
            item.addEventListener('touchstart', startDrag, { passive: false });
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);
    }

    function startDrag(e) {
        e.preventDefault();
        const target = e.target.closest('.draggable-item');
        if (!target) return;

        gameState.draggedElement = target;
        target.classList.add('dragging');

        const rect = target.getBoundingClientRect();
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

        gameState.offsetX = clientX - rect.left;
        gameState.offsetY = clientY - rect.top;

        target.style.position = 'fixed';
        target.style.left = `${rect.left}px`;
        target.style.top = `${rect.top}px`;
        target.style.width = `${rect.width}px`;
        target.style.height = `${rect.height}px`;
        target.style.zIndex = '1000';
        target.style.animation = 'none';
    }

    function drag(e) {
        if (!gameState.draggedElement) return;
        e.preventDefault();

        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        gameState.draggedElement.style.left = `${clientX - gameState.offsetX}px`;
        gameState.draggedElement.style.top = `${clientY - gameState.offsetY}px`;

        const target = document.querySelector('.drop-target');
        if (target) {
            const dropRect = target.getBoundingClientRect();
            const isOver = (
                clientX > dropRect.left &&
                clientX < dropRect.right &&
                clientY > dropRect.top &&
                clientY < dropRect.bottom
            );
            if (isOver) {
                target.classList.add('active');
            } else {
                target.classList.remove('active');
            }
        }
    }

    function endDrag(e) {
        if (!gameState.draggedElement) return;

        const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;

        const target = document.querySelector('.drop-target');
        let dropped = false;

        if (target) {
            const dropRect = target.getBoundingClientRect();
            const isOver = (
                clientX > dropRect.left &&
                clientX < dropRect.right &&
                clientY > dropRect.top &&
                clientY < dropRect.bottom
            );

            if (isOver) {
                dropped = true;
                const item = gameState.draggedElement;
                
                const targetCenterX = dropRect.left + dropRect.width / 2;
                const targetCenterY = dropRect.top + dropRect.height / 2;
                
                item.style.transition = 'all 0.3s ease-out';
                item.style.left = `${targetCenterX - (item.offsetWidth / 2)}px`;
                item.style.top = `${targetCenterY - (item.offsetHeight / 2)}px`;
                item.style.transform = 'scale(0.2)';
                item.style.opacity = '0';

                target.classList.add('happy');
                setTimeout(() => target.classList.remove('happy'), 800);

                setTimeout(() => {
                    item.remove();
                }, 300);

                gameState.itemsDraggedCount++;
                target.classList.remove('active');

                if (gameState.itemsDraggedCount >= gameState.requiredDragCount) {
                    setTimeout(() => {
                        removeDragListeners();
                        nextStep();
                    }, 800);
                }
            }
        }

        if (!dropped) {
            const item = gameState.draggedElement;
            item.classList.remove('dragging');
            item.style.position = '';
            item.style.left = '';
            item.style.top = '';
            item.style.width = '';
            item.style.height = '';
            item.style.zIndex = '';
            item.style.transition = 'transform 0.2s ease';
            item.style.transform = '';
            item.style.animation = '';
            setTimeout(() => { item.style.transition = ''; }, 200);
        }

        if (target) target.classList.remove('active');
        gameState.draggedElement = null;
    }

    function removeDragListeners() {
        document.removeEventListener('mousemove', drag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', drag);
        document.removeEventListener('touchend', endDrag);
    }

    function showAnswerCards(step) {
        const cardsContainer = document.getElementById('answer-cards');
        cardsContainer.innerHTML = '';
        cardsContainer.classList.add('visible');

        step.answerOptions.forEach((option, index) => {
            const card = document.createElement('div');
            card.className = 'answer-card';
            card.textContent = toPersianNum(option);
            card.dataset.answer = option;
            card.style.animationDelay = `${index * 0.2}s`;
            card.addEventListener('click', () => handleCardAnswer(card, step));
            cardsContainer.appendChild(card);
        });
    }

    function handleCardAnswer(card, step) {
        playClickSound();
        let selectedAnswer = card.dataset.answer;
        let correctAnswer = step.correctAnswer;

        if (typeof correctAnswer === 'number') {
            selectedAnswer = Number(selectedAnswer);
        }

        const isCorrect = selectedAnswer === correctAnswer;
        const allCards = document.querySelectorAll('.answer-card');
        allCards.forEach(c => c.style.pointerEvents = 'none');

        const sticker = document.getElementById('sticker-feedback');

        if (isCorrect) {
            card.classList.add('correct');
            gameState.score += 10;
            makeCharactersHappy();
            playAudio("./musics/m6.mp3", 0, 3);
            sticker.textContent = "🎉";
        } else {
            card.classList.add('wrong');
            makeCharactersSad();
            playAudio("./musics/m7.mp3", 0, 4);
            sticker.textContent = "😳";
        }
        sticker.classList.add('show');
        
        gameState.answerTimeout = setTimeout(() => {
            sticker.classList.remove('show');
            hideAnswerCards();
            nextStep();
        }, 2500);
    }

    function setupCharacterSelection(step) {
        const characters = document.querySelectorAll('.character');
        characters.forEach(charEl => {
            charEl.classList.add('selectable');
            charEl.addEventListener('click', function handleSelect() {
                playClickSound();
                let selected = charEl.dataset.emoji;
                let correct = step.correctAnswer;
                
                characters.forEach(c => c.style.pointerEvents = 'none'); 
                
                const sticker = document.getElementById('sticker-feedback');
                if (selected === correct) {
                    gameState.score += 10;
                    charEl.classList.add('happy');
                    playAudio("./musics/m6.mp3", 0, 3);
                    sticker.textContent = "🎉";
                } else {
                    charEl.classList.add('sad');
                    playAudio("./musics/m7.mp3", 0, 4);
                    sticker.textContent = "😳";
                }
                sticker.classList.add('show');
                
                gameState.answerTimeout = setTimeout(() => {
                    sticker.classList.remove('show');
                    characters.forEach(c => c.classList.remove('selectable'));
                    nextStep();
                }, 2500);
            });
        });
    }

    function showStickerOptions(step) {
        const cardsContainer = document.getElementById('answer-cards');
        cardsContainer.innerHTML = '';
        cardsContainer.classList.add('visible');

        step.answerOptions.forEach((option, index) => {
            const card = document.createElement('div');
            card.className = 'sticker-option';
            card.textContent = option;
            card.dataset.answer = option;
            card.style.animationDelay = `${index * 0.2}s`;
            card.addEventListener('click', () => handleStickerAnswer(card, step));
            cardsContainer.appendChild(card);
        });

    function handleStickerAnswer(card, step) {
        playClickSound();
        let selectedAnswer = card.dataset.answer;
        const isCorrect = selectedAnswer === step.correctAnswer;
        const allCards = document.querySelectorAll('.sticker-option');
        allCards.forEach(c => c.style.pointerEvents = 'none');

            card.style.borderColor = 'var(--neon-green)';
            gameState.score += 10;

            playAudio("./musics/m6.mp3", 0, 3);

    function nextStep() {
        const story = stories[gameState.currentStory];
        if (gameState.currentStep < story.steps.length - 1) {
            gameState.currentStep++;
            loadStep(gameState.currentStory, gameState.currentStep);
        } else {
            if (gameState.currentStory < stories.length - 1) {
                showStoryCloud();
            } else {
                endGame();
            }
        }
    }

        const cloud = document.getElementById('story-cloud');
        if (!cloud) return;
        cloud.classList.add('visible');
        setTimeout(() => {
            cloud.classList.remove('visible');
            gameState.currentStory++;
            loadStory(gameState.currentStory);
        }, 2500);
    }

    function clearStage() {
        stopAudio();
        removeDragListeners();
        
        if (gameState.stepTimeout) clearTimeout(gameState.stepTimeout);
        if (gameState.answerTimeout) clearTimeout(gameState.answerTimeout);
        if (gameState.celebrationTimeout) clearTimeout(gameState.celebrationTimeout);

        const stage = document.getElementById('game-stage');
        const itemsZone = document.getElementById('items-zone');
        const cardsContainer = document.getElementById('answer-cards');

        stage.innerHTML = '';
        itemsZone.innerHTML = '';
        itemsZone.classList.remove('visible');
        cardsContainer.innerHTML = '';
        cardsContainer.classList.remove('visible');
    }

    function createConfetti() {
        const container = document.getElementById('confetti');
        container.innerHTML = '';
        const colors = ['#6C5CE7', '#00D2FF', '#FF00A0', '#00FF9D', '#FFEAA7', '#FFC93C'];

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = `${Math.random() * 100}%`;
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = `${Math.random() * 2}s`;
            confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            container.appendChild(confetti);
        }
    }

        gameState.currentStep = 0;

    }

        document.getElementById('menu-restart-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('pause-overlay').classList.remove('active');
            startActualGame();
        });

        // 暂停菜单的返回主页按钮
        document.getElementById('menu-home-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('pause-overlay').classList.remove('active');
            backToMenu();
        });
        
        document.getElementById('shop-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('shop-screen').classList.add('active');
            renderShop();
        });
        document.getElementById('shop-back-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('shop-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        });

        document.getElementById('help-btn').addEventListener('click', () => {
            playClickSound();
            playIntro();
        });

        document.getElementById('skip-intro-btn').addEventListener('click', () => {
            playClickSound();
            skipIntro();
            if (hasSeenIntro && !document.getElementById('game-screen').classList.contains('active') && !document.getElementById('start-screen').classList.contains('active')) {
                startActualGame();
            }
        });

        preloadAudioFiles();

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    });
</script>





<!-- لوکو: تله‌متری و خبرِ پایانِ بازی (به‌صورتِ خودکار افزوده شد) -->
<script>
/* لوکو: بازی خودش پایان را می‌گوید — نقطه‌اش در backend/apps/games/finish_points.py */
window.LUKO_EXPLICIT_FINISH = true;
window.lukoWin = function (reason) {
  if (window.__lukoWon) return;
  window.__lukoWon = true;
  // این بازی‌ها امتیازِ خودشان را گزارش نمی‌کنند؛ بی‌این، سرور هر بُرد را «۰ ستاره»
  // ثبت می‌کرد و مدالِ ستاره‌چین برای هیچ بچه‌ای باز نمی‌شد. بُرد = ستاره‌ی کامل
  // (سرور به سقفِ همان مرحله می‌بُرد).
  var extra = { source: 'game', reason: String(reason || 'win'), stars: 3 };
  // جشنِ خودِ بازی اول دیده شود، بعد صفحه‌ی جایزه‌ی اپ رویش بیاید
  setTimeout(function () {
    try {
      if (window.LUKO && typeof window.LUKO.finish === 'function') { window.LUKO.finish(extra); return; }
    } catch (e) { /* SDK نبود یا شکست؛ پیامِ مستقیم */ }
    try {
      window.parent.postMessage({ type: 'luko-game-complete',
        game: location.pathname.split('/').pop(), summary: extra }, '*');
    } catch (e) { /* بازی نباید به‌خاطرِ پایان بشکند */ }
  }, 1500);
};
window.lukoCount = function (count, need) {
  if (Number(count) >= need) window.lukoWin('count ' + count + '/' + need);
};
window.lukoLevels = function (done, total, need) {
  var count = 0;
  try {
    if (Array.isArray(done)) {
      done.forEach(function (v) { if (v) count += 1; });
    } else if (done) {
      Object.keys(done).forEach(function (k) {
        var n = Number(k);
        if (done[k] && n >= 1 && n <= total) count += 1;
      });
    }
  } catch (e) { return; }
  if (count >= Math.min(total, need)) window.lukoWin('levels ' + count + '/' + total);
};
</script>
