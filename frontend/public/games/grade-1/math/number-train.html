<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e3a5c">
<title>قطار اعداد — سفر ایستگاه‌ها</title>
<style>
/* ================= پایه ================= */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: Vazirmatn, Vazir, system-ui, Tahoma, sans-serif;
  color: var(--ink);
  background: #0e3a5c;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
[hidden] { display: none !important; }

:root {
  --ink: #10263a;
  --ink-2: #4d6076;
  --panel: rgba(255,255,255,.94);
  --line: rgba(16,38,58,.12);
  --brand: #1f7ae0;
  --brand-deep: #12558f;
  --good: #17a06a;
  --warn: #e08b2f;
  --gold: #ffc531;
  --shadow: 0 10px 30px rgba(6,29,48,.18);
  --rail: #6b5344;
  --fit: 1;
}

/* ================= چیدمان ================= */
.app { position: relative; height: 100dvh; width: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* ================= آسمان و منظره ================= */
.sky { position: absolute; inset: 0; transition: background 1.2s ease; background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 62%, var(--sky-3) 100%); }
body[data-mood="dawn"]  { --sky-1:#2b4f7e; --sky-2:#f3a06a; --sky-3:#ffd9a8; --ground-1:#7bb26a; --ground-2:#4f8d55; --hill:#3c6b78; --hill-2:#2c5566; }
body[data-mood="day"]   { --sky-1:#4ea8ea; --sky-2:#9fd6f7; --sky-3:#dff1fb; --ground-1:#82c46a; --ground-2:#4f9d55; --hill:#4d8fa5; --hill-2:#37738c; }
body[data-mood="sunset"]{ --sky-1:#5b3f86; --sky-2:#e97a5b; --sky-3:#ffc98a; --ground-1:#6f9c62; --ground-2:#43714a; --hill:#6a4f7a; --hill-2:#4d3a5e; }
body[data-mood="night"] { --sky-1:#0c1f3d; --sky-2:#1d3a63; --sky-3:#31567f; --ground-1:#2f5a49; --ground-2:#1e3f36; --hill:#22395c; --hill-2:#182a45; }

.stars-sky { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
body[data-mood="night"] .stars-sky { opacity: 1; }
.star-dot { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:.25;transform:scale(.7)} 50%{opacity:1;transform:scale(1)} }

.orb { position: absolute; top: 8%; left: 12%; width: 74px; height: 74px; border-radius: 50%; transition: background .9s ease, box-shadow .9s ease; }
body[data-mood="night"] .orb { background: #f2f6ff; box-shadow: 0 0 40px 12px rgba(226,236,255,.45); }
body:not([data-mood="night"]) .orb { background: #ffe27a; box-shadow: 0 0 46px 16px rgba(255,226,122,.5); }

.parallax { position: absolute; left: 0; bottom: 0; width: 300%; height: 100%; pointer-events: none; }
.layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
.layer svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
.hills   { bottom: 30%; height: 40%; }
.trees   { bottom: 24%; height: 28%; }
.ground  { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, var(--ground-1), var(--ground-2)); transition: background 1.2s ease; }

.travel .hills  { animation: slideL 5s linear infinite; }
.travel .trees  { animation: slideL 2.6s linear infinite; }
.travel .rail-strip { animation: slideL 1.1s linear infinite; }
@keyframes slideL { from { transform: translateX(0); } to { transform: translateX(33.333%); } }

/* ================= ریل و قطار ================= */
.scene { position: relative; flex: 1; min-height: 0; }
.track-area { position: absolute; left: 0; right: 0; bottom: 0; top: 0; display: flex; align-items: flex-end; justify-content: center; }
.rail { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; overflow: hidden; }
.rail-strip { position: absolute; inset: 0; width: 300%; background:
  repeating-linear-gradient(90deg, var(--rail) 0 14px, transparent 14px 44px); background-size: auto 12px; background-position: 0 8px; background-repeat: repeat-x; opacity: .85; }
.rail-line { position: absolute; left: 0; right: 0; top: 2px; height: 6px; background: linear-gradient(180deg,#c9d3da,#8a99a6); border-radius: 4px; }
.rail-line.two { top: 18px; height: 4px; opacity: .8; }

.train { position: relative; display: flex; align-items: flex-end; gap: 6px; direction: rtl; transform-origin: bottom center; transform: scale(var(--fit)); transition: transform .35s ease; padding-bottom: 20px; }
.train.depart { animation: departLeft 1.15s cubic-bezier(.55,.1,.6,1) forwards; }
.train.arrive { animation: arriveIn 1s cubic-bezier(.2,.7,.3,1) both; }
@keyframes departLeft { to { transform: scale(var(--fit)) translateX(-140vw); opacity: .2; } }
@keyframes arriveIn { from { transform: scale(var(--fit)) translateX(120vw); } to { transform: scale(var(--fit)) translateX(0); } }

/* لوکوموتیو */
/* لوکوموتیو رو به چپ است چون قطار در جهتِ خواندنِ فارسی (راست به چپ) می‌رود */
.loco { position: relative; width: 116px; flex: none; }
.loco svg { display: block; width: 100%; height: auto; transform: scaleX(-1); filter: drop-shadow(0 6px 10px rgba(6,29,48,.28)); }
.smoke { position: absolute; top: -4px; right: 18px; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.85); opacity: 0; }
.puffing .smoke { animation: puff 1.6s ease-out infinite; }
.puffing .smoke:nth-child(2) { animation-delay: .5s; }
.puffing .smoke:nth-child(3) { animation-delay: 1s; }
@keyframes puff { 0% { opacity:.9; transform: translate(0,0) scale(.4); } 100% { opacity: 0; transform: translate(46px,-56px) scale(1.7); } }
.wheel-spin { transform-box: fill-box; transform-origin: center; }
.puffing .wheel-spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }

/* واگن‌ها */
.slot { position: relative; flex: none; width: 80px; }
.wagon { position: relative; width: 100%; border: none; padding: 0; display: block; transition: transform .18s ease, filter .18s ease; }
.wagon svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(6,29,48,.22)); }
.plate-num { font-weight: 800; font-size: 30px; fill: #10263a; font-family: inherit; }
.wagon.pick { transform: translateY(-14px) scale(1.04); }
.wagon.pick svg { filter: drop-shadow(0 10px 14px rgba(6,29,48,.35)); }
.wagon.locked { cursor: default; }
.wagon.shake { animation: shake .42s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px) rotate(-2deg)} 75%{transform:translateX(7px) rotate(2deg)} }
.wagon.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.14)} 100%{transform:scale(1)} }

.tick { position: absolute; top: -6px; inset-inline-start: -4px; width: 24px; height: 24px; border-radius: 50%; background: var(--good); display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.25); animation: pop .4s ease; }
.tick svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* جای خالی */
.gap { width: 80px; flex: none; height: 76px; align-self: center; margin-bottom: 24px; border-radius: 14px; border: 3px dashed rgba(255,255,255,.9);
  background: rgba(255,255,255,.18); display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
.gap.active { border-color: var(--gold); background: rgba(255,197,49,.28); animation: gapPulse 1.4s ease-in-out infinite; }
@keyframes gapPulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(255,197,49,.5) } 50%{ box-shadow: 0 0 0 12px rgba(255,197,49,0) } }

/* ================= HUD ================= */
.hud { position: relative; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.route { flex: 1; display: flex; align-items: center; gap: 4px; }
.stop { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.32); position: relative; }
.stop.done { background: var(--gold); }
.stop.now { background: #fff; }
.stop.now::after { content: ''; position: absolute; inset-inline-end: -2px; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.35); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 99px; background: rgba(255,255,255,.92); color: var(--ink); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
.chip svg { width: 17px; height: 17px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; color: var(--ink); box-shadow: var(--shadow); }
.icon-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.off { color: #9fb0bd; }

/* ================= ماموریت و سینی ================= */
.mission { position: relative; z-index: 5; margin: 0 12px 10px; padding: 10px 14px; border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; }
.mission p { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.7; }
.mission small { display: block; font-weight: 500; color: var(--ink-2); font-size: 12px; margin-top: 2px; line-height: 1.6; }
.mission .texts { flex: 1; min-width: 0; }
.hint-btn { flex: none; height: 34px; padding: 0 13px; border-radius: 99px; background: #fff6e0; color: #9a6410; font-size: 13px; font-weight: 700; border: 1px solid #f3d79a; display: inline-flex; align-items: center; gap: 5px; }
.hint-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.tray { position: relative; z-index: 5; display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; padding: 0 12px 10px; }
.card { min-width: 62px; height: 62px; padding: 0 10px; border-radius: 16px; background: #fff; color: var(--ink); font-size: 27px; font-weight: 800;
  box-shadow: 0 6px 0 #cfd9e2, var(--shadow); display: inline-flex; align-items: center; justify-content: center; transition: transform .12s ease, box-shadow .12s ease; }
.card:active { transform: translateY(4px); box-shadow: 0 2px 0 #cfd9e2, var(--shadow); }
.card.used { opacity: .35; pointer-events: none; }
.card.wrong { animation: shake .42s ease; background: #ffe9e6; }

/* ================= صفحه‌ی شروع و پایان ================= */
.center-screen { justify-content: center; align-items: center; padding: 20px; text-align: center; z-index: 30; }
.center-card { position: relative; z-index: 2; width: min(440px, 100%); max-height: 92dvh; overflow: auto; background: var(--panel); border-radius: 26px; padding: 20px; box-shadow: var(--shadow); }
.title { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
.lead { margin: 0 0 14px; font-size: 14px; line-height: 1.9; color: var(--ink-2); }
.btn { width: 100%; height: 54px; border-radius: 16px; font-size: 17px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: linear-gradient(180deg, #2b8cf0, var(--brand-deep)); color: #fff; box-shadow: 0 6px 0 #0d456f; }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 3px 0 #0d456f; }
.btn-ghost { background: #eef3f8; color: var(--ink); margin-top: 10px; height: 46px; font-size: 15px; }
.hero { width: min(260px, 70%); margin: 0 auto 10px; }
.hero svg { width: 100%; height: auto; transform: scaleX(-1); }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 4px; }
.metric { background: #f2f6fa; border-radius: 14px; padding: 10px 4px; }
.metric b { display: block; font-size: 18px; font-weight: 800; }
.metric span { font-size: 11px; color: var(--ink-2); }

.stars-row { display: flex; justify-content: center; gap: 8px; margin: 0 0 6px; }
.star-big { width: 44px; height: 44px; display: block; }
.star-big svg { width: 100%; height: 100%; }
.star-big.on svg { fill: var(--gold); stroke: #d99b00; animation: pop .5s cubic-bezier(.2,1.5,.4,1) both; }
.star-big.off svg { fill: #dfe6ed; stroke: #c7d1da; }
.star-big:nth-child(2).on svg { animation-delay: .16s; }
.star-big:nth-child(3).on svg { animation-delay: .32s; }

/* بازخورد و جلوه‌ها */
.toast { position: absolute; z-index: 40; top: 60px; left: 50%; transform: translate(-50%,-16px); background: rgba(16,38,58,.92); color: #fff;
  padding: 9px 18px; border-radius: 99px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: rgba(23,160,106,.95); }
.toast.warn { background: rgba(224,139,47,.96); }

.spark { position: fixed; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; z-index: 45; animation: sparkFly .7s ease-out forwards; }
@keyframes sparkFly { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

.confetti { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; z-index: 35; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(106dvh) rotate(640deg); opacity: .9; } }

.sign { position: absolute; z-index: 6; top: 8px; left: 50%; transform: translate(-50%, -18px); background: #fff; color: var(--ink); border-radius: 16px;
  padding: 9px 20px; font-weight: 800; font-size: 16px; box-shadow: var(--shadow); opacity: 0; transition: opacity .4s ease, transform .4s ease; pointer-events: none; text-align: center; }
.sign.show { opacity: 1; transform: translate(-50%, 0); }
.sign small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }

/* پنل دیباگ داده‌ها (?debug=1) */
.debug { position: absolute; z-index: 60; inset-inline-end: 8px; top: 52px; width: min(300px, 82vw); max-height: 30dvh; overflow: auto;
  background: rgba(10,24,38,.9); color: #cfe6ff; font-size: 10px; line-height: 1.55; padding: 8px 10px; border-radius: 12px; direction: ltr; text-align: left; }
.debug b { color: #ffd166; }
.debug button { background: #1f7ae0; color: #fff; border-radius: 8px; padding: 4px 10px; font-size: 11px; margin-top: 6px; }

@media (max-width: 380px) {
  .loco { width: 108px; }
  .slot, .gap { width: 68px; }
  .card { min-width: 54px; height: 54px; font-size: 23px; }
}
@media (max-height: 620px) {
  .track-area { height: 40%; bottom: 12%; }
  .hero { width: 180px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .05s !important; }
}
body[data-motion="off"] *, body[data-motion="off"] *::before, body[data-motion="off"] *::after { animation: none !important; }
</style>
</head>
<body data-mood="dawn" data-motion="on">
<div class="app" id="app">

  <!-- ===== منظره‌ی مشترکِ همه‌ی صفحه‌ها ===== -->
  <div class="sky" id="sky"></div>
  <div class="stars-sky" id="stars-sky" aria-hidden="true"></div>
  <div class="orb" aria-hidden="true"></div>
  <div class="parallax" aria-hidden="true">
    <div class="layer hills">
      <svg viewBox="0 0 1200 200" preserveAspectRatio="none">
        <path d="M0 200 L0 120 Q90 40 190 110 Q270 165 350 95 Q430 25 520 105 Q600 175 690 100 Q780 30 870 110 Q950 175 1040 105 Q1120 45 1200 120 L1200 200 Z" fill="var(--hill)"/>
        <path d="M0 200 L0 160 Q120 105 230 155 Q340 200 450 150 Q560 100 670 155 Q780 205 890 150 Q1000 100 1200 160 L1200 200 Z" fill="var(--hill-2)"/>
      </svg>
    </div>
    <div class="layer trees">
      <svg viewBox="0 0 1200 160" preserveAspectRatio="none" id="tree-layer"></svg>
    </div>
  </div>
  <div class="ground" aria-hidden="true"></div>

  <!-- ===== صفحه‌ی شروع ===== -->
  <section class="screen center-screen active" id="screen-start">
    <div class="center-card">
      <div class="hero" id="hero-train"></div>
      <h1 class="title">قطار اعداد</h1>
      <p class="lead">قطار باید از <b>شش ایستگاه</b> رد بشه و به شهر لوکو برسه.<br>تو مهندسِ اعدادی — واگن‌ها رو درست کن تا قطار راه بیفته!</p>
      <div class="metrics" id="start-metrics"></div>
      <button class="btn btn-primary" id="btn-start" type="button">شروع سفر</button>
      <button class="btn btn-ghost" id="btn-how" type="button">چطور بازی کنم؟</button>
    </div>
  </section>

  <!-- ===== صفحه‌ی بازی ===== -->
  <section class="screen" id="screen-play">
    <div class="hud">
      <div class="route" id="route"></div>
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="#ffc531" stroke="#d99b00" stroke-width="1.4"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
        <b id="stars-count">۰</b>
      </span>
      <button class="icon-btn" id="btn-sound" type="button" aria-label="صدا">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9c1.2 1.2 1.2 4.8 0 6"/></svg>
      </button>
      <button class="icon-btn" id="btn-motion" type="button" aria-label="حرکت">
        <svg viewBox="0 0 24 24"><path d="M5 12h4l2-5 2 10 2-5h4"/></svg>
      </button>
    </div>

    <div class="scene">
      <div class="sign" id="station-sign"></div>
      <div class="track-area" id="track-area">
        <div class="train puffing" id="train"></div>
        <div class="rail">
          <div class="rail-strip"></div>
          <div class="rail-line"></div>
          <div class="rail-line two"></div>
        </div>
      </div>
    </div>

    <div class="tray" id="tray"></div>
    <div class="mission">
      <div class="texts">
        <p id="mission-text">آماده‌ای؟</p>
        <small id="mission-sub"></small>
      </div>
      <button class="hint-btn" id="btn-hint" type="button">
        <svg viewBox="0 0 24 24"><path d="M9.5 17h5M10 20h4"/><path d="M12 3a6 6 0 0 1 3.6 10.8c-.6.5-.9 1.1-1 1.7h-5.2c-.1-.6-.4-1.2-1-1.7A6 6 0 0 1 12 3z"/></svg>
        کمکم کن
      </button>
    </div>
  </section>

  <!-- ===== صفحه‌ی پایان ===== -->
  <section class="screen center-screen" id="screen-end">
    <div class="center-card">
      <div class="stars-row" id="end-stars"></div>
      <h1 class="title" id="end-title">رسیدیم به شهر لوکو!</h1>
      <p class="lead" id="end-message"></p>
      <div class="metrics" id="end-metrics"></div>
      <button class="btn btn-primary" id="btn-again" type="button">یک سفر دیگه</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/* =====================================================================
   قطار اعداد — بازی ریاضیِ پایه‌ی اول (نسخه‌ی ۲)
   شش ایستگاه، پنج نوع تمرین، سختیِ تطبیقی و لایه‌ی کاملِ تله‌متری
   برای تحلیلِ سمت سرور. بدون منبعِ بیرونی و بدون emoji.
   ===================================================================== */

const GAME = { slug: 'number-train', title: 'قطار اعداد', version: '2.0.0', subject: 'math', grade: 1 };
const STORE_KEY = 'luko_game_' + GAME.slug;
const $ = (sel) => document.querySelector(sel);
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fa = (n) => String(n).replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
const clock = (ms) => fa(String(Math.floor(ms / 60000)).padStart(2, '0')) + ':' + fa(String(Math.floor(ms / 1000) % 60).padStart(2, '0'));

/* ================= تله‌متری =================
   هر رویداد هم با postMessage به اپ می‌رود و هم در حافظه می‌ماند.
   نگاشتِ پیشنهادی سمت سرور: POST /api/v1/games/number-train/events { summary, events } */
const Telemetry = {
  sessionId: '',
  startedAt: Date.now(),
  events: [],
  MAX: 600,
  newSession() { this.sessionId = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); },
  device() {
    return { w: innerWidth, h: innerHeight, dpr: Math.round(devicePixelRatio * 100) / 100, touch: matchMedia('(pointer:coarse)').matches };
  },
  send(msg) {
    try { parent.postMessage(msg, location.origin); } catch (_) { /* بیرون از iframe */ }
  },
  log(type, payload) {
    const event = Object.assign({ t: Date.now() - this.startedAt, type }, payload || {});
    this.events.push(event);
    if (this.events.length > this.MAX) this.events.shift();
    this.send({ type: 'luko-game-event', game: GAME.slug, sessionId: this.sessionId, event: event });
    if (Debug.on) Debug.render();
    return event;
  },
  summary(extra) {
    const answers = this.events.filter((e) => e.type === 'answer');
    const correct = answers.filter((e) => e.correct).length;
    const times = answers.map((e) => e.ms).filter((n) => typeof n === 'number');
    const sorted = [...times].sort((a, b) => a - b);
    return Object.assign({
      game: GAME.slug, version: GAME.version, subject: GAME.subject, grade: GAME.grade,
      sessionId: this.sessionId, startedAt: this.startedAt, durationMs: Date.now() - this.startedAt,
      answers: answers.length, correct: correct, errors: answers.length - correct,
      accuracy: answers.length ? Math.round((correct / answers.length) * 100) : 0,
      avgAnswerMs: times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0,
      medianAnswerMs: sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0,
      hints: this.events.filter((e) => e.type === 'hint').length,
      idlePeriods: this.events.filter((e) => e.type === 'idle').length,
      stations: State.log.slice(),
      device: this.device(),
    }, extra || {});
  },
};

/* ================= صدا (بدون فایلِ صوتی) ================= */
const Sound = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.on = false; } } },
  tone(freq, dur, type, gain, delay) {
    if (!this.on) return;
    this.init(); if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    amp.gain.setValueAtTime(gain || 0.14, t0);
    amp.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(amp); amp.connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  tap()     { this.tone(660, 0.09, 'sine', 0.1); },
  pick()    { this.tone(520, 0.1, 'triangle', 0.12); },
  good()    { [523, 659, 784].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.15, i * 0.08)); },
  wrong()   { this.tone(220, 0.22, 'triangle', 0.12); this.tone(170, 0.26, 'triangle', 0.1, 0.08); },
  station() { [392, 523, 659, 880].forEach((f, i) => this.tone(f, 0.24, 'sine', 0.15, i * 0.1)); },
  whistle() { this.tone(880, 0.4, 'sine', 0.13); this.tone(660, 0.5, 'sine', 0.11, 0.1); },
  chug()    { for (let i = 0; i < 4; i++) this.tone(90 + (i % 2) * 18, 0.12, 'sawtooth', 0.07, i * 0.13); },
  win()     { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.3, 'sine', 0.15, i * 0.12)); },
};

function fitTrain() {
  const train = $('#train');

  train.style.setProperty('--fit', '1');
  const need = train.scrollWidth + 20;

/* ================= سختیِ تطبیقی =================
   بر پایه‌ی دقت و سرعتِ همین جلسه؛ مقدارش در تله‌متری ثبت می‌شود. */
function pickTier() {
  if (State.answerTotal < 3) return 2;
  const acc = State.correctTotal / State.answerTotal;
  const recent = Telemetry.events.filter((e) => e.type === 'answer' && typeof e.ms === 'number').slice(-6);
  const avg = recent.length ? recent.reduce((a, b) => a + b.ms, 0) / recent.length : 8000;
  if (acc >= 0.85 && avg < 7000) return 3;
  if (acc < 0.6 || avg > 16000) return 1;
  return 2;
}

/* ================= ساختِ دورِ هر ایستگاه ================= */
function buildRound(station, tier) {
  if (station.kind === 'sort') {
    const count = tier === 1 ? 3 : tier === 2 ? 4 : 5;
    const start = tier === 3 ? rnd(2, 5) : 1;
    const target = Array.from({ length: count }, (_, i) => start + i);
    let order = shuffle(target);
    while (order.every((n, i) => n === target[i])) order = shuffle(target);
    return { kind: 'sort', target: target, order: order, initialOrder: [...order], moves: 0,
      mission: 'واگن‌ها را از راست به چپ مرتب کن',
      sub: 'از ' + fa(target[0]) + ' شروع کن تا ' + fa(target[count - 1]) + ' — روی دو واگن بزن تا جایشان عوض شود.' };
  }

  if (station.kind === 'missing') {
    const len = tier === 1 ? 4 : 5;
    const start = tier === 1 ? 1 : rnd(2, 6);
    const seq = Array.from({ length: len }, (_, i) => start + i);
    const gapCount = tier === 3 ? 2 : 1;
    const gaps = shuffle(seq.slice(1, -1)).slice(0, gapCount).sort((a, b) => a - b);
    const pool = [];
    let candidate = Math.max(1, start - 2);
    while (pool.length < 6) {
      if (!seq.includes(candidate) && candidate > 0) pool.push(candidate);
      candidate++;
      if (candidate > start + len + 4) break;
    }
    const cards = shuffle(gaps.concat(shuffle(pool).slice(0, 5 - gaps.length)));
    return { kind: 'missing', seq: seq, gaps: gaps, filled: [], cards: cards,
      mission: 'واگنِ گم‌شده را پیدا کن',
      sub: 'شماره‌ی درست را از پایین انتخاب کن تا سرِ جایش بنشیند.' };
  }

  if (station.kind === 'count') {
    const max = tier === 1 ? 5 : tier === 2 ? 8 : 12;
    const value = rnd(2, max);
    const wrong = shuffle([value - 1, value + 1, value - 2, value + 2].filter((n) => n > 0 && n !== value));
    return { kind: 'count', value: value, options: shuffle([value].concat(wrong.slice(0, 3))),
      mission: 'چند تا جعبه توی واگن است؟',
      sub: 'جعبه‌ها را بشمار و عددِ درست را بزن.' };
  }

  if (station.kind === 'compare') {
    const max = tier === 1 ? 9 : tier === 2 ? 15 : 20;
    let a = rnd(1, max), b = rnd(1, max);
    while (a === b) b = rnd(1, max);
    const bigger = Math.random() < 0.5;
    return { kind: 'compare', a: a, b: b, bigger: bigger, answer: bigger ? Math.max(a, b) : Math.min(a, b),
      mission: bigger ? 'کدام واگن عددِ بزرگ‌تری دارد؟' : 'کدام واگن عددِ کوچک‌تری دارد؟',
      sub: 'روی واگنِ درست بزن.' };
  }

  const step = tier === 1 ? 2 : tier === 2 ? (Math.random() < 0.5 ? 2 : 5) : rnd(2, 4);
  const start = step * rnd(1, 3);
  const seq = Array.from({ length: 4 }, (_, i) => start + i * step);
  const gapIndex = rnd(1, 2);
  const value = seq[gapIndex];
  const wrong = shuffle([value + step, value - step, value + 1, value - 1].filter((n) => n > 0 && n !== value));
  return { kind: 'pattern', seq: seq, gapIndex: gapIndex, value: value, step: step,
    options: shuffle([value].concat(wrong.slice(0, 3))),
    mission: 'الگو را ادامه بده (هر بار ' + fa(step) + ' تا بیشتر)',
    sub: 'عددِ جای خالی را انتخاب کن.' };
}

function renderStation() {
  const round = State.round;
  const train = $('#train');
  const tray = $('#tray');

  $('#mission-text').textContent = round.mission;
  $('#mission-sub').textContent = round.sub;
  tray.innerHTML = '';
  train.innerHTML = '';

  if (round.kind === 'sort') {
    round.order.forEach((num, pos) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.pos = String(pos);
      slot.appendChild(makeWagonButton(num, () => onSortTap(pos)));
      train.appendChild(slot);
    });
  }

  if (round.kind === 'missing' || round.kind === 'pattern') {
    const gapValues = round.kind === 'missing' ? round.gaps : [round.value];
    const filled = round.kind === 'missing' ? round.filled : [];
    round.seq.forEach((num) => {
      if (gapValues.indexOf(num) !== -1 && filled.indexOf(num) === -1) {
        const gap = document.createElement('div');
        gap.className = 'gap';
        gap.dataset.value = String(num);
        gap.textContent = '؟';
        train.appendChild(gap);
      } else {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.innerHTML = '<div class="wagon locked">' + wagonSVG(num) + '</div>';
        train.appendChild(slot);
      }
    });
    const firstGap = train.querySelector('.gap');
    if (firstGap) firstGap.classList.add('active');

    const options = round.kind === 'missing' ? round.cards : round.options;
    options.forEach((value) => tray.appendChild(makeCard(value)));
  }

  if (round.kind === 'count') {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.style.width = '124px';
    slot.innerHTML = '<div class="wagon locked">' + wagonSVG(4, round.value) + '</div>';
    train.appendChild(slot);
    round.options.forEach((value) => tray.appendChild(makeCard(value)));
  }

  if (round.kind === 'compare') {
    [round.a, round.b].forEach((num) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.appendChild(makeWagonButton(num, (e) => onAnswer(num, e.currentTarget)));
      train.appendChild(slot);
    });
  }

  const loco = document.createElement('div');
  loco.className = 'loco';
  loco.innerHTML = '<i class="smoke"></i><i class="smoke"></i><i class="smoke"></i>' + locoSVG();
  train.appendChild(loco);

  fitTrain();
  renderRoute();
}

function makeCard(value) {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.textContent = fa(value);
  card.dataset.value = String(value);
  card.setAttribute('aria-label', 'عدد ' + fa(value));
  card.addEventListener('click', (e) => onAnswer(value, e.currentTarget));
  return card;
}

function renderRoute() {
  $('#route').innerHTML = STATIONS.map((_, i) =>
    '<span class="stop ' + (i < State.index ? 'done' : i === State.index ? 'now' : '') + '"></span>').join('');
  $('#stars-count').textContent = fa(State.stars);
}

/* ================= تعامل‌ها ================= */
let picked = null;

function markInteraction() { State.lastInteractionAt = Date.now(); }

function onSortTap(pos) {
  if (State.busy) return;
  markInteraction();
  const round = State.round;
  const slots = $('#train').querySelectorAll('.slot');
  const btn = slots[pos] && slots[pos].querySelector('.wagon');
  if (!btn) return;

  if (picked === null) {
    picked = pos;
    btn.classList.add('pick');
    Sound.pick();
    Telemetry.log('select', { station: State.index, value: Number(btn.dataset.num), pos: pos });
    return;
  }
  if (picked === pos) {
    picked = null;
    btn.classList.remove('pick');
    Sound.tap();
    return;
  }

  const a = picked;
  picked = null;
  const moved = [round.order[a], round.order[pos]];
  round.order[a] = moved[1];
  round.order[pos] = moved[0];
  round.moves++;
  Sound.tap();
  Telemetry.log('swap', { station: State.index, from: moved[0], to: moved[1], posA: a, posB: pos, moves: round.moves });

  renderStation();
  checkSort();
}

function checkSort() {
  const round = State.round;
  const slots = $('#train').querySelectorAll('.slot');
  slots.forEach((slot, i) => {
    if (round.order[i] === round.target[i] && !slot.querySelector('.tick')) {
      const tick = document.createElement('span');
      tick.className = 'tick';
      tick.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></svg>';
      slot.appendChild(tick);
    }
  });

  const done = round.order.every((n, i) => n === round.target[i]);
  if (!done) return;

  State.answerTotal++; State.correctTotal++;
  Telemetry.log('answer', { station: State.index, kind: 'sort', correct: true,
    ms: Date.now() - State.roundStartedAt, moves: round.moves,
    optimalMoves: optimalSwaps(round.target, round.initialOrder), hintUsed: State.hintUsed, tier: State.tier });
  Sound.good();
  finishStation();
}

/** کمترین جابه‌جاییِ لازم — سنجه‌ی کاراییِ حل برای تحلیل */
function optimalSwaps(target, start) {
  const arr = [...start];
  let swaps = 0;
  for (let i = 0; i < target.length; i++) {
    if (arr[i] === target[i]) continue;
    const j = arr.indexOf(target[i]);
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    swaps++;
  }
  return swaps;
}

function onAnswer(value, el) {
  if (State.busy) return;
  markInteraction();
  const round = State.round;
  const ms = Date.now() - State.roundStartedAt;
  State.attempt++;

  let expected;
  if (round.kind === 'missing') {
    const active = $('#train').querySelector('.gap.active');
    expected = active ? Number(active.dataset.value) : round.gaps[0];
  } else if (round.kind === 'compare') {
    expected = round.answer;
  } else {
    expected = round.value;
  }

  const correct = Number(value) === Number(expected);
  State.answerTotal++;
  if (correct) State.correctTotal++;

  Telemetry.log('answer', { station: State.index, kind: round.kind, correct: correct,
    given: Number(value), expected: expected, ms: ms, attempt: State.attempt,
    hintUsed: State.hintUsed, tier: State.tier });

  if (!correct) {
    State.errors++;
    Sound.wrong();
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 460);
    toast('نزدیک بود! یک بار دیگه نگاه کن', 'warn');
    return;
  }

  Sound.good();
  sparkle(el, colorOf(Number(value)));

  if (round.kind === 'missing') {
    round.filled.push(Number(value));
    renderStation();
    if (round.filled.length === round.gaps.length) { finishStation(); return; }
    State.attempt = 0;
    State.roundStartedAt = Date.now();
    toast('آفرین! یکی دیگه مانده', 'good');
    return;
  }
  finishStation();
}

/* ================= راهنمایی ================= */
function showHint() {
  if (State.busy || !State.round) return;
  markInteraction();
  const round = State.round;
  State.hintUsed = true;
  State.hints++;
  Telemetry.log('hint', { station: State.index, kind: round.kind, attempt: State.attempt });

  if (round.kind === 'sort') {
    const wrongIndex = round.order.findIndex((n, i) => n !== round.target[i]);
    if (wrongIndex === -1) return;
    toast('این‌جا باید عددِ ' + fa(round.target[wrongIndex]) + ' باشد', 'warn');
    const slot = $('#train').querySelectorAll('.slot')[wrongIndex];
    const wagon = slot && slot.querySelector('.wagon');
    if (wagon) { wagon.classList.add('shake'); setTimeout(() => wagon.classList.remove('shake'), 500); }
    return;
  }
  if (round.kind === 'count')   { toast('جعبه‌ها را یکی‌یکی با انگشت بشمار', 'warn'); return; }
  if (round.kind === 'compare') { toast(round.bigger ? 'عددِ بزرگ‌تر یعنی تعدادِ بیشتر' : 'عددِ کوچک‌تر یعنی تعدادِ کمتر', 'warn'); return; }
  if (round.kind === 'pattern') { toast('هر واگن ' + fa(round.step) + ' تا بیشتر از قبلی است', 'warn'); return; }
  const active = $('#train').querySelector('.gap.active');
  const gapValue = active ? Number(active.dataset.value) : round.gaps[0];
  toast('بینِ ' + fa(gapValue - 1) + ' و ' + fa(gapValue + 1) + ' چه عددی می‌آید؟', 'warn');
}

/* ================= چرخه‌ی ایستگاه‌ها ================= */
function starsFor(ms, errors, hints) {
  if (errors === 0 && hints === 0 && ms < 45000) return 3;
  if (errors <= 1 && hints <= 1) return 2;
  return 1;
}

function startStation() {
  const station = STATIONS[State.index];
  document.body.dataset.mood = station.mood;
  State.tier = pickTier();
  State.round = buildRound(station, State.tier);
  State.roundStartedAt = Date.now();
  State.stationStartedAt = Date.now();
  State.errors = 0; State.hints = 0; State.hintUsed = false; State.attempt = 0;
  picked = null; State.busy = false;

  const numbers = State.round.target || State.round.seq ||
    [State.round.a, State.round.b, State.round.value].filter((n) => typeof n === 'number');
  Telemetry.log('station_start', { station: State.index, name: station.name, kind: station.kind, tier: State.tier, numbers: numbers });

  renderStation();

  const sign = $('#station-sign');
  sign.innerHTML = station.name + '<small>ایستگاه ' + fa(State.index + 1) + ' از ' + fa(STATIONS.length) + '</small>';
  sign.classList.add('show');
  setTimeout(() => sign.classList.remove('show'), 2200);

  const train = $('#train');
  train.classList.add('arrive');
  setTimeout(() => train.classList.remove('arrive'), 1050);
}

function finishStation() {
  if (State.busy) return;
  State.busy = true;

  const ms = Date.now() - State.stationStartedAt;
  const stars = starsFor(ms, State.errors, State.hints);
  State.stars += stars;

  const record = {
    index: State.index, name: STATIONS[State.index].name, kind: STATIONS[State.index].kind,
    tier: State.tier, ms: ms, errors: State.errors, hints: State.hints, stars: stars,
    moves: typeof State.round.moves === 'number' ? State.round.moves : null,
    optimalMoves: State.round.kind === 'sort' ? optimalSwaps(State.round.target, State.round.initialOrder) : null,
  };
  State.log.push(record);
  Telemetry.log('station_end', record);

  Sound.station();
  toast(stars === 3 ? 'عالی بود! بی‌نقص' : 'آفرین! قطار راه افتاد', 'good');
  sparkle($('#train'), '#ffc531');
  renderRoute();

  setTimeout(() => {
    Sound.whistle(); Sound.chug();
    $('#app').classList.add('travel');
    $('#train').classList.add('depart');
    setTimeout(() => {
      $('#train').classList.remove('depart');
      $('#app').classList.remove('travel');
      State.index++;
      if (State.index >= STATIONS.length) endGame();
      else startStation();
    }, 1250);
  }, 950);
}

function endGame() {
  State.finished = true;
  const maxStars = STATIONS.length * 3;
  const summary = Telemetry.summary({ completed: true, stars: State.stars, maxStars: maxStars, stationsDone: STATIONS.length });
  Telemetry.log('game_end', { stars: State.stars, accuracy: summary.accuracy, durationMs: summary.durationMs });

  const store = loadStore();
  saveStore({
    plays: (store.plays || 0) + 1,
    bestStars: Math.max(store.bestStars || 0, State.stars),
    bestMs: Math.min(store.bestMs || Infinity, summary.durationMs),
    lastSummary: summary,
  });

  // قراردادِ اپ: همین یک پیام، مرحله را کامل و جایزه را ثبت می‌کند
  Telemetry.send({ type: 'luko-game-complete', game: GAME.slug, sessionId: Telemetry.sessionId, summary: summary });

  const ratio = State.stars / maxStars;
  const bigStars = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  $('#end-stars').innerHTML = [0, 1, 2].map((i) =>
    '<span class="star-big ' + (i < bigStars ? 'on' : 'off') + '">' + starSVG() + '</span>').join('');
  $('#end-title').textContent = bigStars === 3 ? 'قطار بی‌نقص رسید!' : 'رسیدیم به شهر لوکو!';
  $('#end-message').textContent = bigStars === 3
    ? 'هر شش ایستگاه را بدون اشتباه رد کردی. مهندسِ واقعیِ اعداد!'
    : 'قطار سالم رسید. دفعه‌ی بعد می‌توانی ستاره‌های بیشتری بگیری.';
  $('#end-metrics').innerHTML =
    '<div class="metric"><b>' + fa(State.stars) + '</b><span>ستاره</span></div>' +
    '<div class="metric"><b>' + clock(summary.durationMs) + '</b><span>زمان</span></div>' +
    '<div class="metric"><b>' + fa(summary.accuracy) + '٪</b><span>دقت</span></div>' +
    '<div class="metric"><b>' + fa(summary.hints) + '</b><span>راهنمایی</span></div>';

  show('screen-end');
  Sound.win();
  confetti();
}

/* ================= ناوبری ================= */
function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
}

function startGame() {
  State.index = 0; State.stars = 0; State.log = [];
  State.finished = false; State.started = true;
  State.correctTotal = 0; State.answerTotal = 0;
  Telemetry.newSession();
  Telemetry.startedAt = Date.now();
  Telemetry.events = [];
  Telemetry.log('game_start', { stations: STATIONS.length, device: Telemetry.device() });
  show('screen-play');
  startStation();
}

function renderStartMetrics() {
  const store = loadStore();
  $('#start-metrics').innerHTML =
    '<div class="metric"><b>' + fa(store.plays || 0) + '</b><span>سفر</span></div>' +
    '<div class="metric"><b>' + fa(store.bestStars || 0) + '</b><span>رکورد ستاره</span></div>' +
    '<div class="metric"><b>' + (store.bestMs && isFinite(store.bestMs) ? clock(store.bestMs) : '—') + '</b><span>بهترین زمان</span></div>' +
    '<div class="metric"><b>' + fa(STATIONS.length) + '</b><span>ایستگاه</span></div>';
  $('#hero-train').innerHTML = locoSVG();
}

/* ================= سیگنالِ بی‌حرکتی (تمرکز) ================= */
setInterval(() => {
  if (State.finished || !State.started || !$('#screen-play').classList.contains('active')) return;
  const idle = Date.now() - State.lastInteractionAt;
  if (idle > 20000) {
    Telemetry.log('idle', { station: State.index, ms: idle });
    State.lastInteractionAt = Date.now();
  }
}, 5000);

/* غیبتِ واقعی (بیرون رفتن از اپ) ثبت می‌شود، نه هر بار عوض شدنِ فوکوس */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (!State.started) return;
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  if (away > 3000) Telemetry.log('away', { station: State.index, ms: away });
  hiddenAt = 0;
  markInteraction();
});

addEventListener('pagehide', () => {
  if (!State.started || State.finished) return;
  Telemetry.send({ type: 'luko-game-progress', game: GAME.slug, sessionId: Telemetry.sessionId,
    summary: Telemetry.summary({ completed: false, stars: State.stars, stationsDone: State.index }) });
});

/* ================= پنلِ دیباگِ داده (?debug=1) ================= */
const Debug = {
  on: new URLSearchParams(location.search).get('debug') === '1',
  el: null,
  init() {
    if (!this.on) return;
    this.el = document.createElement('div');
    this.el.className = 'debug';
    $('#app').appendChild(this.el);
    this.render();
  },
  render() {
    if (!this.el) return;
    const last = Telemetry.events.slice(-8).reverse()
      .map((e) => '<div>' + e.t + 'ms <b>' + e.type + '</b> ' + JSON.stringify(e).slice(0, 130) + '</div>').join('');
    this.el.innerHTML = '<div><b>events: ' + Telemetry.events.length + '</b> · ' + Telemetry.sessionId + '</div>' + last +
      '<button id="dbg-copy" type="button">copy summary JSON</button>';
    const btn = this.el.querySelector('#dbg-copy');
    btn.onclick = () => {
      const data = JSON.stringify({ summary: Telemetry.summary(), events: Telemetry.events }, null, 2);
      if (navigator.clipboard) navigator.clipboard.writeText(data);
      console.log(data);
    };
  },
};

/* برای تستِ دستی و اتصالِ بعدی به بک‌اند */
window.LUKO_GAME = {
  meta: GAME,
  get events() { return Telemetry.events; },
  get state() { return { index: State.index, stars: State.stars, finished: State.finished }; },
  summary: () => Telemetry.summary(),
};

/* ================= رویدادهای رابط ================= */
$('#btn-start').addEventListener('click', () => { Sound.init(); Sound.whistle(); startGame(); });
$('#btn-again').addEventListener('click', () => startGame());
$('#btn-hint').addEventListener('click', showHint);
$('#btn-how').addEventListener('click', () => {
  toast('روی واگن‌ها یا کارت‌ها بزن تا اعداد سرِ جایشان بروند');
  Telemetry.log('help_open', {});
});
$('#btn-sound').addEventListener('click', (e) => {
  Sound.on = !Sound.on;
  e.currentTarget.classList.toggle('off', !Sound.on);
  saveStore({ sound: Sound.on });
  Telemetry.log('setting', { sound: Sound.on });
  if (Sound.on) Sound.tap();
});
$('#btn-motion').addEventListener('click', (e) => {
  const turningOff = document.body.dataset.motion === 'on';
  document.body.dataset.motion = turningOff ? 'off' : 'on';
  e.currentTarget.classList.toggle('off', turningOff);
  saveStore({ motion: !turningOff });
  Telemetry.log('setting', { motion: !turningOff });
});

/* ================= راه‌اندازی ================= */
(function init() {
  const store = loadStore();
  if (store.sound === false) { Sound.on = false; $('#btn-sound').classList.add('off'); }
  if (store.motion === false) { document.body.dataset.motion = 'off'; $('#btn-motion').classList.add('off'); }
  Telemetry.newSession();
  buildTrees();
  buildStars();
  renderStartMetrics();
  Debug.init();
  addEventListener('pointerdown', markInteraction, { passive: true });
})();
</script>
