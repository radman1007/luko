<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0a14">
<title>ماجراجویی تفریق - LOKO</title>
<style>
/* ==================== LOKO Design System ==================== */
@font-face {
  font-family: "Shoor";
  src: url("/games/assets/fonts/Shoor-Regular.woff2") format("woff2");
  font-weight: 400;
}
@font-face {
  font-family: "Shoor";
  src: url("/games/assets/fonts/Shoor-Black.woff2") format("woff2");
  font-weight: 900;
}
@font-face {
  font-family: "Shoor Rounded";
  src: url("/games/assets/fonts/ShoorRounded-Regular.woff2") format("woff2");
  font-weight: 400;
}
@font-face {
  font-family: "Shoor Rounded";
  src: url("/games/assets/fonts/ShoorRounded-Black.woff2") format("woff2");
  font-weight: 900;
}

:root {
  --primary: #6C5CE7;
  --neon-blue: #00D2FF;
  --neon-pink: #FF00A0;
  --neon-green: #00FF9D;
  --accent: #FFEAA7;
  --success: #00B894;
  --danger: #FF7675;
  --dark: #1E1E2F;
  --gold: #FFC93C;
  --gold-dark: #B96F00;
  --font: 'Shoor Rounded', 'Shoor', Tahoma, sans-serif;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.2);
  --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.5);
  --radius: 16px;
  --radius-lg: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font);
  background: linear-gradient(135deg, #0c0a14, #181225);
  color: #fff;
  position: relative;
  line-height: 1.6;
}

/* Animated Background Orbs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: -1;
  animation: floatOrb 15s ease-in-out infinite;
}
body::before {
  width: 300px; height: 300px;
  background: rgba(108, 92, 231, 0.4);
  top: -50px; left: -50px;
}
body::after {
  width: 400px; height: 400px;
  background: rgba(255, 0, 160, 0.3);
  bottom: -100px; right: -100px;
  animation-delay: -5s;
}

@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(50px, 30px); }
}

.app-wrapper {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: rgba(12, 10, 20, 0.8);
  backdrop-filter: blur(10px);
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  overflow-y: auto;
}

.screen.active { display: flex; opacity: 1; transform: translateY(0); }

/* ==================== LOKO Coin System ==================== */
.coin-display {
  position: absolute;
  top: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--glass-border);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 100;
  transition: all 0.3s ease;
}
.coin-display:hover { transform: scale(1.05); border-color: var(--gold); }

.coin-icon-img { width: 24px; height: 24px; }
.coin-amount { font-weight: 900; font-size: 1.2rem; color: var(--gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

/* ==================== Main Menu ==================== */
#main-menu { gap: 15px; }

.speech-bubble {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  padding: 12px 20px;
  border-radius: 16px;
  position: relative;
  margin-bottom: 10px;
  font-size: 1rem;
  color: #fff;
  box-shadow: var(--shadow-soft);
  animation: fadeInDown 0.8s ease;
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 10px 10px 0;
  border-style: solid;
  border-color: var(--glass-border) transparent transparent;
}

.pixel-character {
  width: 150px;
  height: 150px;
  position: relative;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 15px rgba(108, 92, 231, 0.6));
  transition: transform 0.3s ease;
}
.pixel-character:hover { transform: scale(1.1); }
.pixel-character img { width: 100%; height: 100%; object-fit: contain; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==================== LOKO Buttons ==================== */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-weight: 900;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  border-radius: var(--radius);
}

.btn-primary {
  background: linear-gradient(180deg, #FFE68A 0%, #FFC93C 45%, #FFA800 100%);
  color: var(--gold-dark);
  border: 2px solid #FFA800;
  box-shadow: 0 6px 0 #B96F00, 0 8px 15px rgba(0,0,0,0.3);
  padding: 15px 40px;
  font-size: 1.3rem;
  width: 100%;
  max-width: 300px;
  text-shadow: 0 1px 1px rgba(255,255,255,0.4);
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #B96F00, 0 12px 20px rgba(255, 201, 60, 0.4); }
.btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #B96F00, 0 3px 5px rgba(0,0,0,0.3); }

.btn-secondary {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  color: #fff;
  border: 1px solid var(--glass-border);
  padding: 12px 20px;
  font-size: 1rem;
  box-shadow: 0 4px 0 rgba(0,0,0,0.3);
  width: 100%;
  max-width: 300px;
}
.btn-secondary:hover { transform: translateY(-2px); border-color: var(--neon-blue); box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 0 15px rgba(0, 210, 255, 0.3); }
.btn-secondary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }

.back-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
  font-size: 1.2rem;
  transition: all 0.3s ease;
}
.back-btn:hover { transform: rotate(360deg) scale(1.1); background: var(--danger); border-color: var(--danger); }

/* ==================== Level Select ==================== */
#level-select-menu { padding-top: 80px; gap: 15px; }

.level-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  width: 100%;
  padding: 0 10px;
}

.level-card {
  aspect-ratio: 1;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  animation: popIn 0.5s ease backwards;
}
.level-card:nth-child(1) { animation-delay: 0.1s; }
.level-card:nth-child(2) { animation-delay: 0.2s; }
.level-card:nth-child(3) { animation-delay: 0.3s; }
.level-card:nth-child(4) { animation-delay: 0.4s; }
.level-card:nth-child(5) { animation-delay: 0.5s; }

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.5); }
  100% { opacity: 1; transform: scale(1); }
}

.level-card:not(.locked):hover {
  transform: translateY(-5px) scale(1.03);
  border-color: var(--gold);
  box-shadow: 0 10px 20px rgba(255, 201, 60, 0.2);
  background: rgba(255, 201, 60, 0.1);
}
.level-card:active { transform: scale(0.95); }
.level-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
.level-card .lock-icon { position: absolute; bottom: 10px; width: 20px; height: 20px; }

/* ==================== Game Screen ==================== */
#game-screen { padding: 0; justify-content: flex-start; }

.game-header {
  width: 100%;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.timer-container {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  padding: 8px 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 900;
  color: #fff;
  min-width: 70px;
  justify-content: center;
  transition: all 0.3s ease;
}
.timer-container.danger { color: var(--danger); border-color: var(--danger); animation: pulseDanger 1s infinite; }

@keyframes pulseDanger {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 118, 117, 0); }
}

.story-stage {
  width: 100%;
  height: 35vh;
  min-height: 220px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--glass-border);
  position: relative;
  overflow: hidden;
}

/* Narrator Section */
.narrator-section {
  display: flex;
  align-items: flex-end;
  padding: 10px 15px;
  gap: 10px;
  width: 100%;
  /* background: linear-gradient(to top, rgba(12,10,20,0.9), transparent); */
}

.narrator-avatar {
  width: 70px;
  height: auto;
  /* flex-shrink: 0; */
  /* border-radius: 50%; */
  /* border: 3px solid var(--neon-blue); */
  /* box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); */
  overflow: hidden;
  /* background: #fff; */
  animation: float 4s ease-in-out infinite;
}
.narrator-avatar img { width: 100%; height: 100%; object-fit: cover; }
.narrator-avatar.talking { animation: talkShake 0.3s infinite; }

@keyframes talkShake {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-2px) rotate(-1deg); }
  75% { transform: translateY(1px) rotate(1deg); }
}

.narration-box {
  flex-grow: 1;
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 16px 16px 16px 4px;
  padding: 12px 15px;
  text-align: right;
  font-size: 0.95rem;
  min-height: 60px;
  color: #fff;
  position: relative;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
}

.options-container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 15px;
  width: 100%;
}

.option-btn {
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 10px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 70px;
  animation: popIn 0.5s ease backwards;
}
.option-btn:nth-child(1) { animation-delay: 0.1s; }
.option-btn:nth-child(2) { animation-delay: 0.2s; }
.option-btn:nth-child(3) { animation-delay: 0.3s; }
.option-btn:nth-child(4) { animation-delay: 0.4s; }

.option-btn:hover {
  transform: translateY(-5px) scale(1.03);
  border-color: var(--neon-blue);
  box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
  background: rgba(255, 255, 255, 0.15);
}
.option-btn:active { transform: scale(0.95); }
.option-btn .num-group { display: flex; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
.option-btn .num-icon { height: 40px; width: auto; transition: transform 0.3s ease; }
.option-btn:hover .num-icon { transform: scale(1.1); }
.option-btn.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.3); box-shadow: 0 0 20px rgba(0, 184, 148, 0.4); }
.option-btn.wrong { border-color: var(--danger); background: rgba(255, 118, 117, 0.3); animation: shake 0.5s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

/* ==================== Overlays ==================== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.overlay.show { display: flex; opacity: 1; }

.overlay-card {
  background: var(--dark);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 30px;
  width: 90%;
  max-width: 320px;
  text-align: center;
  box-shadow: var(--shadow-soft);
  animation: cardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes cardPop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.overlay-icon { width: 60px; height: 60px; margin: 0 auto 15px; animation: float 3s ease-in-out infinite; }
.overlay-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 900; }
.overlay-btn { margin-bottom: 10px; width: 100%; }

/* ==================== Animations & Helpers ==================== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--dark);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  border: 1px solid var(--glass-border);
  z-index: 300;
  transition: transform 0.3s ease;
  font-size: 0.9rem;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ==================== Responsive ==================== */
@media (max-width: 360px) {
  .pixel-character { width: 120px; height: 120px; }
  .btn-primary { font-size: 1.1rem; padding: 12px 30px; }
  .story-stage { height: 30vh; min-height: 180px; }
  .narrator-avatar { width: 50px; height: 50px; }
  .narration-box { font-size: 0.85rem; padding: 10px; }
  .option-btn .num-icon { height: 35px; }
}
</style>
</head>
<body>

<!-- Background Music -->
<audio id="bg-music" src="/games/assets/musics/sami forest.mp3" loop preload="auto"></audio>

<div class="app-wrapper">

  <!-- ============ Main Menu ============ -->
  <section id="main-menu" class="screen active">
    <div class="coin-display">
      <img src="/games/assets/icons/coin.png" class="coin-icon-img" alt="coin">
      <div class="coin-amount" id="menu-coins">0</div>
    </div>
    
    <div class="speech-bubble">سلام! آماده‌ای بریم تفریق یاد بگیریم؟</div>
    
    <div class="pixel-character">
      <img src="/games/assets/icons/gamer.png" alt="Character">
    </div>
    
    <button class="btn btn-primary" id="start-btn">شروع بازی</button>
    <button class="btn btn-secondary" id="help-btn" style="margin-top: 10px;">راهنما</button>
  </section>

  <!-- ============ Level Select Menu ============ -->
  <section id="level-select-menu" class="screen">
    <button class="back-btn" data-target="main-menu">↩</button>
    <h2 style="margin-bottom: 20px; color: var(--gold);">انتخاب مرحله</h2>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <!-- ============ Help Menu ============ -->
  <section id="help-screen" class="screen">
    <button class="back-btn" data-target="main-menu">↩</button>
    <div style="width: 100px; height: 100px; margin: 20px auto;">
      <img src="/games/assets/icons/gamerhi.png" style="width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--neon-blue);" alt="Helper">
    </div>
    <div class="overlay-card" style="position: relative; background: var(--glass-bg); margin-top: 0;">
      <h3 style="color: var(--neon-blue); margin-bottom: 10px;">چگونه بازی کنیم؟</h3>
      <p style="font-size: 0.9rem; line-height: 1.8;">۱. به داستان گوش بده و تصویر را ببین.<br>۲. در پایان، تعداد اشیای باقیمانده را حساب کن.<br>۳. گزینه درست را قبل از پایان زمان انتخاب کن!</p>
    </div>
  </section>

  <!-- ============ Game Screen ============ -->
  <section id="game-screen" class="screen">
    <div class="game-header">
      <div class="timer-container" id="timer-container">
        <span id="timer-text">۳۰</span>
      </div>
      <div style="background: var(--glass-bg); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--glass-border); font-weight: 700;">
        مرحله <span id="level-indicator">۱</span>
      </div>
      <button class="back-btn" id="pause-btn" style="position: relative; top: 0; right: 0;">❚❚</button>
    </div>
    
    <div class="story-stage" id="story-stage"></div>
    
    <div class="narrator-section">
      <div class="narrator-avatar" id="narrator-avatar">
        <img src="/games/assets/icons/gamerhi.png" alt="Narrator">
      </div>
      <div class="narration-box" id="narration-text"></div>
    </div>
    
    <div class="options-container" id="options-container"></div>
  </section>

</div>

<!-- ============ Action Overlay (Pause / Level Complete) ============ -->
<div class="overlay" id="action-overlay">
  <div class="overlay-card">
    <div class="overlay-icon" id="overlay-icon"></div>
    <h2 class="overlay-title" id="overlay-title"></h2>
    <div id="overlay-content"></div>
    <button class="btn btn-secondary overlay-btn" id="overlay-next">مرحله بعد</button>
    <button class="btn btn-secondary overlay-btn" id="overlay-restart">شروع مجدد</button>
    <button class="btn btn-secondary overlay-btn" id="overlay-home">خانه</button>
  </div>
</div>

<!-- ============ Toast ============ -->
<div class="toast" id="toast"></div>
