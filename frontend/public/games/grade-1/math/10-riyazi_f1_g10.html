<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سفر ریاضی - LOKO System</title>
    
    <style>
        @font-face {
            font-family: "Shoor";
            src: url("/games/assets/fonts/Shoor-Regular.woff2") format("woff2");
            font-weight: 400;
        }
        @font-face {
            font-family: "Shoor";
            src: url("/games/assets/fonts/Shoor-Medium.woff2") format("woff2");
            font-weight: 500;
        }
        @font-face {
            font-family: "Shoor";
            src: url("/games/assets/fonts/Shoor-Black.woff2") format("woff2");
            font-weight: 900;
        }
        @font-face {
            font-family: "Shoor";
            src: url("/games/assets/fonts/Shoor-ExtraBold.woff2") format("woff2");
            font-weight: 800;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("/games/assets/fonts/ShoorRounded-Regular.woff2") format("woff2");
            font-weight: 400;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("/games/assets/fonts/ShoorRounded-Medium.woff2") format("woff2");
            font-weight: 500;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("/games/assets/fonts/ShoorRounded-Black.woff2") format("woff2");
            font-weight: 900;
        }
        @font-face {
            font-family: "Shoor Rounded";
            src: url("/games/assets/fonts/ShoorRounded-ExtraBold.woff2") format("woff2");
            font-weight: 800;
        }
    </style>

    <style>
        :root {
            --primary: #6C5CE7;
            --neon-blue: #00D2FF;
            --neon-pink: #FF00A0;
            --neon-green: #00FF9D;
            --accent: #FFEAA7;
            --success: #00B894;
            --danger: #FF7675;
            --dark: #1E1E2F;
            --gold: #FFC93C;
            --gold-dark: #B96F00;
            --font: 'Shoor Rounded', 'Shoor', Tahoma, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            background: #000;
            color: white;
            min-height: 100vh;
            min-height: 100dvh;
        }

        #app-wrapper {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transition: background 0.5s ease;
        }

        /* Theme System - Default is Forest */
        .theme-default #app-wrapper { background: linear-gradient(135deg, #0c0a14, #181225); }
        .theme-forest #app-wrapper { background: linear-gradient(135deg, #0f2f1a, #1a4029); }
        .theme-ocean #app-wrapper { background: linear-gradient(135deg, #0a1a2f, #12253e); }
        .theme-candy #app-wrapper { background: linear-gradient(135deg, #2f0a1f, #3e1228); }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
        }
        .screen.active { display: flex; }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }

        /* Intro/Guide Overlay */
        #intro-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        #intro-overlay.active { display: flex; }
        
        .intro-glow {
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, rgba(108, 92, 231, 0.1) 40%, transparent 70%);
            top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .intro-char-container { position: relative; margin-bottom: 30px; z-index: 2; }
        .intro-char {
            width: 220px; height: auto;
            filter: drop-shadow(0 15px 30px rgba(0, 210, 255, 0.4));
            animation: floatChar 3s ease-in-out infinite;
        }
        @keyframes floatChar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        .intro-text-box {
            position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 30px 40px; border-radius: 24px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 210, 255, 0.05);
            min-height: 140px; width: 90%; max-width: 400px;
            display: flex; align-items: center; justify-content: center;
        }
        #intro-text {
            font-size: 1.8rem; font-weight: 700; line-height: 1.6;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: opacity 0.4s ease;
        }
        .btn-skip-intro {
            margin-top: 30px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
            padding: 10px 25px; border-radius: 20px; font-family: var(--font);
            font-size: 1rem; font-weight: 700; cursor: pointer; z-index: 2;
            transition: all 0.2s;
        }
        .btn-skip-intro:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        /* Main Menu - Glass Dish Style */
        #start-screen { justify-content: center; align-items: center; padding: 20px; text-align: center; position: relative; }
        .stars-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 30px, #fff, transparent);
            background-size: 200px 100px;
            animation: starsMove 20s linear infinite;
            opacity: 0.5; pointer-events: none;
        }
        @keyframes starsMove { from { background-position: 0 0; } to { background-position: 0 100px; } }

        .menu-dish {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; width: calc(100% - 40px); max-width: 440px; }
        .coin-display { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid var(--gold); box-shadow: 0 0 15px rgba(255, 201, 60, 0.3); }
        .coin-icon-img { width: 24px; height: 24px; object-fit: contain; }
        .coin-amount { font-weight: 800; font-size: 1.2rem; color: var(--gold); }

        .game-title { font-size: 3rem; font-weight: 900; color: white; text-shadow: 0 0 20px var(--primary), 4px 4px 0 var(--dark); margin-bottom: 20px; z-index: 2; }
        .game-title span { color: var(--neon-blue); }

        /* Character Frame */
        .character-container { position: relative; margin-bottom: 30px; z-index: 2; }
        .speech-bubble { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; padding: 8px 20px; white-space: nowrap; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 3; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border: 10px solid transparent; border-top-color: rgba(255, 255, 255, 0.2); }
        
        .menu-char-frame {
            width: 180px; height: 180px; border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #FF9800);
            padding: 6px;
            box-shadow: 0 0 40px rgba(255, 201, 60, 0.4), inset 0 0 10px rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center;
        }
        .menu-char-inner {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex; justify-content: center; align-items: flex-end;
            border: 4px solid rgba(255,255,255,0.1);
        }
        .pixel-character {
            width: 140px; height: 150px; object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4));
            animation: floatChar 3s ease-in-out infinite;
        }

        .btn { border: none; cursor: pointer; font-family: var(--font); font-weight: 800; border-radius: 16px; transition: all 0.15s ease; position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(180deg, #6BCB77 0%, #4CAF50 100%); color: white; padding: 15px 50px; font-size: 1.5rem; box-shadow: 0 6px 0 #2E7D32, 0 12px 25px rgba(76, 175, 80, 0.4); width: 100%; margin-bottom: 15px; }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #2E7D32, 0 5px 15px rgba(76, 175, 80, 0.4); }
        .secondary-buttons { display: flex; gap: 15px; width: 100%; }
        .btn-secondary { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px 20px; font-size: 1.1rem; flex: 1; box-shadow: 0 4px 0 rgba(0,0,0,0.3); margin-bottom: 0; border-radius: 12px; }
        .btn-secondary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }

        /* Game Screen HUD */
        #game-screen { position: relative; }
        .game-hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 200; pointer-events: none; gap: 10px; }
        .game-hud > * { pointer-events: all; }
        
        .pause-btn { 
            background: rgba(255,255,255,0.15); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: white; width: 44px; height: 44px; 
            border-radius: 14px; font-size: 1.2rem; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .pause-btn svg { width: 20px; height: 20px; fill: white; }

        /* New Progress Indicator in HUD */
        .hud-progress {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            flex-grow: 1;
            max-width: 160px;
        }

        /* Pause Menu */
        #pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 1500; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        #pause-overlay.active { display: flex; }

        .pause-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px; padding: 40px 30px; text-align: center;
            width: 100%; max-width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative; z-index: 10;
        }
        .pause-icon-circle {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #FFA800, #FF6B6B);
            border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.4);
        }
        .pause-icon { width: 30px; height: 30px; border-left: 8px solid white; border-right: 8px solid white; }
        .pause-title { font-size: 1.8rem; font-weight: 800; color: white; margin-bottom: 30px; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .pause-menu-btn { display: block; width: 100%; padding: 15px; border-radius: 14px; font-family: var(--font); font-weight: 800; font-size: 1.2rem; cursor: pointer; margin-bottom: 12px; border: none; transition: transform 0.1s; }
        .pause-menu-btn:active { transform: scale(0.98); }
        .pause-btn-primary { background: linear-gradient(180deg, #6BCB77, #4CAF50); color: white; box-shadow: 0 6px 0 #2E7D32, 0 10px 15px rgba(76, 175, 80, 0.3); }
        .pause-btn-secondary { background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .pause-btn-danger { background: linear-gradient(180deg, #FF7675, #E53935); color: white; box-shadow: 0 6px 0 #c0392b, 0 10px 15px rgba(229, 57, 53, 0.3); }

        .narrator { position: absolute; top: 70px; left: 10px; right: 10px; z-index: 100; display: flex; align-items: flex-start; gap: 10px; }
        .narrator-bubble { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 15px 20px; max-width: 75%; box-shadow: 0 5px 20px rgba(0,0,0,0.3); position: relative; animation: bubblePop 0.5s ease-out; }
        .narrator-bubble::after { content: ''; position: absolute; bottom: -10px; right: 30px; border: 10px solid transparent; border-top-color: rgba(255, 255, 255, 0.15); }
        @keyframes bubblePop { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        #narrator-text { font-size: 1.1rem; color: white; line-height: 1.6; margin: 0; transition: opacity 0.3s; }
        .narrator-character { width: 70px; height: 70px; position: relative; flex-shrink: 0; }
        .narrator-img { width: 100%; height: 100%; object-fit: contain; border-radius: 15px; filter: drop-shadow(0 0 10px var(--neon-blue)); animation: narratorBob 2s ease-in-out infinite; }
        @keyframes narratorBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-4px) rotate(-2deg); } 75% { transform: translateY(-4px) rotate(2deg); } }

        .game-stage { position: absolute; top: 25%; left: 0; right: 0; height: 45%; display: flex; justify-content: center; align-items: flex-end; gap: 20px; z-index: 50; padding: 0 20px; }
        .character { display: flex; flex-direction: column; align-items: center; transition: all 0.5s ease; position: relative; }
        .character.entering { animation: characterEnter 1s ease-out forwards; }
        @keyframes characterEnter { 0% { transform: translateX(-200px) scale(0); opacity: 0; } 60% { transform: translateX(20px) scale(1.1); } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        .character.happy { animation: happyBounce 0.5s ease-in-out; }
        @keyframes happyBounce { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-20px) rotate(-5deg); } 50% { transform: translateY(0) rotate(5deg); } 75% { transform: translateY(-10px) rotate(-3deg); } }
        .character.sad { animation: sadShake 0.5s ease-in-out; }
        @keyframes sadShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        .char-img, .char-emoji { font-size: 8rem; height: 170px; width: 170px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); transition: transform 0.3s; pointer-events: none; }
        .char-name { background: rgba(255,255,255,0.15); backdrop-filter: blur(5px); padding: 5px 15px; border-radius: 15px; font-size: 1rem; font-weight: 700; color: white; margin-top: 5px; border: 1px solid rgba(255,255,255,0.2); }

        .character.selectable { cursor: pointer; }
        .character.selectable::after { content: ''; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; height: 20px; background: var(--neon-green); border-radius: 50%; filter: blur(10px); opacity: 0.8; animation: targetPulse 1.5s ease-in-out infinite; }
        @keyframes targetPulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }
        .character.selectable .char-img, .character.selectable .char-emoji { animation: targetWiggle 0.5s ease-in-out infinite alternate; }
        @keyframes targetWiggle { from { transform: scale(1); } to { transform: scale(1.05); } }

        .character.drop-target { cursor: pointer; }
        .character.drop-target::after { content: ''; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; height: 20px; background: var(--neon-green); border-radius: 50%; filter: blur(10px); opacity: 0; animation: targetPulse 1.5s ease-in-out infinite; }
        .character.drop-target.active::after { opacity: 0.8; }

        .items-zone { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 15px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); min-height: 80px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; width: 90%; max-width: 400px; }
        .items-zone.visible { opacity: 1; pointer-events: all; }
        .draggable-item { width: 60px; height: 60px; cursor: grab; transition: transform 0.2s, filter 0.2s; filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.5)); animation: itemFloat 2s ease-in-out infinite; touch-action: none; }
        .draggable-item img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .draggable-item:hover { transform: scale(1.1) translateY(-5px); }
        .draggable-item.dragging { cursor: grabbing; transform: scale(1.3) rotate(-10deg); animation: none; z-index: 1000; filter: drop-shadow(0 0 15px var(--neon-blue)); transition: none; }
        @keyframes itemFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .answer-cards { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; z-index: 70; opacity: 0; pointer-events: none; transition: all 0.5s ease; }
        .answer-cards.visible { opacity: 1; pointer-events: all; }
        
        .sticker-option { width: 100px; height: 100px; font-size: 4rem; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.3s ease; }
        .sticker-option:hover { transform: scale(1.1); border-color: var(--gold); box-shadow: 0 0 20px var(--gold); }
        
        .answer-card { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.3s ease; font-family: var(--font); }
        .answer-card:hover { transform: translateY(-10px) scale(1.1); border-color: var(--neon-blue); box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3); }
        .answer-card.correct { background: linear-gradient(145deg, var(--neon-green), var(--success)); color: var(--dark); border-color: var(--neon-green); }
        .answer-card.wrong { background: linear-gradient(145deg, var(--danger), #c0392b); color: white; border-color: var(--danger); animation: wrongShake 0.5s ease-out; }
        @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

        .sticker-feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 10rem; z-index: 1000; pointer-events: none; opacity: 0; }
        .sticker-feedback.show { animation: stickerPop 1.5s ease-out forwards; }
        @keyframes stickerPop { 0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.2) rotate(0); opacity: 0; } }

        #end-screen { justify-content: center; align-items: center; padding: 20px; }
        .end-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 40px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        .trophy { font-size: 5rem; animation: trophyBounce 1s ease-in-out infinite; filter: drop-shadow(0 10px 20px var(--gold)); }
        @keyframes trophyBounce { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
        .end-title { font-size: 2rem; color: white; margin: 15px 0; text-shadow: 2px 2px 0 var(--dark); }
        .stars-earned { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .earned-star { font-size: 3rem; animation: starEarn 0.5s ease-out forwards; opacity: 0; filter: drop-shadow(0 0 10px var(--gold)); }
        .es1 { animation-delay: 0.5s; } .es2 { animation-delay: 1s; } .es3 { animation-delay: 1.5s; }
        @keyframes starEarn { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.5) rotate(20deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        .game-info { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .game-info p { color: rgba(255,255,255,0.7); font-size: 1rem; margin-bottom: 5px; }
        .game-info span { font-size: 2.5rem; font-weight: 900; color: var(--neon-blue); display: block; }
        .coin-reward { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 25px; font-size: 1.5rem; color: var(--gold); font-weight: 800; }
        .coin-reward-icon-img { width: 30px; height: 30px; }

        .confetti-container { position: absolute; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 5; }
        .confetti { position: absolute; width: 10px; height: 10px; top: -20px; animation: confettiFall 3s ease-out forwards; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        #shop-screen { padding: 20px; flex-direction: column; overflow-y: auto; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .shop-title { font-size: 1.8rem; font-weight: 900; color: white; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 20px; }
        .shop-card { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .theme-preview { width: 100%; height: 80px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); }
        .theme-name { font-weight: 700; color: white; }
        .btn-buy { background: linear-gradient(180deg, #FFE68A, #FFC93C); color: var(--dark); border: none; padding: 8px 15px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; box-shadow: 0 3px 0 var(--gold-dark); display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-buy:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dark); }
        .btn-buy.selected-theme { background: var(--success); color: white; box-shadow: 0 3px 0 #007e5f; pointer-events: none; }
        .btn-buy.locked { background: #555; color: #aaa; box-shadow: 0 3px 0 #333; pointer-events: none; }

        .story-cloud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 500; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .story-cloud.visible { opacity: 1; pointer-events: all; }
        .cloud-shape { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 40px 60px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: cloudBounce 1s ease-out; }
        @keyframes cloudBounce { 0% { transform: scale(0) translateY(50px); } 60% { transform: scale(1.1) translateY(-10px); } 100% { transform: scale(1) translateY(0); } }
        .cloud-text { font-size: 1.5rem; font-weight: 700; color: white; }

        .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 600; pointer-events: none; opacity: 0; }
        .celebration.visible { animation: celebrationFade 2s ease-out forwards; }
        @keyframes celebrationFade { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        .celebration-text { font-size: 4rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px var(--gold), 4px 4px 0 var(--dark); animation: celebratePop 0.5s ease-out; }
        @keyframes celebratePop { 0% { transform: scale(0) rotate(-10deg); } 60% { transform: scale(1.3) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }

    </style>
</head>
<body class="theme-forest">

<audio id="bg-music" src="/games/assets/musics/z1.mp3" loop></audio>

<div id="app-wrapper">
    <!-- Intro/Guide Overlay -->
    <div id="intro-overlay">
        <div class="intro-glow"></div>
        <div class="intro-char-container">
            <img src="/games/assets/icons/gamerhi.png" class="intro-char" alt="راهنما">
        </div>
        <div class="intro-text-box">
            <p id="intro-text">سلام من پیکسل هستم، راهنمای تو در این بازی</p>
        </div>
        <button class="btn-skip-intro" id="skip-intro-btn">رد کردن </button>
    </div>

    <!-- Main Menu -->
    <div id="start-screen" class="screen active">
        <div class="stars-bg"></div>
        <div class="top-hud">
            <div class="coin-display">
                <img src="/games/assets/icons/coin.png" class="coin-icon-img">
                <div class="coin-amount" id="menu-coins">۰</div>
            </div>
        </div>
        
        <div class="menu-dish">
            <h1 class="game-title">سفر <span>ریاضی</span></h1>
            <div class="character-container">
                <div class="speech-bubble">سلام! آماده‌ای بریم?</div>
                <div class="menu-char-frame">
                    <div class="menu-char-inner">
                        <img src="/games/assets/icons/gamerhi.png" alt="Character" class="pixel-character">
                    </div>
                </div>
            </div>
            <button id="start-btn" class="btn btn-primary">شروع بازی</button>
            <div class="secondary-buttons">
                <button id="shop-btn" class="btn btn-secondary">🛍️ فروشگاه</button>
                <button id="help-btn" class="btn btn-secondary">❓ راهنما</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="stars-bg"></div>
        <div class="game-hud">
            <button class="pause-btn" id="stop-btn">
                <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            </button>
            <div class="hud-progress" id="hud-progress">داستان ۱ از ۵</div>
            <div class="coin-display">
                <img src="/games/assets/icons/coin.png" class="coin-icon-img">
                <div class="coin-amount" id="game-coins">۰</div>
            </div>
        </div>
        <div id="narrator" class="narrator">
            <div class="narrator-bubble">
                <p id="narrator-text">سلام کوچولو! آماده یک ماجراجویی ریاضی هستی؟</p>
            </div>
            <div class="narrator-character">
                <img src="/games/assets/icons/gamerhi.png" alt="راوی" class="narrator-img">
            </div>
        </div>
        <div id="game-stage" class="game-stage"></div>
        <div id="items-zone" class="items-zone"></div>
        <div id="answer-cards" class="answer-cards"></div>
    </div>

    <!-- Pause Menu Overlay -->
    <div id="pause-overlay">
        <div class="pause-card">
            <div class="pause-icon-circle">
                <div class="pause-icon"></div>
            </div>
            <h2 class="pause-title">بازی متوقف شد</h2>
            <button class="pause-menu-btn pause-btn-primary" id="menu-continue-btn">ادامه دادن</button>
            <button class="pause-menu-btn pause-btn-secondary" id="menu-restart-btn">شروع مجدد</button>
            <button class="pause-menu-btn pause-btn-danger" id="menu-home-btn">منوی اصلی</button>
        </div>
    </div>

    <!-- Shop Screen -->
    <div id="shop-screen" class="screen">
        <div class="shop-header">
            <h2 class="shop-title">فروشگاه فضاها</h2>
            <div class="coin-display">
                <img src="/games/assets/icons/coin.png" class="coin-icon-img">
                <div class="coin-amount" id="shop-coins">۰</div>
            </div>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="btn btn-primary" id="shop-back-btn" style="margin-top: 20px;">بازگشت</button>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen">
        <div class="stars-bg"></div>
        <div class="confetti-container" id="confetti"></div>
        <div class="end-card glass">
            <div class="trophy">🏆</div>
            <h2 class="end-title">آفرین! تمومش کردی!</h2>
            <div class="stars-earned">
                <div class="earned-star es1">⭐</div>
                <div class="earned-star es2">⭐</div>
                <div class="earned-star es3">⭐</div>
            </div>
            <div class="game-info">
                <p>امتیاز نهایی:</p>
                <span id="final-score">۰</span>
            </div>
            <div class="coin-reward">
                <img src="/games/assets/icons/coin.png" class="coin-reward-icon-img">
                <span>+<span id="reward-coins">۱۰</span> سکه لوکو</span>
            </div>
            <button id="end-home-btn" class="btn btn-primary">بازگشت به منو</button>
        </div>
    </div>

    <!-- Overlays -->
    <div id="story-cloud" class="story-cloud">
        <div class="cloud-shape">
            <p class="cloud-text">بریم داستان بعدی! 🌟</p>
        </div>
    </div>
    <div id="celebration" class="celebration">
        <div class="celebration-text">آفرین! 🎉</div>
    </div>
    <div id="sticker-feedback" class="sticker-feedback"></div>
</div>
